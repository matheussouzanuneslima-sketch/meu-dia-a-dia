<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Dia</title>
<meta name="description" content="Presença, hábitos, finanças, estudos e vida, num app só.">
<meta name="theme-color" content="#faf6f2" id="corTema">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-180.png">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf6f2; --card: #ffffff; --tx: #1f1a17; --sub: #8a7f77; --line: #f0e6dd; --soft: #f6f0ea; --soft2: #fbf8f5;
    --inp: #e7dcd2; --tab: #f3ece6; --acc: #1f1a17; --acct: #c2410c; --acc2: #ffe4cf;
    --sh: 0 1px 2px rgba(31,26,23,.03), 0 3px 12px rgba(31,26,23,.04);
    --escuro: #1f1a17; --escuro2: #2a2420; --escuro-tx: #fff; --escuro-sub: #c9bfb8; --pessego: #ffd9bf; --pessego2: #fff8f2; --pessego-tx: #5b2a0e; --laranja: #fdba74; --marrom: #7c2d12;
    --g: #16a34a; --g2: #dcfce7; --b: #2563eb; --b2: #dbeafe; --o: #d97706; --o2: #fef3c7;
    --r: #dc2626; --r2: #fee2e2; --p: #7e22ce; --p2: #f3e8ff; --t: #0f766e; --t2: #ccfbf1; --rosa: #ec4899;
    --warnbg: #fff7e6; --warnbd: #fde3a7; --expbg: #fff1f1; --expbd: #fecaca;
    --grad1: #0b4f6c; --grad2: #1b86a8; --c1: #1f7ea6; --c2: #e8853a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #14110f; --card: #1e1a17; --tx: #f3ede8; --sub: #a99d94; --line: #2e2723; --soft: #26201c; --soft2: #1a1613;
    --inp: #3a322d; --tab: #26201c; --acc: #c2410c; --acct: #fdba74; --acc2: rgba(251,146,60,.16);
    --sh: 0 0 0 1px #2a231f;
    --escuro: #2a2420; --escuro2: #352d28; --escuro-tx: #fff; --escuro-sub: #c9bfb8; --pessego: #3b2416; --pessego2: #2a1d14; --pessego-tx: #fdba74; --laranja: #fdba74; --marrom: #c2410c;
    --g: #4ade80; --g2: rgba(34,197,94,.16); --b: #93c5fd; --b2: rgba(59,130,246,.18); --o: #fbbf24; --o2: rgba(245,158,11,.16);
    --r: #f87171; --r2: rgba(239,68,68,.16); --p: #d8b4fe; --p2: rgba(168,85,247,.18); --t: #5eead4; --t2: rgba(20,184,166,.16);
    --warnbg: rgba(245,158,11,.10); --warnbd: rgba(245,158,11,.35); --expbg: rgba(239,68,68,.10); --expbd: rgba(239,68,68,.35);
    --c1: #2f96c2; --c2: #c86f2e;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #14110f; --card: #1e1a17; --tx: #f3ede8; --sub: #a99d94; --line: #2e2723; --soft: #26201c; --soft2: #1a1613;
    --inp: #3a322d; --tab: #26201c; --acc: #c2410c; --acct: #fdba74; --acc2: rgba(251,146,60,.16);
    --sh: 0 0 0 1px #2a231f;
    --escuro: #2a2420; --escuro2: #352d28; --escuro-tx: #fff; --escuro-sub: #c9bfb8; --pessego: #3b2416; --pessego2: #2a1d14; --pessego-tx: #fdba74; --laranja: #fdba74; --marrom: #c2410c;
    --g: #4ade80; --g2: rgba(34,197,94,.16); --b: #93c5fd; --b2: rgba(59,130,246,.18); --o: #fbbf24; --o2: rgba(245,158,11,.16);
    --r: #f87171; --r2: rgba(239,68,68,.16); --p: #d8b4fe; --p2: rgba(168,85,247,.18); --t: #5eead4; --t2: rgba(20,184,166,.16);
    --warnbg: rgba(245,158,11,.10); --warnbd: rgba(245,158,11,.35); --expbg: rgba(239,68,68,.10); --expbd: rgba(239,68,68,.35);
    --c1: #2f96c2; --c2: #c86f2e;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--tx); font: 14px/1.4 Urbanist, system-ui, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior-y: none; padding-top: env(safe-area-inset-top); }
  button, .day, .row, .appi, .chip { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  [data-a] { cursor: pointer; }
  button:focus-visible, [data-a]:focus-visible { outline: 2px solid var(--acct); outline-offset: 2px; }

  .app { display: flex; min-height: 100vh; }
  .side { width: 236px; background: var(--card); border-right: 1px solid var(--line); padding: 22px 14px; display: none; flex-direction: column; gap: 2px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; margin: 0 6px 22px; }
  .logo i { width: 34px; height: 34px; border-radius: 10px; background: var(--acc); display: grid; place-items: center; color: #fff; font-style: normal; }
  .navi { padding: 9px 12px; border-radius: 10px; color: var(--sub); font-weight: 600; display: flex; gap: 10px; align-items: center; text-align: left; }
  .navi:hover { background: var(--soft); }
  .navi.on { background: var(--acc2); color: var(--acct); }
  .navsep { font-size: 11px; font-weight: 800; color: var(--sub); opacity: .7; letter-spacing: .6px; margin: 14px 12px 4px; }
  .main { flex: 1; padding: 16px 16px calc(110px + env(safe-area-inset-bottom)); max-width: 1240px; margin: 0 auto; width: 100%; min-width: 0; }
  @media (min-width: 1700px) { .main { max-width: 1480px; } }

  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
  .hello { min-width: 0; }
  .hello small { color: var(--sub); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hello b { font-size: 21px; font-weight: 800; letter-spacing: -.3px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .btnp { background: var(--acc); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .btns { background: var(--card); color: var(--tx); border: 1px solid var(--inp); border-radius: 12px; padding: 9px 13px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .card { background: var(--card); border-radius: 18px; box-shadow: var(--sh); padding: 16px; min-width: 0; }
  .grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-content: start; }
  .mb { margin-bottom: 14px; }
  .sec { font-size: 12.5px; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sec .lk { color: var(--acct); text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 700; text-decoration: none; }
  .vazio { color: var(--sub); font-size: 13px; padding: 10px 0; text-align: center; }
  .nota { color: var(--sub); font-size: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpis.k2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { background: var(--card); border-radius: 16px; box-shadow: var(--sh); padding: 12px; min-width: 0; }
  .kpi .v { font-size: 19px; font-weight: 800; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11px; color: var(--sub); font-weight: 600; margin-top: 2px; }
  .kpi.wide { grid-column: span 3; display: flex; align-items: center; gap: 14px; }
  .kpi.wide .v { font-size: 26px; }
  .ring { width: 60px; height: 60px; flex: none; }

  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 2px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { color: var(--sub); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--soft); }
  .pill { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 20px; white-space: nowrap; }
  .pg { background: var(--g2); color: var(--g); } .pb { background: var(--b2); color: var(--b); } .po { background: var(--o2); color: var(--o); }
  .pr { background: var(--r2); color: var(--r); } .pp { background: var(--p2); color: var(--p); } .pt { background: var(--t2); color: var(--t); } .pn { background: var(--soft); color: var(--sub); }
  .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; border-radius: 8px; background: var(--acc); }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding: 2px 2px 6px; scrollbar-width: none; }
  .chip { padding: 7px 12px; border-radius: 20px; background: var(--card); box-shadow: var(--sh); font-weight: 700; font-size: 12.5px; color: var(--sub); white-space: nowrap; flex: none; }
  .chip.on { background: var(--acc); color: #fff; }
  .tabs { display: flex; background: var(--tab); border-radius: 12px; padding: 4px; gap: 2px; margin-bottom: 12px; }
  .tabs button { flex: 1; text-align: center; padding: 7px 0; border-radius: 9px; font-weight: 700; color: var(--sub); font-size: 12.5px; }
  .tabs button.on { background: var(--card); color: var(--tx); box-shadow: var(--sh); }
  .arrows { display: flex; gap: 6px; }
  .arrows button { width: 32px; height: 32px; border-radius: 10px; background: var(--acc2); color: var(--acct); font-weight: 800; font-size: 16px; }
  .quote { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: #fff; border-radius: 18px; padding: 16px; font-size: 13.5px; line-height: 1.5; }
  .quote b { display: block; font-size: 11px; letter-spacing: .8px; opacity: .75; margin-bottom: 6px; }
  .val { font-weight: 800; font-size: 13.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .neg { color: var(--r); } .pos { color: var(--g); }
  .lin { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; gap: 8px; }

  /* início */
  .hero { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: #fff; border-radius: 22px; padding: 18px; display: grid; gap: 14px; }
  .hero .l1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hero h3 { font-size: 13px; font-weight: 700; opacity: .8; letter-spacing: .4px; text-transform: uppercase; }
  .hero .st { font-size: 20px; font-weight: 800; margin-top: 4px; letter-spacing: -.3px; }
  .hero .st small { display: block; font-size: 12.5px; font-weight: 600; opacity: .85; margin-top: 2px; letter-spacing: 0; }
  .hero .mini { text-align: center; flex: none; }
  .hero .mini svg { width: 64px; height: 64px; }
  .hero .mini small { display: block; font-size: 11px; font-weight: 700; opacity: .85; }
  .atalhos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .atalhos button { background: rgba(255,255,255,.13); color: #fff; border-radius: 14px; padding: 10px 4px; font-weight: 700; font-size: 11.5px; display: grid; gap: 4px; justify-items: center; }
  .atalhos button span { font-size: 20px; }
  .agenda .dia { font-size: 11.5px; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 2px; }
  .agenda .dia:first-child { margin-top: 0; }
  .agenda .it { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; font-weight: 600; }
  .agenda .it span:first-child { width: 26px; text-align: center; font-size: 16px; }
  .agenda .it small { margin-left: auto; color: var(--sub); font-weight: 700; font-size: 12px; white-space: nowrap; }

  /* calendário de presença */
  .mhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .mhead b { font-size: 17px; font-weight: 800; }
  .wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .wk .h { font-size: 11px; color: var(--sub); text-align: center; font-weight: 700; }
  .day { aspect-ratio: 1 / 1.08; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; font-weight: 700; min-width: 0; }
  .day .n { font-size: 11px; opacity: .75; font-weight: 600; }
  .day .c { font-size: 11px; font-weight: 800; letter-spacing: -.2px; max-width: 100%; overflow: hidden; }
  .day.empty { background: transparent; cursor: default; }
  .day.blank { border: 1.5px dashed var(--line); color: var(--sub); }
  .day.fer { border-color: var(--p); }
  .day.today { outline: 2.5px solid var(--acct); outline-offset: 1.5px; }
  .day.cob::before { content: ''; position: absolute; inset: 3px; border: 2px solid var(--rosa); border-radius: 9px; }
  .day.obs::after { content: ''; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
  .navcal { display: flex; gap: 6px; align-items: center; }
  .hojeb { height: 32px; padding: 0 11px; border-radius: 10px; background: var(--acc2); color: var(--acct); font-weight: 800; font-size: 12.5px; }
  .day.pulse { animation: pulsar 1.2s ease-out 2; }
  @keyframes pulsar { 0% { box-shadow: 0 0 0 0 rgba(56,189,248,.7); } 100% { box-shadow: 0 0 0 14px rgba(56,189,248,0); } }
  .anots { margin-top: 18px; }
  .anot { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
  .anot:first-of-type { border-top: 0; }
  .anot .dnum { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; flex: none; font-variant-numeric: tabular-nums; }
  .anot .t { flex: 1; min-width: 0; }
  .anot .t b { display: block; font-size: 13.5px; font-weight: 600; }
  .anot .t small { color: var(--sub); font-size: 12px; }
  [id^="fin-"] { scroll-margin-top: 14px; }
  .chips.fixo { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -16px 12px; padding: 8px 16px; }
  .leg { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; font-size: 12px; color: var(--sub); font-weight: 600; }
  .leg span { display: flex; align-items: center; gap: 6px; }
  .leg i { width: 10px; height: 10px; border-radius: 3px; }
  .year { display: grid; grid-template-columns: 30px repeat(31, minmax(0, 1fr)); gap: 2px; }
  .year .ml { font-weight: 700; color: var(--sub); font-size: 10px; display: flex; align-items: center; }
  .year .yc { aspect-ratio: 1; border-radius: 3px; }
  .alert { border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--warnbg); border: 1px solid var(--warnbd); margin-bottom: 8px; }
  .alert.exp { background: var(--expbg); border-color: var(--expbd); }
  .alert .ic { background: #f59e0b; }
  .alert.exp .ic { background: #ef4444; }
  .alert b { display: block; font-size: 14px; }
  .alert small { color: var(--sub); font-size: 12px; }
  .alert .dias { margin-left: auto; text-align: center; font-weight: 800; font-size: 22px; color: var(--o); line-height: 1; }
  .alert.exp .dias { color: var(--r); }
  .alert .dias small { display: block; font-size: 10px; font-weight: 600; }

  /* hábitos */
  .hab { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 27px); gap: 6px 4px; align-items: center; }
  .hab .h { font-size: 10.5px; font-weight: 800; color: var(--sub); text-align: center; line-height: 1.25; }
  .hab .h.hj { color: var(--acct); }
  .hab .n { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .hab .n span { overflow: hidden; text-overflow: ellipsis; }
  .hab .n small { color: var(--sub); font-weight: 600; font-size: 10.5px; margin-left: auto; padding-right: 2px; }
  .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-size: 12px; color: #fff; font-weight: 800; margin: auto; }
  .dot.y { background: #16a34a; }
  .dot.meio { background: #bbf7d0; color: #14532d; font-size: 9.5px; }
  .qtd-hab { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 18px 0 8px; }
  .qtd-hab button { width: 56px; height: 56px; border-radius: 16px; background: var(--soft); font-size: 26px; font-weight: 800; color: var(--tx); }
  .qtd-hab .v { font-size: 34px; font-weight: 800; min-width: 120px; text-align: center; font-variant-numeric: tabular-nums; }
  .qtd-hab .v small { display: block; font-size: 13px; color: var(--sub); font-weight: 700; }
  .mais { margin-left: auto; background: var(--acc2); color: var(--acct); font-weight: 800; font-size: 12px; padding: 5px 9px; border-radius: 9px; flex: none; }
  .ferias-p { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ferias-p:last-child { border-bottom: 0; }
  .dot.hj { box-shadow: inset 0 0 0 2px var(--acct); }
  .dot.y.hj { box-shadow: none; }
  .dot.fut { background: transparent; border: 1.5px dashed var(--line); cursor: default; }
  .todo { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
  .todo:first-child { border-top: 0; }
  .todo .tx { flex: 1; min-width: 0; }
  .cb { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--inp); flex: none; display: grid; place-items: center; font-size: 12px; color: #fff; }
  .cb.y { background: #16a34a; border-color: #16a34a; }
  .todo.done .tx { text-decoration: line-through; color: var(--sub); }
  .add { color: var(--acct); font-weight: 700; font-size: 13px; padding: 10px 0 2px; display: block; }

  /* financeiro */
  .saldo { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: #fff; border-radius: 20px; padding: 18px; }
  .saldo small { opacity: .8; font-size: 12px; font-weight: 600; }
  .saldo .v { font-size: 30px; font-weight: 800; letter-spacing: -.8px; margin: 2px 0 14px; font-variant-numeric: tabular-nums; }
  .saldo .io { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .saldo .io div { background: rgba(255,255,255,.12); border-radius: 12px; padding: 9px 10px; min-width: 0; }
  .saldo .io b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saldo .io span { font-size: 10.5px; opacity: .85; font-weight: 600; }
  .saldo .arrows button { background: rgba(255,255,255,.15); color: #fff; }
  .donut { display: flex; gap: 16px; align-items: center; }
  .donut .d { width: 118px; height: 118px; border-radius: 50%; flex: none; position: relative; }
  .donut .d::after { content: ''; position: absolute; inset: 22px; background: var(--card); border-radius: 50%; }
  .donut .d span { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; font-weight: 800; font-size: 13px; text-align: center; line-height: 1.1; }
  .donut .d span small { display: block; font-size: 10px; color: var(--sub); font-weight: 600; }
  .lg { flex: 1; display: grid; gap: 7px; min-width: 0; }
  .lg div { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
  .lg i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .lg b { margin-left: auto; }
  .meta-top { display: flex; gap: 14px; align-items: center; }
  .meta-top .ic { width: 52px; height: 52px; font-size: 26px; border-radius: 16px; }
  .meta-num { font-size: 22px; font-weight: 800; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
  .onde { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mov { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .mov:first-child { border-top: 0; }
  .mov .t { flex: 1; min-width: 0; }
  .mov .t b { display: block; font-size: 13px; }
  .mov .t small { color: var(--sub); font-size: 12px; }

  /* faculdade */
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .ev { position: relative; padding: 0 0 14px; }

  diaAberto: null, codigoSel: '', form: null, auto: null,

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const iso = (a, m, d) => `${a}-${pad(m)}-${pad(d)}`;
const hojeIso = () => { const h = new Date(); return iso(h.getFullYear(), h.getMonth() + 1, h.getDate()); };
const paraDate = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d || 1); };
const deDate = d => iso(d.getFullYear(), d.getMonth() + 1, d.getDate());
const somaDias = (s, n) => { const d = paraDate(s); d.setDate(d.getDate() + n); return deDate(d); };
const difDias = (a, b) => Math.round((paraDate(b) - paraDate(a)) / 86400000);
const somaMes = (ym, n) => { const d = paraDate(ym + '-01'); d.setMonth(d.getMonth() + n); return deDate(d).slice(0, 7); };
const diasNoMes = (a, m) => new Date(a, m, 0).getDate();
const fmt = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '—';
const fmtCurto = s => s ? fmt(s).slice(0, 5) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Esconder valores (👁️): todos os R$ do app passam por aqui
const brl = v => E.ocultar ? 'R$ ••••' : 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brlCurto = v => E.ocultar ? 'R$ ••••' : 'R$ ' + Math.round(Number(v) || 0).toLocaleString('pt-BR');
// Valor curto para os quadradinhos do Início (o "R$" fica no rótulo): 950 · -2,2 mil · 15 mil
const brlCompacto = v => { const n = Number(v) || 0, a = Math.abs(n);
  if (E.ocultar) return '••••';
  if (a < 1000) return Math.round(n).toLocaleString('pt-BR');
  return (n < 0 ? '-' : '') + (a >= 10000 ? Math.round(a / 1000) : String(Math.round(a / 100) / 10).replace('.', ',')) + ' mil'; };
// Tamanho do texto: vale só para este aparelho (no S25 um, no computador outro)
const TAMANHOS = { 'Pequeno': 0.88, 'Normal': 1, 'Grande': 1.12, 'Muito grande': 1.25 };
const tamanhoAtual = () => { const t = ls.get('mdd_tamanho'); return TAMANHOS[t] ? t : 'Normal'; };
function aplicarTamanho() { document.documentElement.style.zoom = TAMANHOS[tamanhoAtual()]; }
function abrirTamanho() {

/** POST simples (text/plain, sem pré-checagem de CORS) para o /exec do Apps Script. */
async function chamarPonte(c, fn, args) {

/** Grava no servidor; sem internet, guarda na fila do aparelho e envia depois. */
async function gravar(fn, ...args) {
  try {
    const r = await chamar(fn, ...args);
    enviarFila();
    return r;
  } catch (e) {
    if (!semRede(e)) throw e;
    const fila = ls.get(FILA) || [];
    fila.push({ fn, args });
    ls.set(FILA, fila);
    marcarFila();
    salvarCache(true); // a tela já mostra a mudança: guarda agora, caso o app seja fechado em seguida
    return { __offline: true };
  }
}

async function enviarFila() {
  const fila = ls.get(FILA) || [];
  if (enviandoFila || !fila.length) return marcarFila();
  enviandoFila = true;
  try {
    let enviados = 0;
    while (fila.length) {
      try {
        await chamar(fila[0].fn, ...fila[0].args);
      } catch (e) {
        if (semRede(e) || e.codigo === 'chave') throw e; // sem conexão (ou desconectado): tenta de novo depois
        toast('Uma alteração feita sem internet não pôde ser salva: ' + e.message, true); // erro dela: não trava as outras
      }
      fila.shift();
      ls.set(FILA, fila);
      enviados++;
    }

  } catch (e) { /* ainda sem conexão: tenta de novo depois */ } finally { enviandoFila = false; marcarFila(); }
}

// ---------- Férias: programar, aprovar, agendar (e o que já está como FE no calendário) ----------
const ST_FERIAS = [['Pretensão', 'Pretensão', 'pn'], ['Pendente de aprovação', 'Pendente', 'po'], ['Agendada', 'Agendada', 'pb']];
const codigoFerias = () => (E.codigos.find(c => c.categoria === 'Férias') || { codigo: 'FE' }).codigo;
const ehFerias = k => (E.porCodigo[(E.dias[k] || {}).codigo] || {}).categoria === 'Férias';
/** Feriado = nacional/local calculado ou dia marcado como FERI na agenda. */
const ehFeriado = k => !!feriadoDe(k) || /^FERI/.test((E.dias[k] || {}).codigo || '');
const diaUtilFerias = k => ![0, 6].includes(paraDate(k).getDay()) && !ehFeriado(k);
const feriasCorridas = () => /^sim$/i.test(String(cfg('FeriasCorridas', 'não')).trim());
/** Os dias que as férias ocupam: só dias úteis (padrão) ou todos os dias corridos (Ajustes da agenda). */
function diasDasFerias(f) {
  const out = [], n = Math.max(1, num(f.Dias));
  let k = String(f.Inicio).slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return out;
  for (let g = 0; out.length < n && g < 400; g++, k = somaDias(k, 1)) if (feriasCorridas() || diaUtilFerias(k)) out.push(k);
  return out;
}
const fimFerias = f => { const d = diasDasFerias(f); return d[d.length - 1] || String(f.Inicio).slice(0, 10); };
/** Dia de voltar: o próximo dia útil depois do último dia de férias. */
function voltaDe(inicio, dias) {

}
function feriasPlanejadas() {

/** Todos os blocos de FE do calendário (fim de semana e feriado no meio não quebram o bloco). */
function blocosFerias() {
  const blocos = [];
  Object.keys(E.dias).filter(ehFerias).sort().forEach(k => {
    const b = blocos[blocos.length - 1];
    let junto = !!b;
    if (b) for (let x = somaDias(b.fim, 1); x < k; x = somaDias(x, 1)) if (diaUtilFerias(x) && !naoTrabalha((E.dias[x] || {}).codigo)) { junto = false; break; }
    if (junto) { b.fim = k; b.Dias++; } else blocos.push({ Inicio: k, fim: k, Dias: 1 });
  });
  return blocos;
}
/** Blocos de FE do calendário que ainda não têm cadastro de férias (fim de semana e feriado no meio não quebram o bloco). */
function feriasDoCalendario() {
  const fe = Object.keys(E.dias).filter(ehFerias).sort(), blocos = [];
  fe.forEach(k => {
    const b = blocos[blocos.length - 1];
    let junto = false;
    if (b) { junto = true; for (let x = somaDias(b.fim, 1); x < k; x = somaDias(x, 1)) if (diaUtilFerias(x) && !naoTrabalha((E.dias[x] || {}).codigo)) { junto = false; break; } }
    if (junto) { b.fim = k; b.Dias++; } else blocos.push({ Inicio: k, fim: k, Dias: 1 });
  });
  const cadastrados = new Set(T('Ferias').filter(f => f.Status === 'Agendada').flatMap(diasDasFerias));
  return blocos.filter(b => !fe.some(k => k >= b.Inicio && k <= b.fim && cadastrados.has(k))).map(b => Object.assign(b, { Status: 'Agendada', doCal: true }));

// "dentista sexta 14h", "reunião amanhã 9:30", "aula toda terça 19h", "aniversário 12/11"
const PALAVRAS_COMP = { 'Saúde': /dentist|medic|consult|exame|psic|fisio|terap|clinica|hospital|vacina|nutri|dermato|oftalm|cardio|ortop|gineco|laborat/,
  'Trabalho': /reuni|trabalho|cliente|plantao|entrevista|escritorio|empresa|chefe|\brh\b|treinamento|call\b/,
  'Estudos': /prova|aula|facul|curso|apresenta|seminario|palestra|estud|tcc|orientac|matricula/ };
const DIAS_TXT = [['domingo', 0], ['segunda', 1], ['terca', 2], ['quarta', 3], ['quinta', 4], ['sexta', 5], ['sabado', 6], ['dom', 0], ['seg', 1], ['ter', 2], ['qua', 3], ['qui', 4], ['sex', 5], ['sab', 6]];
function interpretarCompromisso(texto) {
  let orig = ' ' + String(texto || '') + ' ', plano = semAcento(orig).toLowerCase();
  const o = {}, hoje = hojeIso();
  const tirar = m => { const a = m.index, b = a + m[0].length; orig = orig.slice(0, a) + ' ' + orig.slice(b); plano = plano.slice(0, a) + ' ' + plano.slice(b); };
  let m = plano.match(/\s(?:as\s+|a\s+partir\s+das\s+)?(\d{1,2})\s*(?:h|:|horas?\b)\s*(\d{2})?(?:min)?(?=\s)/);
  if (m && +m[1] < 24 && (!m[2] || +m[2] < 60)) { o.Hora = pad(+m[1]) + ':' + (m[2] || '00'); tirar(m); }
  if ((m = plano.match(/\s(toda|todo)\s+(semana|mes|ano)\b/)) || (m = plano.match(/\s(semanal|mensal|anual)(mente)?\b/))) {
    const w = m[2] && !/mente/.test(m[2]) ? m[2] : m[1]; o.Repetir = /seman/.test(w) ? 'Semanal' : /mes|mensal/.test(w) ? 'Mensal' : 'Anual'; tirar(m);
  }
  if ((m = plano.match(/\sdepois\s+de\s+amanha\b/))) { o.Data = somaDias(hoje, 2); tirar(m); }
  else if ((m = plano.match(/\samanha\b/))) { o.Data = somaDias(hoje, 1); tirar(m); }
  else if ((m = plano.match(/\shoje\b/))) { o.Data = hoje; tirar(m); }
  else if ((m = plano.match(/\s(?:dia\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/))) {
    const a = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : +hoje.slice(0, 4);
    if (+m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= diasNoMes(a, +m[2])) {
      let k = iso(a, +m[2], +m[1]); if (!m[3] && k < hoje) k = iso(a + 1, +m[2], Math.min(+m[1], diasNoMes(a + 1, +m[2])));
      o.Data = k; tirar(m);
    }
  } else if ((m = plano.match(/\sdia\s+(\d{1,2})\b/))) {
    let ym = hoje.slice(0, 7); if (+m[1] < +hoje.slice(8)) ym = somaMes(ym, 1);
    const [a, mm] = ym.split('-').map(Number); if (+m[1] >= 1 && +m[1] <= diasNoMes(a, mm)) { o.Data = iso(a, mm, +m[1]); tirar(m); }
  }
  if (!o.Data) for (const [nome, w] of DIAS_TXT) {
    const re = new RegExp('\\s(?:(toda|todo)s?\\s+(?:as\\s+|os\\s+)?)?(?:(proxim[ao])\\s+|n[ao]\\s+|na\\s+proxima\\s+)?' + nome + '(?:s|-feiras?|\\s+feira)?(?=\\s)');
    if ((m = plano.match(re))) {
      let n = (w - paraDate(hoje).getDay() + 7) % 7; if (m[2] && n === 0) n = 7;
      o.Data = somaDias(hoje, n); if (m[1]) o.Repetir = 'Semanal'; tirar(m); break;
    }
  }
  const tipo = Object.keys(PALAVRAS_COMP).find(t => PALAVRAS_COMP[t].test(plano));
  if (tipo) o.Tipo = tipo;
  const tit = orig.replace(/\s+(as|às|no|na|em|de|dia|para|pra)\s*$/i, ' ').replace(/^\s*(as|às|no|na|em|de|dia)\s+/i, '').replace(/\s+/g, ' ').trim();
  if (tit) o.Titulo = maiuscula(tit);
  return o;
}

// ---------- Foto da capa: reduzida no aparelho (cabe numa célula da planilha) ----------
function reduzirFoto(arq) {
  const url = URL.createObjectURL(arq);
  return reduzirSrc(url).finally(() => URL.revokeObjectURL(url));
}
function reduzirSrc(url) {
  return new Promise((ok, erro) => {
    const img = new Image();
    img.onload = () => {
      const [mw, mh] = E.capaTipo === 'lugar' ? [480, 320] : [220, 330]; // foto de lugar é deitada; capa de livro, em pé
      const esc = Math.min(1, mw / img.width, mh / img.height), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * esc); cv.height = Math.round(img.height * esc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      let q = 0.8, d = cv.toDataURL('image/jpeg', q);
      while (d.length > 40000 && q > 0.3) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
      ok(d);
    };
    img.onerror = () => erro(new Error('Não deu para abrir essa imagem.'));
    if (!/^(data|blob):/.test(url)) img.crossOrigin = 'anonymous'; // sites que permitem viram foto guardada
    img.src = url;
  });
}
/** Fotos de um lugar: Wikipédia e Wikimedia Commons pela ponte, com atalhos para o Pinterest e o Google Imagens. */
async function buscarFotosLugar() {
  const n = (($('f_Nome') || {}).value || '').trim(), cid = (($('f_Cidade') || {}).value || '').trim(), q = [n, cid].filter(Boolean).join(' ');

  const links = `<a class="lk" href="https://br.pinterest.com/search/pins/?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${ic('search')} Pinterest</a> · <a class="lk" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${ic('search')} Google Imagens</a>`;
  try {
    const fs = await chamar('buscarImagens', q);
    caixa.innerHTML = `<div class="capas fotos">${fs.map(u => `<button type="button" data-a="capaEscolher" data-u="${esc(u)}"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>`).join('') || '<p class="nota">Nenhuma foto achada. Tente os atalhos abaixo.</p>'}</div>
      <p class="nota" style="margin-top:6px">Toque numa foto para usar. Ou procure no ${links} · copie o link da imagem e use “Colar link”.</p>`;

/** Baixa a capa pela ponte (sem bloqueio do navegador), reduz e coloca no formulário. */
async function usarCapaDaInternet(url) {
  const caixa = $('capaBusca');
  if (caixa) caixa.innerHTML = '<p class="nota" style="margin-top:8px">Baixando a imagem…</p>';
  try {
    let baixada = /^data:image\//.test(url) ? url : await PonteFB.baixarImagem(url); // direto do aparelho, quando o site deixa
    if (baixada === url && !/^data:/.test(url) && !modoFirebase()) baixada = await chamar('baixarImagem', url).catch(() => url); // senão, pela ponte da planilha
    let d; try { d = await reduzirSrc(baixada); } catch (e) { if (/^https?:/.test(baixada)) d = baixada; else throw e; } // site que não deixa baixar: fica o link da imagem
    $(E.capaCampo || 'f_Capa').value = d; $('capaPrev').innerHTML = `<img src="${d}" alt="">`; E.sujo = true;

  } catch (err) { if (caixa) caixa.innerHTML = ''; toast(semRede(err) ? 'Sem internet agora.' : err.message, true); }
}

function diasParaPreparar(ym, o) {
  const [a, m] = ym.split('-').map(Number);
  const lista = [];
  for (let d = 1; d <= diasNoMes(a, m); d++) {
    const k = iso(a, m, d);
    if (E.dias[k]) continue;
    const sem = paraDate(k).getDay(), fer = feriadoDe(k);
    if (o.fer && fer) lista.push({ data: k, codigo: 'FERI', titulo: fer });
    else if (o.dom && sem === 0) lista.push({ data: k, codigo: 'DOM' });
    else if (o.sab && sem === 6) lista.push({ data: k, codigo: 'SÁB' });
  }
  return lista;
}
const opcoesPreparar = () => ({ dom: liga('PrepararDom'), sab: /^sim$/i.test(String(cfg('PrepararSab', 'não')).trim()), fer: liga('PrepararFer') });
/** Ao abrir o app: prepara o mês atual e o próximo (uma vez cada), só nos dias vazios. */
/** Grava vários dias (trocando o status) e mostra na hora. */
async function marcarDiasLocal(mud) {
  if (!mud.length) return;
  const antes = mud.map(d => [d.data, E.dias[d.data]]);
  mud.forEach(aplicarDia); render();
  try { await gravar('marcarDias', mud); salvarCache(); return true; }
  catch (e) { antes.forEach(([k, g]) => { if (g) E.dias[k] = g; else delete E.dias[k]; }); render(); toast('Erro ao atualizar o calendário: ' + e.message, true); }
}
/** Tira o antigo "cobrindo férias" dos dias que ainda têm (um dia que só tinha isso é apagado). */
function limparCobrindo() {
  const mud = (E.cobrindoAntigos || []).map(k => { const g = E.dias[k] || {}; return { data: k, codigo: g.codigo || '', cobrindo: false, obs: g.obs || '', titulo: g.titulo || '' }; });
  E.cobrindoAntigos = [];
  return marcarDiasLocal(mud);
}
/** Folgas com data que ainda não aparecem no calendário ganham o código delas (FC, FBH, DAYOFF). */
function sincronizarFolgas() {
  const mud = [];
  E.folgas.forEach(f => {
    const cod = E.codigoDaFolga[String(f.tipo).toUpperCase()], g = E.dias[f.folga] || {};
    if (f.folga && cod && E.porCodigo[cod] && (!g.codigo || naoTrabalha(g.codigo)) && !mud.some(m => m.data === f.folga))
      mud.push({ data: f.folga, codigo: cod, cobrindo: !!g.cobrindo, obs: g.obs || '', titulo: g.titulo || '' });
  });
  return marcarDiasLocal(mud);
}

async function prepararAutomatico() {
  if (!liga('PrepararAuto') || !E.codigos.some(c => c.codigo === 'DOM')) return;
  const feitos = String(cfg('MesesPreparados', '')).split(',').filter(Boolean);

  if (!meses.length) return;

      if (o.tipo !== 'FOLGA COMPENSATÓRIA') o.trabalhada = '';
      o.marcar = true; // a data da folga entra no calendário com o código dela
      const velho = f && f.folga && f.folga !== o.folga && E.dias[f.folga] && E.dias[f.folga].codigo === E.codigoDaFolga[f.tipo] ? f.folga : '';
      fecharVeu();
      if (velho) { const g = E.dias[velho]; marcarDiasLocal([{ data: velho, codigo: '', cobrindo: !!g.cobrindo, obs: g.obs || '', titulo: g.titulo || '' }]); }
      if (!o.id) o.id = uid();
      try {
        let r = await gravar('salvarFolga', o);
        if (avisoOffline(r)) { // sem internet: monta localmente o que o servidor devolveria
          const cod = E.codigoDaFolga[o.tipo], atual = E.dias[o.folga] || {};
          r = { folga: Object.assign({}, o), dia: o.marcar && o.folga && cod ? { data: o.folga, codigo: cod, cobrindo: !!atual.cobrindo, obs: atual.obs || o.anotacoes || '', titulo: atual.titulo || '' } : null };
        }
        salvarCache();
        const i = E.folgas.findIndex(x => x.id === r.folga.id);
        if (i >= 0) E.folgas[i] = r.folga; else E.folgas.push(r.folga);
        aplicarDia(r.dia);
        render();
        toast(r.dia ? 'Folga salva e marcada no calendário ✓' : 'Folga salva ✓');
      } catch (e) { toast('Erro ao salvar folga: ' + e.message, true); }
    },
    excluir: f && (async () => {
      fecharVeu();
      try {
        await gravar('excluirFolga', f.id);
        salvarCache();
        E.folgas = E.folgas.filter(x => x.id !== f.id);
        render();
        toast('Folga excluída', false, { txt: 'Desfazer', fn: async () => {
          E.folgas.push(f); render();
          try { await gravar('salvarFolga', Object.assign({}, f, { marcar: false })); salvarCache(); toast('Folga restaurada ✓'); } catch (e) { toast('Erro ao restaurar: ' + e.message, true); }
        } });
      } catch (e) { toast('Erro ao excluir: ' + e.message, true); }
    }),
  });
}

const inicioSemana = s => { const d = paraDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return deDate(d); };
const habitosAtivos = () => T('Habitos').filter(h => h.Ativo !== false).sort((a, b) => num(a.Ordem) - num(b.Ordem));
const metaSemana = h => { const m = num(h.MetaSemana); return m > 0 && m < 7 ? m : 0; };
// Hábito com quantidade (ex.: 2 L de água): o registro do dia guarda Qtd; conta como feito quando chega na meta
const habPorId = id => T('Habitos').find(h => h.ID === id);
const metaDia = h => num(h && h.MetaDia);
const logDe = (data, hid) => T('HabitosLog').find(l => l.ID === data + '_' + hid);
const feitoLog = l => !!l && (l.Qtd === undefined || l.Qtd === null || l.Qtd === '' || !metaDia(habPorId(l.HabitoID)) || num(l.Qtd) >= metaDia(habPorId(l.HabitoID)));
const feito = (data, hid) => feitoLog(logDe(data, hid));
const qtdDe = (data, hid) => { const l = logDe(data, hid); return !l ? 0 : l.Qtd === undefined || l.Qtd === null || l.Qtd === '' ? metaDia(habPorId(hid)) : num(l.Qtd); };
const fmtQtd = v => String(Math.round(v * 100) / 100).replace('.', ',');
const passoDe = h => num(h.Passo) || (metaDia(h) >= 4 ? Math.round(metaDia(h) / 4) : metaDia(h) >= 1 ? 0.5 : 0.1) || 1;
function abrirQtd(d, hid) {
  const h = habPorId(hid);
  E.qtd = { d, hid, v: qtdDe(d, hid) };
  const pintar = () => { $('qtdV').innerHTML = `${fmtQtd(E.qtd.v)}<small>de ${fmtQtd(metaDia(h))} ${esc(h.Unidade || '')}</small>`; };
  abrirVeu(`<h2>${esc(h.Icone || '')} ${esc(h.Nome)}</h2><div class="sub">${d === hojeIso() ? 'Hoje' : fmt(d)} · meta de ${fmtQtd(metaDia(h))} ${esc(h.Unidade || '')} por dia</div>
    <div class="qtd-hab"><button data-a="qtdPasso" data-n="-1" aria-label="Menos">−</button><div class="v" id="qtdV"></div><button data-a="qtdPasso" data-n="1" aria-label="Mais">+</button></div>
    <div class="extras" style="justify-content:center"><button class="btns" data-a="qtdMeta">✓ Completar a meta</button><button class="btns" data-a="qtdZerar">Zerar</button></div>
    <div class="acoes"><button class="btn sec2" data-a="fechar">Cancelar</button><button class="btn pri" data-a="qtdSalvar">Salvar</button></div>`);
  E.qtd.pintar = pintar; pintar();
}
function gravarQtd(d, hid, v) {
  const id = d + '_' + hid;
  if (v <= 0) { if (logDe(d, hid)) excluirItem('HabitosLog', id, ''); return; }
  salvarItem('HabitosLog', { ID: id, Data: d, HabitoID: hid, Qtd: Math.round(v * 100) / 100 }, '');
}
const feitosNaSemana = (ini, hid) => [...Array(7)].filter((_, i) => feito(somaDias(ini, i), hid)).length;
function sequencia(h) {
  const meta = metaSemana(h);
  if (meta) { // semanas seguidas cumprindo a meta
    let ini = inicioSemana(hojeIso()), n = 0;
    if (feitosNaSemana(ini, h.ID) < meta) ini = somaDias(ini, -7); else n = 1, ini = somaDias(ini, -7);
    while (feitosNaSemana(ini, h.ID) >= meta) { n++; ini = somaDias(ini, -7); }
    return n + ' sem';
  }
  const datas = new Set(T('HabitosLog').filter(l => l.HabitoID === h.ID && feitoLog(l)).map(l => l.Data));
  let d = hojeIso(), n = 0;
  if (!datas.has(d)) d = somaDias(d, -1);
  while (datas.has(d)) { n++; d = somaDias(d, -1); }
  return String(n);
}
function pctSemana(ini) {
  const hab = habitosAtivos(), hoje = hojeIso();
  const decorridos = Math.max(0, Math.min(7, difDias(ini, hoje) + 1));
  if (!hab.length || !decorridos) return null;
  let alvo = 0, ok = 0;
  hab.forEach(h => {
    const meta = metaSemana(h), feitos = feitosNaSemana(ini, h.ID);
    const a = meta || decorridos;
    alvo += a; ok += Math.min(feitos, a);
  });
  return alvo ? ok / alvo : null;
}
const periodo = escopo => escopo === 'semana' ? E.semHab : escopo === 'mes' ? E.semHab.slice(0, 7) : E.semHab.slice(0, 4);

function listaTarefas(escopo, titulo, topo = '') {
  const per = periodo(escopo);
  const itens = T('Tarefas').filter(t => t.Escopo === escopo && String(t.Periodo) === per);
  return `<div class="card"><div class="sec">${titulo}</div>${topo}
    ${itens.map(t => `<div class="todo ${t.Feito ? 'done' : ''}"><div class="cb ${t.Feito ? 'y' : ''}" data-a="tarefa" data-id="${esc(t.ID)}">${t.Feito ? '✓' : ''}</div><span class="tx" data-a="editarTarefa" data-id="${esc(t.ID)}">${esc(t.Titulo)}</span></div>`).join('') || '<div class="vazio">Nada por aqui ainda.</div>'}
    <button class="add" data-a="novaTarefa" data-escopo="${escopo}">+ Adicionar</button></div>`;
}

function secaoHabitos(parte) {
  const ini = E.semHab, hoje = hojeIso(), hab = habitosAtivos();
  const p = pctSemana(ini), pAnt = pctSemana(somaDias(ini, -7));

      ${hab.length ? `<div class="hab"><div></div>${dias.map(d => `<div class="h ${d === hoje ? 'hj' : ''}">${'DSTQQSS'[paraDate(d).getDay()]}<br>${+d.slice(8)}</div>`).join('')}

        dias.map(d => { if (d > hoje) return '<div class="dot fut"></div>';
          const ok = feito(d, h.ID), q = metaDia(h) && !ok ? qtdDe(d, h.ID) : 0;
          return `<div class="dot ${ok ? 'y' : q ? 'meio' : ''} ${d === hoje ? 'hj' : ''}" data-a="hab" data-d="${d}" data-h="${esc(h.ID)}">${ok ? '✓' : q ? fmtQtd(q) : ''}</div>`; }).join(''); }).join('')}</div>
      ${p == null ? '' : `${bar(p * 100, '#16a34a')}<small class="nota" style="font-weight:600">${Math.round(p * 100)}% da semana cumprida${pAnt == null ? '' : ` · semana anterior: ${Math.round(pAnt * 100)}%`}</small>`}`

  } else {

    const ate = ym === hoje.slice(0, 7) ? +hoje.slice(8) : ym > hoje.slice(0, 7) ? 0 : diasNoMes(a, m);
    corpo = `<div class="mhead"><b style="font-size:14px">${nomeMes(ym)}</b><div class="arrows so-pc"><button data-a="mesHab" data-n="-1" aria-label="Mês anterior">‹</button><button data-a="mesHab" data-n="1" aria-label="Próximo mês">›</button></div></div>
      ${hab.map(h => { const n = T('HabitosLog').filter(l => l.HabitoID === h.ID && String(l.Data).slice(0, 7) === ym && feitoLog(l)).length;
        const alvo = metaSemana(h) ? Math.round(metaSemana(h) * ate / 7) : ate;
        return `<div style="margin-bottom:12px"><div class="lin"><span>${esc(h.Icone || '')} ${esc(h.Nome)}</span><span>${n}/${alvo} ${metaSemana(h) ? '(meta ' + metaSemana(h) + 'x/sem)' : 'dias'}</span></div>${bar(alvo ? n / alvo * 100 : 0, '#16a34a')}</div>`; }).join('') || '<div class="vazio">Nenhum hábito.</div>'}`;
  }
  const esc_ = E.abaTodo || 'semana', titulos = { semana: 'Da semana', mes: 'Do mês', ano: 'Metas do ano' };
  if (parte === 'todo') return `<div id="cal-todos" class="discreto" style="scroll-margin-top:60px">${listaTarefas(esc_, 'To-dos', `<div class="chips mini">${Object.entries(titulos).map(([k, l]) => `<button class="chip ${esc_ === k ? 'on' : ''}" data-a="abaTodo" data-v="${k}">${l}</button>`).join('')}</div>`)}</div>`;
  return `<div class="discreto" id="cal-habitos" style="scroll-margin-top:60px"><div class="card"><div class="sec">Hábitos <button class="lk" data-a="novoHabito">+ Hábito</button></div>

}

// Dia em que o fixo cai no mês: dia do mês, Nº dia útil, ou dia do mês recuando para o útil anterior

  }

}
/** Pagamentos = fixos de entrada da categoria Salário (salário, adiantamento). Período = do último pagamento até o próximo. */
function livreAteSalario() {

  if (!pags.length) return null;
  const hoje = hojeIso(), ym = hoje.slice(0, 7), datas = [];
  [-1, 0, 1, 2].forEach(n => { const m = somaMes(ym, n); pags.forEach(r => { if (fixoValeEm(r, m)) datas.push({ d: dataDoFixo(r, m), r }); }); });
  datas.sort((a, b) => a.d.localeCompare(b.d));

  if (!prox) return null;

  const no = (l, a, b) => String(l.Data) >= a && String(l.Data) <= b;
  const ls = T('Lancamentos');
  const ent = ls.filter(l => l.Tipo === 'Entrada' && !vr(l) && no(l, ini, hoje)).reduce((a, l) => a + num(l.Valor), 0);
  const sai = ls.filter(l => l.Tipo !== 'Entrada' && !vr(l) && no(l, ini, hoje)).reduce((a, l) => a + num(l.Valor), 0);
  const antesDoPag = somaDias(prox.d, -1);
  let pend = ls.filter(l => l.Tipo !== 'Entrada' && !vr(l) && no(l, somaDias(hoje, 1), antesDoPag)).reduce((a, l) => a + num(l.Valor), 0); // parcelas já lançadas à frente

    const d = dataDoFixo(r, m);

function reduzirGaleria(arq) { // foto da viagem: maior que a capa, mas leve (até ~200 KB)

      let q = 0.82, d = cv.toDataURL('image/jpeg', q);

    };

const parecido = (a, q) => { a = semAcento(a).trim(); q = semAcento(q).trim(); return a === q ? 3 : a.startsWith(q) || q.startsWith(a) ? 2 : a.includes(q) || q.includes(a) ? 1 : 0; };

/** Livros: Google Livros; se ele recusar (ex.: 429, muitos pedidos) ou não achar, Open Library. */
async function buscarLivroNet(titulo, autor) {
  let res = [];
  try {
    const j = await pegaJson('https://www.googleapis.com/books/v1/volumes?maxResults=8&printType=books&q=' + encodeURIComponent('intitle:' + titulo + (autor ? ' inauthor:' + autor : '')));
    res = (j.items || []).map(it => { const v = it.volumeInfo || {};
      return { Titulo: v.title || '', Autor: (v.authors || []).join(', '), Ano: String(v.publishedDate || '').slice(0, 4), Paginas: v.pageCount || '', Genero: (v.categories || [])[0] || '',
        Sintese: String(v.description || '').slice(0, 900), Capa: String((v.imageLinks || {}).thumbnail || '').replace('http://', 'https://').replace('&edge=curl', ''), pt: v.language === 'pt' }; });
  } catch (e) { /* Google Livros fora: segue com a Open Library */ }
  if (!res.length) {
    const j = await pegaJson('https://openlibrary.org/search.json?limit=8&fields=key,title,author_name,first_publish_year,number_of_pages_median,subject,cover_i,language&q=' + encodeURIComponent(titulo + (autor ? ' ' + autor : '')));
    res = (j.docs || []).map(d => ({ Titulo: d.title || '', Autor: (d.author_name || []).slice(0, 2).join(', '), Ano: d.first_publish_year ? String(d.first_publish_year) : '', Paginas: d.number_of_pages_median || '',
      Genero: (d.subject || [])[0] || '', Sintese: '', Capa: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg' : '', chave: d.key, pt: (d.language || []).includes('por') }));
  }
  res.sort((a, b) => parecido(b.Titulo, titulo) - parecido(a.Titulo, titulo) || (b.pt - a.pt) || (!!b.Capa - !!a.Capa) || (!!b.Sintese - !!a.Sintese));
  const r0 = res[0];
  if (r0 && !r0.Sintese && r0.chave) { // sinopse da Open Library vem à parte
    try { const w = await pegaJson('https://openlibrary.org' + r0.chave + '.json'); r0.Sintese = String((w.description && w.description.value) || w.description || '').slice(0, 900); } catch (e) { /* sem sinopse */ }
  }
  return res;
}
/** Capas: Google Livros, Open Library (edições em português primeiro) e Wikipédia; as de título mais parecido vêm antes. */
async function buscarCapasNet(titulo, autor) {
  const q = String(titulo || '').trim(), au = String(autor || '').trim(), cs = [];
  const poe = (u, t, extra = 0, nota) => { const n = nota != null ? nota : parecido(t, q); if (u && !cs.some(c => c.u === u)) cs.push({ u, t: t || '', nota: n * 10 + (n ? extra : 0) }); };
  await Promise.all([
    pegaJson('https://www.googleapis.com/books/v1/volumes?maxResults=12&printType=books&q=' + encodeURIComponent('intitle:' + q + (au ? ' inauthor:' + au : '')))
      .then(j => (j.items || []).forEach(it => { const v = it.volumeInfo || {}, im = v.imageLinks; if (im && im.thumbnail) poe(String(im.thumbnail).replace('http://', 'https://').replace('&edge=curl', '').replace('zoom=1', 'zoom=2'), v.title, v.language === 'pt' ? 3 : 0); })).catch(() => {}),
    pegaJson('https://openlibrary.org/search.json?limit=10&lang=pt&fields=title,cover_i,editions,editions.title,editions.cover_i,editions.language&q=' + encodeURIComponent(q + (au ? ' ' + au : '')))
      .then(j => (j.docs || []).forEach(d => {
        const eds = (d.editions || {}).docs || [], nota = Math.max(parecido(d.title, q), ...eds.map(e => parecido(e.title, q))); // a obra vale o que a edição em português vale
        eds.forEach(e => { if (e.cover_i) poe('https://covers.openlibrary.org/b/id/' + e.cover_i + '-L.jpg', e.title || d.title, (e.language || []).includes('por') ? 3 : 0); });
        if (d.cover_i) poe('https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg', d.title, 0, nota);
      })).catch(() => {}),
    pegaJson('https://pt.wikipedia.org/w/api.php?origin=*&action=query&format=json&generator=search&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=500&gsrsearch=' + encodeURIComponent(q + ' livro'))
      .then(j => Object.values((j.query || {}).pages || {}).forEach(p => { if (p.thumbnail) poe(p.thumbnail.source, p.title.replace(/\s*\(.*\)$/, ''), 2); })).catch(() => {}),
  ]);
  return cs.sort((a, b) => b.nota - a.nota).slice(0, 18);
}

function juntarVazios(atual, r, campos) { const o = Object.assign({}, atual); campos.forEach(k => { if ((o[k] === '' || o[k] == null) && r[k]) o[k] = r[k]; }); return o; }

function proximosDias(n = 7) {
  const hoje = hojeIso(), fim = somaDias(hoje, n), itens = [];
  const dentro = d => d && d > hoje && d <= fim;
  for (let i = 1; i <= n; i++) { const k = somaDias(hoje, i), f = feriadoDe(k); if (f) itens.push({ d: k, ic: '🎉', t: f }); }
  T('Atividades').forEach(a => { if (a.Status !== 'Entregue' && dentro(a.Data)) itens.push({ d: a.Data, ic: '🎓', t: a.Titulo, s: a.Disciplina }); });
  E.folgas.forEach(f => { if (dentro(f.folga)) itens.push({ d: f.folga, ic: '🏖️', t: 'Folga', s: maiuscula(f.tipo.toLowerCase()) }); });
  T('Lugares').forEach(l => { if (l.Status === 'Planejado' && dentro(l.Data)) itens.push({ d: l.Data, ic: '📍', t: l.Nome }); });
  for (let i = 1; i <= n; i++) {
    const k = somaDias(hoje, i), dia = +k.slice(8);
    T('Cartoes').forEach(c => { if (num(c.Vencimento) === dia) itens.push({ d: k, ic: '💳', t: 'Vence a fatura ' + c.Nome }); });
  }
  T('Recorrentes').forEach(r => [hoje.slice(0, 7), fim.slice(0, 7)].filter((m, i, a) => a.indexOf(m) === i).forEach(m => {
    const d = dataDoFixo(r, m);
    if (fixoValeEm(r, m) && dentro(d)) itens.push({ d, ic: r.Tipo === 'Entrada' ? '💰' : '🔁', t: r.Descricao, s: (r.Tipo === 'Entrada' ? '+ ' : '') + brlCurto(r.Valor) });
  }));
  T('Datas').forEach(x => { const p = proximaOcorrencia(x.Data); if (dentro(p)) itens.push({ d: p, ic: x.Tipo === 'Aniversário' ? '🎂' : '📌', t: x.Nome, s: idadeEm(x, p) ? idadeEm(x, p) + ' anos' : '' }); });
  return itens.sort((a, b) => a.d.localeCompare(b.d));
}

function sugestaoHoje(k) {

const TIPOS_COMP = {
  'Saúde': { ic: 'steth', cor: '#7c3aed', f: 'saude' }, 'Trabalho': { ic: 'brief', cor: '#c2410c', f: 'trabalho' },
  'Estudos': { ic: 'cap', cor: '#0284c7', f: 'estudos' }, 'Pessoal': { ic: 'users', cor: '#16a34a', f: '' },
};
const tipoComp = t => TIPOS_COMP[t] || TIPOS_COMP['Pessoal'];
const tile = (n, cor) => `<span class="tile" style="--cor:${cor}">${ic(n)}</span>`;
const SEM3 = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const semCurta = k => maiuscula(SEMANA[paraDate(k).getDay()].slice(0, 3));
/** Mesma regra do servidor: Semanal = mesmo dia da semana, Mensal = mesmo dia (ou o último do mês), Anual = mesmo dia e mês. */
function compromissoEm(c, k) {
  const base = String(c.Data || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(base) || k < base) return false;
  if (c.Repetir === 'Semanal') return paraDate(k).getDay() === paraDate(base).getDay();
  if (c.Repetir === 'Mensal') return +k.slice(8) === Math.min(+base.slice(8), diasNoMes(+k.slice(0, 4), +k.slice(5, 7)));
  if (c.Repetir === 'Anual') return k.slice(5) === base.slice(5);
  return k === base;
}
const horaComp = c => { const m = String((c && c.Hora) || '').trim().match(/^(\d{1,2}):(\d{2})/); return m ? pad(+m[1]) + ':' + m[2] : ''; };

function itensDoDia(k) {

    const tp = tipoComp(c.Tipo), rep = c.Repetir && c.Repetir !== 'Não' ? 'repete ' + c.Repetir.toLowerCase() : '';
    out.push({ h: horaComp(c), t: c.Titulo || 'Compromisso', s: [c.Local, rep].filter(Boolean).join(' · '), k: c.Tipo || 'Pessoal', ic: tp.ic, cor: tp.cor, f: ('comp ' + tp.f).trim(), a: 'editarComp', id: c.ID, lembrar: c.Lembrar });
  });

function faixaSemana(sel, acao) {

/** Próximos itens da agenda (sem remédios), a partir de hoje. */
function proximosAgenda(dias, max) {
  const hoje = hojeIso(), agora = pad(new Date().getHours()) + ':' + pad(new Date().getMinutes()), out = [];
  for (let n = 0; n <= dias && out.length < max; n++) {

  }
  return out;
}

function proximaOcorrencia(data) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(data))) return '';
  const hoje = hojeIso(), md = data.slice(5), a = +hoje.slice(0, 4);
  const em = ano => md === '02-29' && diasNoMes(ano, 2) < 29 ? ano + '-02-28' : ano + '-' + md;

/** Horas de um texto como "08:00, 20:00", "8h e 20h" ou "de 8 em 8h" (mesma regra do e-mail). */
function horasDe(texto) {
  const t = String(texto || '').toLowerCase();
  const intervalo = t.match(/(\d{1,2})\s*em\s*(\d{1,2})\s*h/);
  if (intervalo) {
    const passo = +intervalo[2], ini = +intervalo[1] % 24, horas = [];
    if (passo > 0) for (let h = ini, i = 0; i < 24 / passo; i++, h = (h + passo) % 24) horas.push(h);
    return horas;
  }
  return (t.replace(/:\d{2}/g, 'h').match(/\d{1,2}/g) || []).map(Number).filter(h => h < 24);
}
function dosesDeHoje() {
  const out = [];
  T('Remedios').filter(r => r.EmUso === true || r.EmUso === 'true').forEach(r => horasDe(r.Horarios).forEach(h => out.push({ h, r })));
  return out.sort((a, b) => a.h - b.h);
}

  const low = () => t.toLowerCase();
  const entrada = tira(/\s(recebi|ganhei|entrada|reembolso)\s/i);
  if (entrada || /^\s*\+/.test(t) || /sal[aá]rio|holerite/i.test(t)) { o.Tipo = 'Entrada'; t = t.replace(/^\s*\+/, ' '); }
  const parc = tira(/\s(\d{1,2})\s*x\s/i); if (parc) o.Parcelas = +parc[1];
  if (tira(/\santeontem\s/i)) o.Data = somaDias(hojeIso(), -2);
  else if (tira(/\sontem\s/i)) o.Data = somaDias(hojeIso(), -1);
  else tira(/\shoje\s/i);
  const dm = tira(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/);
  if (dm) { const a = dm[3] ? (dm[3].length === 2 ? 2000 + +dm[3] : +dm[3]) : +hojeIso().slice(0, 4); o.Data = iso(a, +dm[2], +dm[1]); }
  const pagamentos = [['Pix', /\s(pix)\s/i], ['Débito', /\s(d[eé]bito)\s/i], ['Crédito', /\s(cr[eé]dito|cart[aã]o)\s/i], ['Dinheiro', /\s(dinheiro|esp[eé]cie)\s/i], ['Boleto', /\s(boleto)\s/i], ['Voucher', /\s(voucher|vale|\bvr\b|\bva\b)\s/i]];
  for (const [p, re] of pagamentos) if (tira(re)) { o.Pagamento = p; break; }
  const cartao = T('Cartoes').find(c => c.Nome && low().includes(' ' + c.Nome.toLowerCase() + ' '));
  if (cartao) { o.Pagamento = 'Crédito'; o.Cartao = cartao.Nome; t = t.replace(new RegExp('\\s' + cartao.Nome + '\\s', 'i'), ' '); }
  const valor = tira(/\s(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s/i);
  if (valor) o.Valor = Number(valor[1].includes(',') ? valor[1].replace(/\./g, '').replace(',', '.') : valor[1]);
  const desc = t.replace(/\s+/g, ' ').trim();
  o.Descricao = desc ? desc[0].toUpperCase() + desc.slice(1) : entrada && /reembolso/i.test(entrada[1]) ? 'Reembolso' : '';
  // Categoria: primeiro pelo que você já lançou com esse nome, depois por palavras conhecidas
  const anterior = T('Lancamentos').filter(l => o.Descricao && String(l.Descricao).toLowerCase().split(' (')[0] === o.Descricao.toLowerCase()).slice(-1)[0];
  if (anterior) { o.Categoria = anterior.Categoria; if (!o.Pagamento) { o.Pagamento = anterior.Pagamento; if (anterior.Pagamento === 'Crédito') o.Cartao = anterior.Cartao; } }
  if (!o.Categoria) o.Categoria = (Object.entries(PALAVRAS_CAT).find(([, re]) => re.test(o.Descricao.toLowerCase())) || [o.Tipo === 'Entrada' ? 'Salário' : 'Outros'])[0];
  if (!o.Pagamento) o.Pagamento = 'Pix';
  return o;
}

/** Texto compartilhado de um comprovante (Pix, transferência, compra): tira valor, data, destino e tipo. */
function lerComprovante(texto) {
  const t = String(texto).replace(/\s+/g, ' ').trim(), low = t.toLowerCase();
  const o = interpretarLancamento('');
  const v = t.match(/R\$\s*(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:,\d{1,2})?)/i);
  if (v) o.Valor = Number(v[1].replace(/\./g, '').replace(',', '.'));
  const d = t.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (d) o.Data = iso(+d[3], +d[2], +d[1]);
  if (/recebid|voc[eê] recebeu|transfer[eê]ncia recebida|pix recebido/.test(low)) o.Tipo = 'Entrada';
  if (/pix/.test(low)) o.Pagamento = 'Pix'; else if (/d[eé]bito/.test(low)) o.Pagamento = 'Débito'; else if (/cr[eé]dito|cart[aã]o/.test(low)) o.Pagamento = 'Crédito';
  const quem = t.match(/(?:para|destino|favorecido|recebedor|nome)\s*:?\s*([A-ZÀ-Ú][\wÀ-ú&.' -]{2,40}?)(?=\s+(?:em|no dia|cpf|cnpj|institui|chave|ag[eê]ncia|valor|R\$|\d{2}\/)|$|[.,;])/i)
    || (o.Tipo === 'Entrada' && t.match(/\bde\s+([A-ZÀ-Ú][\wÀ-ú&.' -]{2,40}?)(?=\s+(?:em|no dia|cpf|R\$)|$|[.,;])/i));
  o.Descricao = quem ? maiuscula(quem[1].trim().toLowerCase()) : o.Tipo === 'Entrada' ? 'Pix recebido' : 'Pix enviado';
  const cat = interpretarLancamento(o.Descricao + ' 1');
  o.Categoria = o.Tipo === 'Entrada' ? (cat.Categoria === 'Outros' ? 'Outros' : cat.Categoria) : cat.Categoria;
  return o;
}

/** Barras por mês. series: [{nome, cor, valores (null = sem dado)}]. Um eixo só; hover mostra o valor. */
function graficoBarras(rotulos, series, { fmt = v => v, max } = {}) {
  const W = 340, H = 150, R = 6, T0 = 14, B = 18, n = rotulos.length, ns = series.length;
  const todos = series.flatMap(s => s.valores.filter(v => v != null));
  const topo = max || Math.max(1, ...todos) * 1.1;
  const L = Math.max(30, 8 + 5.6 * Math.max(...[0, 0.5, 1].map(f => String(fmt(Math.round(topo * f))).length))); // margem cabe o maior rótulo
  const y = v => T0 + (H - T0 - B) * (1 - v / topo);
  const gw = (W - L - R) / n, gap = ns > 1 ? 2 : 0, bw = Math.max(3, Math.min(18, (gw - 6 - gap * (ns - 1)) / ns));
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.nome).join(' e '))} por mês">`;
  [0, 0.5, 1].forEach(f => { const v = topo * f, yy = y(v); svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 4}" y="${yy + 3}" text-anchor="end">${esc(fmt(Math.round(v)))}</text>`; });
  rotulos.forEach((r, i) => {
    const x0 = L + gw * i + (gw - (bw * ns + gap * (ns - 1))) / 2;
    series.forEach((s, j) => {
      const v = s.valores[i];
      if (v == null) return;
      const x = x0 + j * (bw + gap), yy = y(Math.max(0, v)), base = y(0), h = Math.max(0, base - yy), rr = Math.min(4, bw / 2, h);
      const d = h < 0.5 ? '' : `M${x},${base} V${yy + rr} Q${x},${yy} ${x + rr},${yy} H${x + bw - rr} Q${x + bw},${yy} ${x + bw},${yy + rr} V${base} Z`;
      svg += `<g><title>${esc(r)} · ${esc(s.nome)}: ${esc(fmt(v))}</title><rect x="${x - 2}" y="${T0}" width="${bw + 4}" height="${H - T0 - B}" fill="transparent"/>${d ? `<path d="${d}" style="fill:${s.cor}"/>` : ''}</g>`;
    });
    svg += `<text x="${L + gw * i + gw / 2}" y="${H - 5}" text-anchor="middle">${esc(r)}</text>`;
  });
  if (ns === 1) { // rótulo só no último mês com dado
    const k = series[0].valores.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (k != null && k >= 0) svg += `<text class="vl" x="${L + gw * k + gw / 2}" y="${y(series[0].valores[k]) - 4}" text-anchor="middle">${esc(fmt(series[0].valores[k]))}</text>`;
  }
  return svg + '</svg>' + (ns > 1 ? `<div class="legenda">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>` : '');
}

function dadosEvolucao() {
  const hoje = hojeIso(), atual = hoje.slice(0, 7);
  const meses = [...Array(12)].map((_, i) => somaMes(atual, i - 11));
  const rot = meses.map(m => MESES[+m.slice(5) - 1].slice(0, 3));
  const temDias = m => Object.keys(E.dias).some(k => k.startsWith(m));
  const pres = meses.map(m => { if (!temDias(m)) return null; const r = resumoMes(m); return r.previstos ? Math.round(r.presenca / r.previstos * 100) : null; });
  const ent = meses.map(m => lancMes(m).filter(l => l.Tipo === 'Entrada').reduce((a, l) => a + num(l.Valor), 0));
  const sai = meses.map(m => saidasMes(m).reduce((a, l) => a + num(l.Valor), 0));
  const temFin = ent.some(Boolean) || sai.some(Boolean);
  const hab = habitosAtivos(), primeiroLog = T('HabitosLog').map(l => l.Data).sort()[0] || '9999';
  const habP = meses.map(m => {
    if (!hab.length || m < primeiroLog.slice(0, 7)) return null;
    const [a, mm] = m.split('-').map(Number), dias = m === atual ? +hoje.slice(8) : diasNoMes(a, mm);
    return Math.round(T('HabitosLog').filter(l => String(l.Data).startsWith(m) && feitoLog(l)).length / (hab.length * dias) * 100);
  });
  const humor = meses.map(m => { const xs = T('Diario').filter(d => String(d.Data).startsWith(m) && num(d.Humor)); return xs.length ? Math.round(xs.reduce((a, d) => a + num(d.Humor), 0) / xs.length * 10) / 10 : null; });
  const treinos = meses.map(m => new Set(T('Treinos').filter(t => String(t.Data).startsWith(m)).map(t => t.Data)).size);
  const melhor = (vals, f = v => v) => { let k = -1; vals.forEach((v, i) => { if (v != null && (k < 0 || v > vals[k])) k = i; }); return k < 0 ? '' : `Melhor mês: ${MESES[+meses[k].slice(5) - 1]} (${f(vals[k])})`; };
  const vazio = txt => `<div class="vazio">${txt}</div>`;
  const saldo12 = ent.reduce((a, v) => a + v, 0) - sai.reduce((a, v) => a + v, 0);
  return [
    ['pres', 'Presença', pres.some(v => v != null) ? melhor(pres, v => v + '%') : '', pres.some(v => v != null) ? graficoBarras(rot, [{ nome: 'Presença', cor: 'var(--c1)', valores: pres }], { fmt: v => v + '%', max: 100 }) : vazio('Sem dias lançados ainda.')],
    ['fin', 'Dinheiro', temFin ? `Saldo nos 12 meses: ${brl(saldo12)}` : '', temFin ? graficoBarras(rot, [{ nome: 'Entradas', cor: 'var(--c1)', valores: ent }, { nome: 'Saídas', cor: 'var(--c2)', valores: sai }], { fmt: v => brlCurto(v) }) : vazio('Lance gastos e entradas para ver a evolução.')],
    ['hab', 'Hábitos', habP.some(v => v != null) ? melhor(habP, v => v + '%') : '', habP.some(v => v != null) ? graficoBarras(rot, [{ nome: 'Hábitos', cor: 'var(--c1)', valores: habP }], { fmt: v => v + '%', max: 100 }) : vazio('Marque hábitos para ver a evolução.')],
    ['treino', 'Treinos', treinos.some(Boolean) ? melhor(treinos, v => plural(v, 'dia', 'dias')) : '', treinos.some(Boolean) ? graficoBarras(rot, [{ nome: 'Dias de treino', cor: 'var(--c1)', valores: treinos }]) : vazio('Registre treinos para ver aqui.')],
    ['humor', 'Humor', humor.some(v => v != null) ? melhor(humor, v => String(v).replace('.', ',') + ' ' + HUMOR[Math.round(v)].e) : '', humor.some(v => v != null) ? graficoBarras(rot, [{ nome: 'Humor (1 a 5)', cor: 'var(--c1)', valores: humor }], { fmt: v => String(v).replace('.', ','), max: 5 }) : vazio('Use o diário para acompanhar seu humor.')],
  ];
}

const EXERCICIOS = ['Flexão', 'Barra fixa', 'Agachamento', 'Abdominal', 'Prancha (segundos)', 'Paralelas', 'Afundo', 'Polichinelo', 'Burpee'];
const habitoTreino = () => habitosAtivos().find(h => /calist|treino|academia|muscula|exerc/i.test(h.Nome));
function telaTreinos() {
  const ts = T('Treinos'), hoje = hojeIso(), ym = hoje.slice(0, 7);
  const dias = [...new Set(ts.map(t => t.Data))].sort().reverse();

  if (!ts.some(t => t.Data >= ini)) ini = somaDias(ini, -7);
  while (ts.some(t => t.Data >= ini && t.Data <= somaDias(ini, 6))) { semanas++; ini = somaDias(ini, -7); }
  const vol = t => (num(t.Series) || 1) * num(t.Reps);
  const repsMes = ts.filter(t => String(t.Data).startsWith(ym)).reduce((a, t) => a + vol(t), 0);
  const exs = [...new Set(ts.map(t => t.Exercicio))];

    const xs = ts.filter(t => t.Exercicio === e), sessoes = [...new Set(xs.map(t => t.Data))].sort();

    const ult = sessoes[sessoes.length - 1], recorde = Math.max(...xs.map(t => num(t.Reps)));
    const ev = sessoes.length > 1 && v(sessoes[0]) ? Math.round((v(ult) - v(sessoes[0])) / v(sessoes[0]) * 100) : null;
    return { e, ult, v, sessoes: sessoes.slice(-10), recorde, ev, vezes: sessoes.length, ultimo: xs.filter(t => t.Data === ult) };
  }).sort((a, b) => String(b.ult).localeCompare(String(a.ult)));

  return `${cabeca('Treinos', '', ``)}

        ${fav.length ? `<div class="sub-sec">Começar por</div><div class="tr-fav">${fav.map(e => `<button data-a="novoTreino" data-ex="${esc(e)}">${esc(e)}</button>`).join('')}</div>` : ''}</div>

function celebrar() {

  const cores = ['#f59e0b', '#22c55e', '#3b82f6', '#ec4899', '#a855f7', '#ef4444'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confete';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cores[i % cores.length];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = 1.4 + Math.random() * 1.2 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

function buscar(q) {

  const grupos = [];
  const g = (nome, itens) => { if (itens.length) grupos.push(`<div class="grupo-res">${nome} · ${itens.length}</div>` + itens.slice(0, 8).join('')); };
  const item = (ic, tit, sub, attrs) => `<div class="row" ${attrs}><div class="ic">${ic}</div><div class="t"><b>${esc(tit)}</b><small>${esc(sub)}</small></div></div>`;
  g('Compromissos', T('Compromissos').filter(c => tem(c.Titulo, c.Local, c.Obs)).sort((a, b) => String(b.Data).localeCompare(String(a.Data))).map(c => item(ic('calendar'), c.Titulo, fmt(c.Data) + (horaComp(c) ? ' · ' + horaComp(c) : '') + (c.Local ? ' · ' + c.Local : ''), `data-a="editarComp" data-id="${esc(c.ID)}"`)));
  g('Calendário', Object.keys(E.dias).filter(k => tem(E.dias[k].obs, E.dias[k].titulo, E.dias[k].codigo === q.toUpperCase() ? q : '')).sort().reverse().map(k => item(ic('calendar'), E.dias[k].titulo || E.dias[k].obs || E.dias[k].codigo, fmt(k) + ' · ' + E.dias[k].codigo, `data-a="abrirDia" data-d="${k}"`)));
  g('Diário', T('Diario').filter(d => tem(d.Texto)).sort((a, b) => String(b.Data).localeCompare(String(a.Data))).map(d => item(ic(num(d.Humor) ? 'f' + num(d.Humor) : 'pen'), d.Texto, fmt(d.Data), `data-a="escreverDiario" data-d="${d.Data}"`)));
  g('Lançamentos', T('Lancamentos').filter(l => tem(l.Descricao, l.Categoria)).sort((a, b) => String(b.Data).localeCompare(String(a.Data))).map(l => item(ICONE_CAT[l.Categoria] || ic('wallet'), l.Descricao || l.Categoria, `${fmt(l.Data)} · ${brl(l.Valor)}`, `data-a="editarLanc" data-id="${esc(l.ID)}"`)));
  g('Metas', T('Desejos').filter(d => tem(d.Nome)).map(d => item(d.Icone || ic('target'), d.Nome, brl(d.Preco), `data-a="verDesejo" data-id="${esc(d.ID)}"`)));
  g('Folgas', E.folgas.filter(f => tem(f.anotacoes, f.chamado, f.tipo)).map(f => item(ic('sun'), f.anotacoes || f.tipo, `${f.folga ? fmt(f.folga) : 'sem data'} · ${f.chamado || f.tipo}`, `data-a="editarFolga" data-id="${esc(f.id)}"`)));
  g('Faculdade', T('Atividades').filter(a => tem(a.Titulo, a.Disciplina)).map(a => item(ic('cap'), a.Titulo, `${a.Disciplina} · ${fmt(a.Data)}`, `data-a="editarAtividade" data-id="${esc(a.ID)}"`)));
  g('Cursos', T('Cursos').filter(c => tem(c.Nome, c.Plataforma)).map(c => item(ic('laptop'), c.Nome, `${c.Plataforma} · ${c.Status}`, `data-a="editarCurso" data-id="${esc(c.ID)}"`)));
  g('Livros', T('Livros').filter(l => tem(l.Titulo, l.Autor, l.Sintese)).map(l => item(ic('book'), l.Titulo, `${l.Autor || ''} · ${l.Status}`, `data-a="editarLivro" data-id="${esc(l.ID)}"`)));
  g('Lugares', T('Lugares').filter(l => tem(l.Nome, l.Obs, l.Categoria)).map(l => item(l.Icone || ic('pin'), l.Nome, `${l.Categoria} · ${l.Status}`, `data-a="editarLugar" data-id="${esc(l.ID)}"`)));
  g('Remédios', T('Remedios').filter(r => tem(r.Nome, r.Indicacao, r.Obs)).map(r => item(ic('pill'), r.Nome, r.Indicacao, `data-a="editarRemedio" data-id="${esc(r.ID)}"`)));
  g('Datas', T('Datas').filter(x => tem(x.Nome, x.Obs)).map(x => item(ic('gift'), x.Nome, fmt(proximaOcorrencia(x.Data)), `data-a="editarData" data-id="${esc(x.ID)}"`)));
  g('Treinos', [...new Set(T('Treinos').filter(x => tem(x.Exercicio, x.Obs)).map(x => x.Exercicio))].map(e => item(ic('dumb'), e, 'Repetir este exercício', `data-a="novoTreino" data-ex="${esc(e)}"`)));

/** Markdown simples do manual: parágrafos, **negrito**, *itálico*, `código`, listas e tabelas. */
function mdManual(texto, termo) {
  const inline = t => {
    let h = esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
    if (termo) h = h.replace(new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi'), '<mark>$1</mark>');
    return h;
  };
  return texto.split(/\n{2,}/).map(bloco => {
    const ls = bloco.split('\n');
    if (ls[0].startsWith('|')) {
      const cel = l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      return `<div class="tab"><table><tr>${cel(ls[0]).map(c => `<th>${inline(c)}</th>`).join('')}</tr>${ls.slice(2).map(l => `<tr>${cel(l).map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    }
    if (/^- /.test(ls[0])) return `<ul>${ls.map(l => `<li>${inline(l.replace(/^- /, ''))}</li>`).join('')}</ul>`;
    if (/^\d+\. /.test(ls[0])) return `<ol>${ls.map(l => `<li>${inline(l.replace(/^\d+\. /, ''))}</li>`).join('')}</ol>`;
    return `<p>${inline(ls.join(' '))}</p>`;
  }).join('');
}
function telaManual() {

}
