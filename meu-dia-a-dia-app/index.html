const MANUAL = [["Como o app se organiza","No celular, a barra de baixo tem 5 abas: **Hoje**, **Agenda**, **Finanças**, **Hábitos** e **Mais**. O botão marrom redondo **+** fica flutuando no canto. No computador, tudo fica no menu da lateral, com o botão **Adicionar** no topo.\n\n| Onde | O que faz |\n| --- | --- |\n| **Hoje** | Semana, placar do dia, humor, frase do dia, sua agenda, o que resolver hoje e a rotina |\n| **Agenda** | Resumo do mês, calendário de presença com as anotações, os compromissos do dia, férias e folgas, numa página só |\n| **Finanças** | Tudo do dinheiro, numa página só com seções. O salário aparece só aqui |\n| **Hábitos** | Rotina de hoje, grade da semana, mês e to-dos (no computador, os to-dos ficam na coluna da direita) |\n| **Mais** | Todas as outras áreas (ícone e nome). Tamanho do texto e Manual ficam em Ajustes |\n| **+** (flutuando) | Adicionar qualquer coisa rápido |\n\n**O botão +** abre uma caixa para escrever um gasto do seu jeito (veja Financeiro) e atalhos para: compromisso, presença de hoje, gasto ou entrada, guardar numa meta, folga, entrega da faculdade, tarefa da semana, diário de hoje, treino, data importante, remédio, livro, lugar e nova meta.\n\n**Regras que valem em todo o app**\n\n- Tudo que aparece numa lista é tocável: abre o formulário para editar ou excluir.\n- Valores em dinheiro aceitam vírgula: `186,40` ou `1.234,56`.\n- A **engrenagem** no topo de uma tela abre os ajustes daquela tela (Agenda, Estudos, Leitura).\n- O app usa ícones de traço; os emojis ficam só onde você escolhe (ícone de uma meta, de um lugar, de um hábito) e nas conquistas.\n- A **lupa** no topo do Hoje abre a busca geral (inclui compromissos). No computador, a tecla `/` faz o mesmo.\n- O **olho** no topo de Finanças esconde todos os valores em R$ (vira \"R$ ••••\"). Toque de novo para mostrar.\n- **Tamanho do texto:** Ajustes → Aparência → Tamanho do texto (ou Mais → Tamanho do texto). Pequeno, Normal, Grande ou Muito grande. Vale só para o aparelho em que você escolheu, então o celular e o computador podem ficar diferentes.\n- **Escolhas pequenas são botões:** quando há poucas opções (cartão, tipo, status…), toque no botão da opção; o escolhido fica escuro. Listas grandes, como categorias e forma de pagamento, continuam em menu.\n- **Formulário aberto trava o fundo:** enquanto um formulário ou painel está aberto, só ele rola.\n- **Excluiu sem querer?** Logo depois de excluir, aparece \"Desfazer\" por alguns segundos.\n- **Painéis só fecham no X:** tocar fora de um formulário ou painel não faz nada, e o Esc do teclado também não. Para sair, use o **X**, **Cancelar** ou **Salvar**. No celular, o voltar fecha o painel só se você não digitou nada nele.\n- **Dicas de uso:** Ajustes → Aparência → Dicas de uso mostra ou esconde, no app inteiro, os textos que explicam como usar (ex.: \"Toque num dia para ver\").\n- **Puxe a tela para baixo** no topo de qualquer tela para sincronizar.\n- **Compartilhar para o app:** no celular, compartilhe o texto de um comprovante (Pix, transferência) e escolha **Meu Dia**. O lançamento abre já preenchido, para você conferir.\n- **Versão nova:** quando o app for atualizado, aparece \"Nova versão disponível · Atualizar\".\n- Ao salvar, o app mostra a mudança na hora e grava na planilha em seguida. Se der erro, ele desfaz e avisa."],["Início","A aba **Hoje** abre com \"Bom dia\", \"Boa tarde\" ou \"Boa noite\" e o mês. A lupa abre a busca; a bolinha com sua inicial abre os Ajustes. Embaixo, em ordem:\n\n| Parte | O que mostra e o que dá para fazer |\n| --- | --- |\n| **Semana** | Os 7 dias, com hoje em preto e uma bolinha colorida nos dias que têm algo marcado. Toque num dia para abrir a Agenda nele |\n| **Seu dia** | O anel é o placar de hoje: presença lançada + hábitos feitos (ex.: 6 de 9 = 67%). Toque nele para ir aos Hábitos. As 5 carinhas gravam o humor de hoje no Diário; \"escrever no diário\" abre o texto. Embaixo, a frase do dia, que muda sozinha todo dia |\n| **Sua agenda** | Os 3 próximos itens das próximas 3 semanas: compromissos, folgas, entregas, aniversários, feriados e passeios, com \"em N dias\". Toque para abrir a Agenda naquele dia. Botões **+ Compromisso**, **Folga** e **Entrega** |\n| **Para resolver hoje** | 3 abas: **Pendentes** (o que pede ação), **Hoje** (tudo que cai hoje) e **Feitos** (o que você concluiu hoje). Arraste um pendente **para a direita** para concluir e **para a esquerda** para deixar para amanhã. Tocar abre o item |\n| **Rotina de hoje** | Seus hábitos numa linha do tempo. Toque para marcar; hábito com quantidade abre os botões − e + |\n\n**O que entra em \"Pendentes\"**\n\n- Presença de hoje ainda não lançada (arrastar → lança o código sugerido: P no dia de semana, SÁB, DOM ou FERI).\n- Folga compensatória perto do prazo (15 dias ou menos) ou com prazo vencido.\n- Entregas da faculdade atrasadas, de hoje ou dos próximos 7 dias (arrastar → marca como entregue).\n- Categoria do orçamento com 90% do limite ou mais.\n- Remédios vencidos ou vencendo.\n- Férias com prazo vencendo em 90 dias ou já vencido.\n- Aniversários e datas importantes dentro do aviso que você escolheu (7 dias, se não escolher).\n\nOs outros pendentes, ao arrastar para a direita, somem até amanhã e vão para \"Feitos\". Logo depois de arrastar aparece \"Desfazer\". O que você adiou ou concluiu assim fica guardado só no aparelho.\n\n**Personalizar:** Ajustes → Aparência → Cartões do Início escolhe o que aparece e a ordem. Dá para ligar também **Lendo agora**, **Últimos 12 meses** (gráficos de presença, dinheiro, hábitos, treinos e humor) e **Conquistas**. Nada de dinheiro aparece no Hoje."],["Agenda","A Agenda é uma página só: no topo, o resumo do mês; depois o calendário com as anotações do mês; embaixo, os compromissos do dia escolhido, as férias e as folgas. O mês e o ano aparecem só no calendário. No topo da tela: lupa (ir para uma data), engrenagem (ajustes da agenda) e o **+** preto (novo compromisso no dia escolhido).\n\n**Resumo (faixa escura):** presença do mês (dias presentes de dias previstos), folgas (FC, FBH, TRF, DAYOFF somadas), dias com extra e faltas. Embaixo, o ano: \"Em 2026 até agora: 97% de presença (223/230) · 10 folgas · 25 com extra · 0 faltas\". Fim de semana, folga e férias não contam como previstos; meses sem nada lançado ficam fora da conta do ano.\n\n**Calendário**\n\n- **Como usar:** o botão (i) ao lado do nome do mês mostra ou esconde a dica \"Toque num dia para ver · toque de novo para editar\".\n- **Toque num dia** para ver o que tem nele (aparece embaixo). **Toque de novo no mesmo dia** para abrir o painel do dia.\n- **Arraste para os lados** em cima do calendário para trocar de mês. As setas só aparecem no computador (com mouse). **Hoje** volta para hoje.\n- **Ano:** a caixinha ao lado do nome do mês troca o ano.\n- Cada dia tem a cor do status. Bolinha no canto = tem compromisso, entrega, aniversário ou outro evento. Tracinho embaixo do número = tem título ou observação. Dias tracejados = férias planejadas (ainda não agendadas).\n- **Legenda:** só as siglas que aparecem naquele mês (sem SÁB, DOM e SEG), compromissos e férias planejadas. Segure o dedo numa sigla (ou passe o mouse) para ver o nome.\n- **Folgas no calendário:** toda folga com data (FC, FBH, DAYOFF) entra sozinha no dia, com o código dela. As que já existiam e ainda não estavam no calendário entram ao abrir o app.\n\n**Compromissos do dia** (seção logo abaixo do calendário)\n\n- Mostra só o que tem no dia: a data com a sigla do status e o título, **o dia todo** (aniversários, feriados, folgas, entregas, passeios) e **Manhã, Tarde e Noite** (compromissos com hora e doses dos remédios em uso).\n- Toque na data para abrir o painel do dia. Para criar um compromisso nesse dia, use o **+** preto do topo.\n\n**Painel do dia** (toque duas vezes no dia, ou na data embaixo do calendário)\n\n1. **Status de presença:** se o dia já tem status, aparece só ele (ex.: \"P · Presente\"); toque em **Trocar** para ver todas as siglas, inclusive SÁB, DOM e SEG. Segure o dedo numa sigla para ver o nome.\n2. **Título:** aparece na lista \"Anotações\" embaixo do calendário. Ex.: \"Aniversário do time\".\n3. **Observação:** o texto que você quiser, de qualquer tamanho. Só aparece quando você abre o dia.\n4. **Compromissos e eventos** daquele dia, com o botão para criar um novo.\n5. **Salvar**, ou **Salvar e próximo** para ir lançando a semana em sequência. As setas do topo trocam de dia.\n\n**Anotações do mês** (dentro do cartão do calendário; a setinha esconde e mostra a lista): os dias com título, observação, feriado ou um status que não seja presença comum (folga, férias, falta, atestado…). Sábado, domingo e segunda de folga ficam de fora, e as férias aparecem numa linha só por período (ex.: \"Férias · 21/12 a 09/01 · 16 dias\"). Sem título, aparece o significado do status (ex.: \"Folga compensatória\", \"Feriado\"); depois você troca pelo título que quiser. A observação não aparece aqui: um texto grande fica só dentro do painel. Dias antigos que só têm uma observação curta (até 40 letras, uma linha) aparecem com ela como título.\n\n**Novo compromisso**\n\n1. Em **Escreva do seu jeito**, digite algo como `dentista sexta 14h`, `reunião amanhã 9:30`, `aula de inglês toda terça 19h` ou `prova dia 28 às 8h`. O app preenche o nome, a data, a hora, o tipo e a repetição sozinho.\n2. Confira **O que é**, **Tipo** (Saúde, Trabalho, Estudos ou Pessoal), **Data**, **Hora** (vazia = o dia todo) e **Local**.\n3. **Lembrar:** na hora, 1 h antes ou 1 dia antes (por e-mail; ligue \"Lembrete de compromisso\" em Ajustes).\n4. **Repetir:** não, semanal (mesmo dia da semana), mensal (mesmo dia; em mês curto, o último dia) ou anual.\n5. **Colocar no Google Agenda:** o compromisso vira evento no seu Google Agenda (ligue \"Copiar para o Google Agenda\" em Ajustes).\n6. **Salvar compromisso.** Para editar ou excluir, toque nele na Agenda ou no Hoje.\n\nEntende: hoje, amanhã, depois de amanhã, dia da semana (também \"próxima sexta\"), `dd/mm`, `dd/mm/aaaa`, \"dia 28\", horas como `14h`, `14:30`, `14h30` ou `8 horas`, e \"toda terça\", \"todo mês\", \"todo ano\".\n\n**Status de presença (os códigos):** na engrenagem da Agenda → **Status de presença**, ou em Ajustes. Mostra todos os códigos, quantos dias cada um tem e deixa:\n\n- mudar o **nome**, o **grupo** (Presença, Folga, Férias, Não trabalha, Falta, Atestado, Afastado, Suspenso, Outro), se **conta como extra**, a **cor** e a **ordem**;\n- criar um **status novo** (ex.: HO = Home office);\n- **excluir** um status que não está em nenhum dia.\n\nA sigla de um status existente não muda, porque os dias lançados usam ela. O grupo decide as contas: Presença conta como dia trabalhado, Folga entra nas folgas, Férias nas férias, Não trabalha fica fora dos previstos. Sem cor escolhida, o status usa a cor do grupo.\n\nOs status que vêm prontos:\n\n| Grupo | Códigos |\n| --- | --- |\n| Presença | P Presente · PA Parcialmente ausente · PP Parcialmente presente · SNG Sinergia Centauro |\n| Presença com extra | PH · HE · SÁB+ · DOM+ · FERI+ |\n| Folga | FC Compensatória · FBH Banco de horas · DAYOFF Aniversário · TRF Troca de folga |\n| Não trabalha | SÁB · DOM · SEG · FERI Feriado |\n| Outros | F Falta · AT Atestado · AF Afastado · S Suspenso · FE Férias |\n\n**Preparar os meses sozinho:** ao abrir o app, o mês atual e o próximo são preenchidos uma vez, só nos dias vazios: domingos como DOM, feriados como FERI (com o nome no título) e, se você ligar, sábados como SÁB. O que você já lançou nunca muda, e um dia que você apagar depois não volta. Tudo isso se ajusta na engrenagem da Agenda, que também tem o botão \"Preencher este mês agora\".\n\n**Folgas**\n\n- **+ Nova** cadastra a folga: tipo (Folga compensatória, Banco de horas ou Day off), data trabalhada, data da folga, nº do chamado e anotações.\n- Com a data da folga preenchida, o dia entra no calendário com o código (FC, FBH ou DAYOFF) na hora. Se mudar a data, o dia antigo é limpo.\n- **Por ano:** o cartão mostra as folgas do ano aberto na agenda (pela data da folga ou do dia trabalhado). Uma compensatória pendente que vence no ano seguinte aparece nos dois anos. O botão **Todos os anos** mostra tudo.\n- **Folga compensatória tem prazo:** 60 dias a partir do dia trabalhado (mude na engrenagem). Faltando 15 dias ou menos, ela aparece em destaque e nos Pendentes do Hoje.\n- **E-mail para o RH:** dentro da folga, monta o texto pronto para copiar. O modelo se edita na engrenagem, com `{folga}`, `{trabalhada}` e `{tipoDia}`.\n- No topo do cartão, quantas de cada tipo você tirou no ano (ex.: \"Em 2026: 5 FC · 6 FBH · 1 DAYOFF\").\n\n**Férias**\n\n- No topo do cartão: **dias tirados** no ano, **dias agendados** (os próximos já marcados) e **dias para tirar** (o que você tem de direito e ainda não usou).\n- **Como funciona (CLT):** a cada 12 meses trabalhados, contados da **admissão** (o dia em que você começou, como está na carteira), você ganha 30 dias. A empresa tem os **12 meses seguintes** para te dar. Passou o prazo sem tirar tudo? As férias estão **atrasadas** e a empresa deve pagar esses dias em dobro.\n- O aviso no topo diz se está **em dia**, quantos dias você tem **para tirar e até quando**, ou se há férias **atrasadas**.\n- **Lê o calendário:** os dias marcados como FE viram férias na lista sozinhos (\"do calendário\"), mesmo sem cadastro. Fim de semana e feriado no meio não quebram o bloco. Toque num deles para dar um status ou observação.\n- **+ Programar:** escolha o primeiro dia e quantos dias (botões 5, 10, 15, 20, 30 ou outro número). O app mostra o **último dia** e o **dia de voltar**, e avisa se a parte tem menos de 5 dias, se começa nos 2 dias antes de domingo ou feriado (CLT) ou se é antecipada.\n- **Fim de semana e feriado não contam:** por padrão, as férias contam só dias úteis; sábado, domingo e feriado (os nacionais, os da sua cidade e os dias que você marcou como FERI) ficam de fora, tanto na conta quanto na marcação. Se a sua empresa conta dias corridos, ligue \"Nas férias, fim de semana e feriado também contam\" na engrenagem da Agenda.\n- **Adiantar:** os dias de férias vão primeiro para o ano mais antigo que ainda tem saldo; se nenhum ano completo tem saldo, contam como adiantados do ano que você ainda está ganhando.\n- **Status:** Pretensão, Pendente (de aprovação do gestor) ou Agendada. **Agendada** marca os dias como FE no calendário sozinha; se mudar a data ou voltar para outro status, os dias são desmarcados. Pretensão e pendente aparecem tracejadas no calendário.\n- Cada férias mostra se ainda vai acontecer (\"em 20 dias\"), se está acontecendo ou se já passou. A semana antes do início também vai para os Pendentes do Hoje e para o e-mail da manhã.\n- **Seus anos de trabalho:** cada ano mostra o status (Ainda ganhando, Para tirar, Perto do prazo, Atrasada ou Em dia), quando você ganha os dias, o prazo para tirar e quantos já tirou. Precisa da data de admissão na engrenagem da Agenda.\n\n**Ano de relance:** no fim da página, os 12 meses em miniatura, coloridos por status, com a porcentagem de presença de cada um. Toque num mês para abrir ele no calendário.\n\n**Feriados:** os nacionais já vêm calculados, inclusive Páscoa e Corpus Christi. Os da sua cidade entram na engrenagem, um por linha, como `22/05 Santa Rita`. O nome do feriado aparece no dia e nas anotações."],["Hábitos e to-dos","Os hábitos têm aba própria no menu de baixo. No topo, a faixa escura mostra quantos você fez hoje, a porcentagem da semana e sua melhor sequência. O **+** preto cria um hábito.\n\n**Rotina de hoje:** cada hábito é um bloco (2 por linha no celular, mais no computador), com o ícone, a sequência ou a meta da semana e uma bolinha que fica verde quando feito. Toque no bloco para marcar ou desmarcar. Para editar ou excluir: toque em **Editar** (ao lado de \"Rotina de hoje\"), toque no hábito e depois em **Pronto**. No celular, também dá para **segurar o dedo** no bloco. Hábito com quantidade mostra \"1,5 de 2 L\", uma barrinha e o botão **+0,5** que soma direto. Em cima aparece quantos faltam hoje. (No Hoje, a rotina continua em linha do tempo.)\n\nNo computador, a rotina e a grade ficam na coluna da esquerda e os **to-dos** ocupam a coluna da direita inteira.\n\n**Hábitos**\n\n- **Semana:** uma grade com cada hábito × os 7 dias. Toque na bolinha para marcar ou desmarcar. Arraste a grade para os lados para trocar de semana (no computador, use as setas); dias futuros ficam bloqueados.\n- **Mês:** uma barra por hábito, com quantos dias você fez no mês.\n- **+ Hábito** (ou toque no nome de um hábito): nome, ícone, meta por semana, quantidade por dia, ordem e ativo.\n- **Meta por semana:** para hábitos que não são diários (ex.: academia 3x). Aí a sequência conta semanas seguidas cumprindo a meta, e a grade mostra \"2/3\".\n- **Ativo desmarcado** esconde o hábito sem apagar o histórico.\n- **Hábito com quantidade** (ex.: 2 L de água, 10 páginas): preencha \"Quantidade por dia\", a unidade e quanto soma cada toque. Conta como feito quando chega na meta, e na grade aparece o valor parcial em verde claro.\n- O ícone na rotina vem do nome: água, leitura, devocional, treino, caminhada, idioma, remédio, estudo e sono ganham um desenho próprio.\n\nEmbaixo da grade, a porcentagem da semana cumprida e a da semana anterior.\n\n**To-dos**\n\nUm cartão com 3 listas: **Da semana**, **Do mês** e **Metas do ano**. Toque no quadradinho para marcar como feito; toque no texto para editar ou excluir. Cada lista é do período atual: na semana que vem, a lista da semana começa vazia."],["Financeiro","Finanças é uma página só, com seções: Resumo, Extrato, Metas, Fixos, Orçamento, Categorias, Guardado e Cartões. É só rolar a página.\n\n**Saldo do mês:** o cartão do topo mostra o saldo (entradas menos saídas), quanto entrou, saiu e foi guardado, e a comparação com o mês anterior. No celular, **arraste o cartão para os lados** para trocar o mês; no computador, use as setas. O **olho** esconde todos os valores.\n\n**Botões rápidos:** **Saída** (seta para cima), **Entrada** (seta para baixo), **Guardar** (vai para as metas) e **Mais** (fixo, meta, onde guardo, cartão, limite de categoria, importar extrato).\n\n**Extrato:** as entradas e saídas do mês agrupadas por dia (Hoje, Ontem, Seg 20/10…), com o saldo de cada dia. Botões **Tudo / Entradas / Saídas**, **Filtrar** (texto, categoria, pagamento, todos os meses) e **ver tudo**. Embaixo, a caixa de lançar rápido por texto.\n\n**Lançar um gasto ou entrada**\n\n- **+ Lançar:** tipo (Saída ou Entrada), descrição, valor, data, categoria, forma de pagamento, cartão e parcelas. Escolheu um cartão com Pix ou Dinheiro marcado? O app troca para Crédito (no Débito o cartão também fica).\n- **Parcelas:** numa compra parcelada, o app cria uma parcela por mês, cada uma no mês certo.\n- **Do seu jeito, por texto:** no + ou no fim do Extrato, escreva e aperte Lançar. O app preenche o formulário e você só confere.\n\n| Você escreve | O app entende |\n| --- | --- |\n| `mercado 52,30 pix` | Saída de R$ 52,30, Alimentação, Pix, hoje |\n| `uber 18 ontem` | Saída de R$ 18, Transporte, data de ontem |\n| `fone 300 3x crédito` | R$ 300 no crédito em 3 parcelas |\n| `farmácia 25,90 12/10` | Saída de R$ 25,90, Saúde, em 12/10 |\n| `recebi salário 3.500,00` | Entrada de R$ 3.500, Salário |\n| `+ 100 reembolso` | Entrada de R$ 100, \"Reembolso\" |\n\nA categoria vem primeiro do que você já lançou com o mesmo nome; se for a primeira vez, de palavras conhecidas (mercado, uber, netflix, farmácia…). Formas de pagamento reconhecidas: pix, débito, crédito ou cartão, dinheiro, boleto e vale/VR/VA. O nome de um cartão seu também funciona.\n\n**Até o próximo salário** (em Finanças, logo abaixo do saldo do mês atual): conta o que entrou desde o último pagamento (salário ou adiantamento cadastrados nos Fixos, categoria Salário), tira o que você gastou desde então e os fixos e parcelas que ainda vão cair antes do próximo pagamento. O resultado é quanto está livre e quanto dá por dia. Vale refeição (pagamento Voucher) fica de fora.\n\n**Filtrar o extrato:** toque em **Filtrar** e filtre por texto, categoria ou forma de pagamento. Marque \"Procurar em todos os meses\" para buscar além do mês aberto. O total do filtro aparece em cima da lista.\n\n**Importar extrato:** no Extrato, toque em **Importar** (ou Mais → Importar extrato do banco) e escolha o extrato baixado do banco (CSV ou OFX; funciona com Nubank, Inter, Itaú, Bradesco, C6 e outros). Você confere a lista antes: a categoria vem dos seus lançamentos anteriores com o mesmo nome, e o que parece já lançado (mesma data e valor) vem desmarcado. Para fatura de cartão, escolha Crédito e o cartão.\n\n**Metas e desejos** (as metas financeiras; também aparecem na tela Metas)\n\n- **+ Meta:** o que é, ícone, tipo (Desejo ou Necessidade), preço, prioridade, link da loja e quanto já tinha guardado antes do app.\n- Toque numa meta para **+ Guardar** ou **− Retirar**, com data, valor e onde o dinheiro está guardado. O histórico fica dentro da meta. No fim do detalhe tem **Excluir meta** (apaga também o histórico; logo depois aparece \"Desfazer\").\n- A meta mostra a previsão de quando você chega lá, pelo ritmo dos últimos 3 meses.\n- Filtros: Todos, Necessidade, Desejo e Comprados. Marque Status \"Comprado\" quando comprar.\n\n**Fixos do mês** (gastos e entradas que se repetem)\n\n- Entram sozinhos nos lançamentos, no dia certo, quando você abre o app ou às 7h (se os e-mails automáticos estiverem ligados).\n- **Quando cai:** *Dia do mês* (ex.: aluguel dia 5); *Dia útil* (o número vira o Nº dia útil: 5 = 5º dia útil, como o salário); *Dia do mês ou útil anterior* (ex.: adiantamento dia 20; em fim de semana ou feriado, vale o dia útil antes).\n- **Sábado conta como dia útil:** marque se a sua empresa conta o sábado (a CLT conta; muitas empresas não).\n- **Status:** *Fixo* entra todo mês, sem data para acabar; *Prazo* para no último mês escolhido (ex.: curso até 06/2027) e mostra quantos meses faltam. Depois disso aparece como Encerrado.\n- **Modelos prontos** no fim do formulário novo: Salário (5º dia útil), Adiantamento (dia 20) e Vale refeição (dia 1). Você só preenche o valor.\n- Cada fixo mostra a data deste mês e se já foi Lançado (ou Recebido). No rodapé: total de gastos fixos e de entradas fixas por mês.\n- **O valor muda todo mês** (ex.: salário que varia, comissão): marque esta opção. O valor do fixo vira uma estimativa e o app **não lança sozinho**: no dia, aparece em \"Para resolver\" e nos Fixos o botão **Confirmar valor**. Ele abre o lançamento já preenchido (com o valor do mês passado); você só corrige e salva. O \"Até o próximo salário\" usa a estimativa até você confirmar.\n- Desmarcar **Ativo** pausa o fixo. Excluir um fixo não apaga os lançamentos antigos.\n\n**Orçamento:** um limite por mês para cada categoria. A barra fica laranja perto do limite e vermelha quando estoura; a partir de 90% o aviso vai para os Pendentes do Hoje.\n\n**Categorias:** gráfico de rosca dos gastos do mês, a comparação de cada categoria com o mês anterior (▲ subiu, ▼ caiu, \"novo\" se não existia) e o total por forma de pagamento.\n\n**Onde está guardado:** os seus locais (ex.: Cofre, Caixinha, Tesouro), com o valor que já havia e uma meta opcional. O que você guarda nas metas usando o mesmo nome de local soma aqui.\n\n**Cartões:** nome e dia do vencimento. Mostra as compras do mês em cada cartão, e o vencimento entra no e-mail da manhã."],["Estudos","Duas telas no menu Mais (ou na lateral): **Estudos** (Faculdade e Cursos, trocando no botão do topo) e **Leitura**.\n\n**Faculdade**\n\n- No topo: entregas concluídas, quanto falta para a próxima, média das notas e número de disciplinas.\n- **+ Atividade:** nome, disciplina, data de entrega, status (Pendente ou Entregue) e nota.\n- Cada atividade mostra o estado: Atrasada, Hoje, \"em X dias\" ou Entregue. As atrasadas e as dos próximos 7 dias vão para os Pendentes do Hoje, para a Agenda e para o e-mail da manhã.\n- Com o Google Agenda ligado, as entregas viram eventos na sua agenda.\n- A engrenagem (só na aba Faculdade) muda o nome do curso que aparece no topo. O **+** preto cria uma atividade (Faculdade) ou um curso (Cursos).\n\n**Cursos**\n\n- Agrupados por plataforma (ex.: Hashtag, ADA), com o botão \"Abrir portal\" quando o curso tem link.\n- Filtros: Todos, Cursando, A fazer e Concluído.\n- **+ Curso:** nome, plataforma, carga horária, status (A fazer, Cursando, Pausado, Concluído), progresso em % e link do portal.\n\n**Leitura**\n\n- No topo: lidos no ano (de quantos da meta), lendo, na fila e lidos no total. A meta se muda na engrenagem.\n- **Lendo agora:** capa, página atual e a porcentagem. \"Atualizar página\" pede a página em que você está.\n- **Estante:** as capas grandes, com filtro Todos, Lendo, Quero ler e Lidos. No computador ela ocupa a largura toda.\n- **Ficha do livro:** toque num livro para abrir a ficha, no estilo de diário de leitura, numa coluna só: capa, título, autor, estrelas (toque para avaliar), **como leu** (Físico, E-book, Audiobook) e, logo embaixo, os detalhes (gênero, páginas, ano, página atual, início, fim). Depois vêm os **favoritos** e um quadro único de **resenha e sinopse**, com dois botões para alternar. Textos longos mostram o começo e **Ler tudo**. O lápis abre o formulário para escrever.\n- **+ Livro:** nome, autor, ano, gênero, páginas, status, página atual, início, fim, avaliação em estrelas, como leu, capa, favoritos, resenha e sinopse. Os campos curtos ficam lado a lado; no computador, o formulário fica largo, com capa, favoritos, resenha e sinopse na coluna da direita.\n- **Capa:** três jeitos, todos ficam salvos na sua planilha (o app reduz a imagem):\n  - **Foto ou galeria:** tire uma foto do livro ou escolha uma imagem do celular.\n  - **Procurar na internet:** com o nome (e o autor) preenchidos, o app mostra capas do Google Livros, da Open Library (edições em português primeiro) e da Wikipédia, com as de nome mais parecido no começo. Toque numa para usar. Não achou? Os atalhos para o Google Imagens e o Pinterest ficam logo abaixo.\n  - **Colar link:** cole o link de uma imagem ou de um pin do Pinterest (no Pinterest: abra o pin → compartilhar → copiar link). O app acha a imagem do pin e baixa.\n- **Preencher pelo nome:** escreva o nome do livro e toque no botão. O app procura no Google Livros (e, se ele estiver fora, na Open Library) e preenche sozinho o que estiver vazio: autor, ano, páginas, gênero, sinopse e capa. Não era esse? Toque em **Não é esse** no aviso para ver os outros resultados."],["Vida","Seis telas no menu Mais: Diário, Treinos, Lugares, Farmácia, Metas e Datas.\n\n**Diário**\n\n- Um registro por dia: humor de 1 a 5 (carinhas, de péssimo a ótimo) e um texto, se quiser.\n- O jeito mais rápido continua sendo tocar numa carinha no cartão \"Seu dia\" do Hoje.\n- O calendário do mês fica colorido pelo humor; toque num dia para ler ou escrever. Arraste para os lados para trocar de mês (no computador, use as setas). Embaixo, uma barra mostra como foi o humor do mês e quantos dias de cada.\n- **Lembranças:** o que você escreveu há 1 semana, 1 mês e 1 ano, no mesmo dia.\n- Números do mês: humor médio, dias escritos e **dias seguidos** escrevendo.\n\n**Treinos**\n\n- No topo: dias de treino no mês, semanas seguidas treinando, repetições no mês e quantos exercícios você já fez.\n- **Hoje:** as séries de hoje, cada uma com **+ série** para repetir o exercício. Sem treino hoje, o botão **Repetir o treino de (dia)** copia o último treino inteiro para hoje num toque (e marca o hábito de treino). Embaixo, **Começar por** mostra os exercícios que você mais faz.\n- **Frequência:** as últimas 10 semanas, um quadradinho por dia; quanto mais escuro, mais repetições.\n- **Evolução por exercício:** o último treino, o **recorde**, quanto você evoluiu desde o primeiro treino (%) e um gráfico das últimas sessões. Toque para registrar de novo.\n- **Histórico:** os treinos por dia, com o total de repetições. Toque numa série para editar.\n- **Registrar:** exercício, séries, repetições (ou segundos, na prancha), carga extra, data e observação. O formulário mostra o que você fez da última vez e já vem preenchido com isso.\n- **Recorde:** se você bater o seu máximo de repetições num exercício, cai confete.\n- **Marcar o hábito junto:** se você tem um hábito como Calistenia, o formulário oferece marcá-lo como feito no mesmo toque.\n\n**Lugares**\n\n- Lista de lugares para conhecer: nome, cidade, **capa**, **fotos da viagem**, categoria, status (Quero ir, Planejado, Visitado), data, avaliação em estrelas e observações.\n- **Fotos da viagem:** no lugar, toque em **Adicionar fotos** e escolha quantas quiser da galeria do celular. No cartão do lugar elas viram um **slide**: arraste para o lado para ver (as bolinhas mostram em qual está). O × tira uma foto. Funciona entrando com a conta Google.\n- **Capa:** igual à capa dos livros. **Foto ou galeria**; **Procurar na internet** (com o nome e a cidade preenchidos, mostra fotos da Wikipédia e do Wikimedia Commons, e atalhos para o Pinterest e o Google Imagens); ou **Colar link** de uma imagem ou de um pin. A foto aparece no cartão do lugar.\n- No topo: quantos quer ir, planejados e visitados. O próximo passeio planejado aparece em destaque, com quantos dias faltam; os planejados também vão para a Agenda.\n- Cada lugar tem o link **Ver no mapa** (abre o Google Maps procurando pelo nome e a cidade).\n\n**Farmácia**\n\n- No topo: vencidos, que vencem em breve, em dia e em uso.\n- Inventário dos remédios de casa: nome, para que serve, quantidade, validade (mês/ano) e observações.\n- **Editar remédio:** no topo, o estado (OK, vencido…) com a validade e a quantidade. Ligue **Estou tomando agora** para aparecer a dose e os horários, com botões rápidos (Manhã 08:00, Almoço 12:00, Noite 20:00, 8 em 8h, 12 em 12h).\n- Estados: Vencido, Vence este mês, Vence em breve (45 dias), OK. Vencidos e vencendo vão para os Pendentes do Hoje.\n- **Em uso agora:** marque \"Estou tomando agora\" e preencha a dose e os horários, como `08:00, 20:00`, `8h e 20h` ou `de 8 em 8h`. As doses aparecem na Agenda (Manhã, Tarde, Noite) e, com o e-mail \"Hora do remédio\" ligado, chega um aviso na hora (pode atrasar até 1 hora).\n\n**Metas** (menu Mais)\n\n- Junta as metas **financeiras** (as de Finanças, com o dinheiro guardado em cada uma) e as **outras**: Academia, Alimentação, Estudos, Saúde, Trabalho e Pessoal.\n- **+** pergunta o tipo. Financeira abre a meta de dinheiro; as outras pedem a meta, quanto quer chegar (opcional), unidade, prazo e observação.\n- **Contar sozinha por um hábito:** escolha um hábito (ex.: Calistenia) e cada dia que você marcar ele soma 1 na meta, a partir do início. Ex.: \"Treinar 150 vezes\" ligada ao hábito de treino.\n- Sem hábito, o botão **+1** soma na hora; meta sem número tem o botão **Feita**.\n- Filtros por tipo e **Concluídas**. No topo: em andamento, concluídas e quanto já foi guardado para as metas financeiras.\n\n**Datas importantes**\n\n- **Destaque da próxima data:** contagem regressiva, a idade (ou anos de casados) e o signo. **Mandar parabéns** abre o WhatsApp da pessoa com a mensagem pronta (precisa do número cadastrado). **Ideias de presente** abre a data no campo de presente.\n- No topo: datas do mês, aniversários, outras datas e quanto você gastou com presentes no ano (lançamentos na categoria Presentes).\n- Filtros por tipo e a lista por mês, com a inicial da pessoa, o dia da semana e quantos dias faltam.\n- **O ano todo:** um gráfico com quantas datas tem em cada mês; toque num mês para ir até ele.\n- **+ Data:** tipo (Aniversário, Casamento, Comemorativa, Outra), nome, data (com o ano, para calcular a idade), quando avisar (no dia, 1 dia, 3 dias, 1 semana), WhatsApp, ideias de presente e observação.\n- **WhatsApp é opcional:** sem número, o **Mandar parabéns** abre o WhatsApp para você escolher o contato lá, já com a mensagem escrita. Com número, abre direto a conversa. No celular, o botão **Contatos** pega o número (e o nome) da sua agenda. Em todo caso, é você quem aperta enviar.\n- **Guardar para o presente:** cria uma meta em Finanças ligada à data, com quanto você quer gastar. O quanto já guardou aparece na lista.\n- O aviso aparece no Hoje, na Agenda e no e-mail da manhã, a partir do número de dias que você escolheu (7, se ficar vazio)."],["Conquistas e busca","**Conquistas:** 20 medalhas que se desbloqueiam sozinhas conforme você usa o app. Quando uma desbloqueia, cai confete e aparece um aviso. A tela Conquistas separa as desbloqueadas das em andamento; o anel em volta de cada ícone mostra quanto falta.\n\n| Área | Conquistas |\n| --- | --- |\n| Presença | Mês perfeito (100% num mês) · Calendário em dia (30 dias seguidos lançados) |\n| Hábitos | Pegando o ritmo (7 dias seguidos) · Hábito de ferro (30) · Imparável (100) · Semana perfeita (todos os hábitos numa semana) |\n| Dinheiro | Primeiros mil (R$ 1.000 guardados) · Reserva de respeito (R$ 5.000) · Objetivo alcançado (completar uma meta) · Dentro do orçamento (um mês sem estourar limite) |\n| Diário | Querido diário (7 dias) · Escritor (30 dias) |\n| Treinos | Em forma (10 dias) · Atleta (50 dias) |\n| Estudos | Primeiro livro · Meta de leitura (a meta do ano) · Aluno exemplar (5 entregas, nenhuma atrasada) · Certificado (concluir um curso) |\n| Vida | Explorador (visitar 5 lugares) · Farmácia em ordem (5 ou mais remédios, nenhum vencido) |\n\n**Busca geral:** a lupa no topo do Hoje (ou Buscar no menu). Digite 2 letras ou mais: procura sem ligar para acentos em compromissos, observações do calendário, diário, lançamentos, metas, folgas, faculdade, cursos, livros, lugares, remédios, datas, treinos e tarefas. Toque num resultado para abrir; num treino, ele já abre para repetir o exercício."],["Ajustes e e-mails automáticos","Ajustes fica no menu Mais (ou tocando na sua inicial no topo do Hoje) e tem 4 blocos. As opções de cada tela ficam na engrenagem dela, e Ajustes também lista esses atalhos.\n\n| Bloco | O que dá para mudar |\n| --- | --- |\n| **Você** | Nome (aparece no \"Olá\") e e-mail para os avisos (vazio = o da sua conta Google) |\n| **Aparência** | Tema (Automático segue o celular, Claro ou Escuro), tamanho do texto (só no aparelho), cor do app (Caramelo, Azul petróleo, Verde, Roxo, Laranja, Rosa, Grafite), tela em que o app abre, cartões do Início e frase do dia |\n| **E-mails automáticos** | Ligar ou desligar cada e-mail, mandar um teste |\n| **Dados** | Atualizar a agenda agora e fazer uma cópia de segurança agora |\n| **Este aparelho** | Sincronizar agora, desconectar da planilha e ligar o bloqueio com digital |\n\n**Bloqueio com digital:** em Ajustes → Este aparelho, ligue \"Bloquear com digital\". O app pede a digital ou o rosto ao abrir e depois de 1 minuto fora dele. Se a biometria falhar, dá para destravar com a chave do app. É uma trava da tela neste aparelho; cada aparelho liga a sua.\n\n**Cartões do Início:** marque os que quer ver e use as setas para mudar a ordem. \"Voltar ao padrão\" desfaz tudo.\n\n**Frase do dia:** no modo Automático, muda todo dia (60 frases do app + as suas). No modo Fixa, mostra sempre a sua frase favorita.\n\n**Os e-mails automáticos**\n\n| E-mail | Quando chega |\n| --- | --- |\n| Resumo da manhã | 7h, só quando há algo: entrega, folga, fatura, orçamento, remédio, aniversário, compromisso de hoje |\n| Lembrete de compromisso | Na hora, 1 h antes ou 1 dia antes, como escolhido em cada compromisso (até 1 hora de atraso). Compromisso sem hora: 9h da véspera (1 dia antes) ou 8h do dia |\n| Lembrete da presença | 18h, se o dia de hoje ainda estiver vazio |\n| Hora do remédio | Na hora de cada dose dos remédios em uso (até 1 hora de atraso) |\n| Resumo do mês | Dia 1, com presença, gastos, hábitos e leituras do mês anterior |\n| Copiar para o Google Agenda | Todo dia: compromissos (os marcados para o Google Agenda), entregas, folgas agendadas e passeios viram eventos (sem duplicar) |\n| Cópia de segurança | Domingo: uma cópia da planilha na pasta \"Meu Dia a Dia - Backups\" do Drive, guardando as 8 últimas |\n\nPara funcionar, os e-mails precisam estar **ligados** (botão \"Ligar e-mails automáticos\"). Se aparecer \"Sem permissão\", rode a função **autorizar** no editor do Apps Script. Depois de uma atualização que traz um e-mail novo, pause e ligue de novo para ele começar a valer."],["A planilha por dentro","Tudo fica em 6 abas, uma por área. O app cria e organiza as abas sozinho; o ideal é mexer pelo app, não direto na planilha.\n\n| Aba | Tipos de linha que ela guarda |\n| --- | --- |\n| **Calendário** | Dia (status, título, observação), Folga, Código, Compromisso, Férias |\n| **Hábitos** | Hábito, Feitos no dia, Tarefa, Treino |\n| **Financeiro** | Lançamento, Gasto fixo, Limite do mês, Onde guardo, Cartão, Meta, Meta: movimento |\n| **Estudos** | Faculdade, Curso, Livro |\n| **Vida** | Lugar, Remédio, Diário, Data importante |\n| **Ajustes** | Ajuste, Evento na agenda |\n\n**As 7 colunas, iguais em todas as abas:** Tipo · ID · Data · Título · Valor · Status · Detalhes. A coluna Detalhes guarda o resto em formato técnico (JSON) e não deve ser editada à mão.\n\n- As linhas ficam em ordem de tipo e data.\n- Cada aba cresce sozinha quando precisa e guarda só as 7 colunas, para a planilha não pesar.\n- Os códigos de presença (nome, cor e se conta como extra) ficam nas linhas \"Código\" da aba Calendário.\n- Na primeira vez, o app converteu a planilha antiga (uma aba por assunto) e salvou uma cópia completa em \"Meu Dia a Dia - Backups\" no Drive antes de mexer.\n- **Localidade e fuso:** em Arquivo → Configurações, deixe Brasil e (GMT-03:00) São Paulo, para as datas não andarem um dia."],["Sem internet e problemas comuns","**Sem internet:** o app fica guardado no aparelho e abre normalmente, até no modo avião, com os dados da última sincronização. O que você salvar sem conexão aparece na hora e fica guardado; uma faixa laranja no topo mostra quantas alterações esperam a internet. Quando a conexão volta, o app envia tudo sozinho e traz o que mudou em outro aparelho. Ao voltar para o app depois de um tempo, ele também sincroniza; para forçar, use **Ajustes → Este aparelho → Sincronizar agora**.\n\nNa primeira vez em cada aparelho é preciso internet, para conectar e baixar os dados. Se o mesmo item for mudado no celular sem internet e no computador ao mesmo tempo, vale a última alteração enviada.\n\n| Problema | O que fazer |\n| --- | --- |\n| Pede para conectar de novo | A chave mudou (ou o app foi desconectado). Na planilha, use **Meu Dia → 2. Conectar um celular ou computador** e aponte a câmera para o QR code |\n| \"Sem resposta da ponte\" ao conectar | Confira a internet e se a implantação está com acesso **Qualquer pessoa**. O endereço precisa terminar em /exec |\n| Atualizei o código e nada mudou | No Apps Script, faltou a Nova versão. No app, feche e abra de novo: a versão nova das telas entra na abertura seguinte |\n| Datas um dia antes ou depois | Arquivo → Configurações da planilha: Brasil e (GMT-03:00) São Paulo |\n| E-mails não chegam | Ajustes → E-mails automáticos: veja se estão \"Ligados\" e use \"Mandar um teste\". Se diz \"Sem permissão\", rode autorizar |\n| Lembrete do remédio não chega | O remédio precisa estar \"Em uso\", com horário, e o e-mail \"Hora do remédio\" ligado |\n| Gasto fixo não entrou | Ele entra no dia calculado (veja a data na etiqueta). Confira se está Ativo e, se for Prazo, se o último mês já passou |\n| Salário caiu num dia diferente do holerite | Teste a opção \"Sábado conta como dia útil\" no fixo e cadastre os feriados da sua cidade na engrenagem da Agenda |\n| Um domingo apagado não voltou | É de propósito: cada mês é preparado uma vez só. Use \"Preencher este mês agora\" na engrenagem da Agenda |\n| Apaguei algo sem querer | Abra a cópia de segurança mais recente na pasta \"Meu Dia a Dia - Backups\" do Drive e copie a linha de volta para a aba certa |\n| Perdi o celular | Rode **trocarChaveDoApp** no Apps Script: o celular antigo perde o acesso. Conecte os outros aparelhos com a chave nova |"],["Instalar e atualizar","**Entrar:** o app guarda os dados na sua conta Google (Firebase, grátis). Na primeira vez, toque em **Entrar com Google**. Use a mesma conta no celular e no computador. Em **Ajustes → Sua conta** ficam: sincronizar agora, **Baixar cópia** (um arquivo com tudo), **Trazer da planilha** (copia os dados da planilha antiga que estava conectada neste aparelho) e **Sair**.\n\n**Modo planilha (avançado):** na tela de entrada, \"Usar com uma planilha do Google\" conecta o app a uma planilha sua, como nas versões antigas. Os e-mails automáticos só funcionam nesse modo; na conta Google, os avisos vão virar notificação no celular.\n\n**Para outra pessoa usar:** basta mandar o link do app (Ajustes → Atualizações → **Convidar alguém**). Ela entra com a própria conta Google e vê só os dados dela. Para usar com planilha, ela segue a página **Criar o seu Meu Dia** (instalar.html): em Ajustes → Atualizações, toque em **Convidar alguém**. O link abre a página **Criar o seu Meu Dia**, com o passo a passo (uns 10 minutos, tudo grátis): criar uma planilha, colar o código da ponte, **Meu Dia → 1. Preparar a planilha**, publicar a ponte e **Meu Dia → 2. Conectar**. Cada pessoa tem a própria planilha, na própria conta Google: ninguém vê os dados de ninguém, nem você.\n\n**O menu Meu Dia** (na planilha, depois que o código está colado): **1. Preparar a planilha** (permissões e abas), **2. Conectar um celular ou computador** (QR code e link que abrem o app já conectado) e **Trocar a chave** (se ela vazou).\n\nO Meu Dia tem duas partes:\n\n- **O app:** as telas, num site seu e gratuito no GitHub Pages. No S25 ele é instalado como app; no computador, você abre o mesmo endereço no navegador.\n- **A ponte:** o arquivo **Codigo.gs** no Apps Script da planilha. É ele que lê e grava os dados, manda os e-mails e faz o backup.\n\n**Instalar no S25**\n\n1. Abra o endereço do app no **Chrome**.\n2. Toque em **⋮ → Instalar app** (ou no aviso \"Instalar\" que aparece embaixo).\n3. O ícone vai para a tela inicial. Abra por ele: o app ocupa a tela toda, sem barra do navegador.\n4. Na primeira abertura, conecte: na planilha, **Meu Dia → 2. Conectar um celular ou computador** e aponte a câmera do celular para o QR code. O app abre já conectado (dá também para colar o endereço da ponte e a chave à mão).\n\nSegure o ícone do app para ver os atalhos: Lançar gasto, Presença de hoje e Diário de hoje. O botão voltar do celular fecha o painel aberto ou volta para a tela anterior.\n\n**No computador:** abra o mesmo endereço no navegador, conecte uma vez com o endereço da ponte e a chave, e salve nos favoritos.\n\n**A chave:** funciona como uma senha. Quem tiver o endereço da ponte e a chave consegue ler e mudar seus dados, então não mande para ninguém. Se vazar, rode **trocarChaveDoApp** no Apps Script e conecte de novo os seus aparelhos.\n\n**Atualizar**\n\n- **Ajustes → Atualizações** mostra a versão do app e da ponte. **Procurar atualização** confere o site na hora e, se tiver versão nova, já atualiza o app (não precisa fechar e abrir). Se a ponte estiver velha, aparece um aviso e o botão **Atualizar a ponte** abre a página com o código.\n- **As telas:** suba os arquivos novos no repositório do GitHub (Add file → Upload files). Depois, no app, toque em **Procurar atualização**.\n- **A ponte:** o botão **Atualizar a ponte** (Ajustes → Atualizações) abre a página com o código e o botão Copiar. Cole o código novo no Apps Script e vá em **Implantar → Gerenciar implantações → ✏️ → Nova versão → Implantar**. O endereço não muda."]];

const TELAS = {
  inicio: telaInicio, presenca: telaPresenca, financeiro: telaFinanceiro, faculdade: telaFaculdade,
  cursos: telaCursos, leitura: telaLeitura, diario: telaDiario, treinos: telaTreinos, lugares: telaLugares, farmacia: telaFarmacia, datas: telaDatas,
  conquistas: telaConquistas, mais: telaMais, ajustes: telaAjustes, manual: telaManual, habitos: telaHabitos, estudos: telaEstudos, metas: telaMetas,
};
const NAV = [['inicio', 'home', 'Hoje'], ['presenca', 'calendar', 'Agenda'], ['financeiro', 'wallet', 'Finanças'], ['habitos', 'habits', 'Hábitos'],
  ['sep', '', 'ESTUDOS'], ['estudos', 'cap', 'Estudos'], ['leitura', 'book', 'Leitura'],
  ['sep', '', 'VIDA'], ['diario', 'pen', 'Diário'], ['treinos', 'dumb', 'Treinos'], ['lugares', 'pin', 'Lugares'], ['farmacia', 'pill', 'Farmácia'], ['datas', 'gift', 'Datas'],
  ['sep', '', ''], ['conquistas', 'trophy', 'Conquistas'], ['busca', 'search', 'Buscar'], ['manual', 'book', 'Manual'], ['ajustes', 'gear', 'Ajustes']];

function render() {
  document.body.classList.toggle('sem-dicas', !liga('Dicas'));
  $('main').innerHTML = TELAS[E.tela]();
  const sideTopo = $('side').scrollTop; // o menu não volta para o topo a cada troca de tela
  $('side').innerHTML = `<div class="logo"><i>✓</i>Meu Dia</div><button class="novo" data-a="rapidas">${ic('plus')} Adicionar</button>` +
    NAV.map(([k, i, l]) => k === 'sep' ? `<div class="navsep">${l}</div>` : `<button class="navi ${k === E.tela ? 'on' : ''}" data-a="${k === 'busca' ? 'busca' : 'ir'}" data-v="${k}">${IC[i] ? ic(i) : i} ${l}</button>`).join('');
  $('side').scrollTop = sideTopo;
  const sel = ['inicio', 'presenca', 'financeiro', 'habitos'].includes(E.tela) ? E.tela : 'mais';
  const item = ([k, i, l]) => `<button class="${sel === k ? 'on' : ''}" data-a="ir" data-v="${k}"><span class="ico">${ic(i)}</span>${l}</button>`;
  $('bnav').innerHTML = [['inicio', 'home', 'Hoje'], ['presenca', 'calendar', 'Agenda'], ['financeiro', 'wallet', 'Finanças'], ['habitos', 'habits', 'Hábitos'], ['mais', 'grid', 'Mais']].map(item).join('');
  if (!$('fab').innerHTML) $('fab').innerHTML = ic('plus');
}

const ACOES = {
  ir: ({ v }) => {
    if (v === 'desejos') v = 'metas';
    if (v === 'evolucao') v = 'inicio'; // tela antiga: evolução virou cartão opcional do Início
    if (v === 'faculdade' || v === 'cursos') { E.abaEstudos = v; v = 'estudos'; }
    if (!TELAS[v]) return;
    irPara(v); render(); window.scrollTo(0, 0);
  },
  irFin: ({ v }) => {

  try {

  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  E.arrastou = Date.now(); vibrar(10);
  if (el.dataset.swipe) ACOES[el.dataset.swipe]({ n: (dx < 0 ? 1 : -1) * (+el.dataset.passo || 1) });
  else if (el.id === 'fin-resumo') { E.animCal = dx < 0 ? 'vem-dir' : 'vem-esq'; ACOES.mesFin({ n: dx < 0 ? 1 : -1 }); E.animCal = ''; }
  else ACOES.mesPres({ n: dx < 0 ? 1 : -1 });
});
addEventListener('touchcancel', soltarArrasto);

const TELA_INICIAL = { 'Início': 'inicio', 'Agenda': 'presenca', 'Hábitos': 'habitos', 'Financeiro': 'financeiro', 'Diário': 'diario', 'Treinos': 'treinos' };
const telaInicial = () => TELA_INICIAL[cfg('TelaInicial', 'Início')] || { 'Presença': 'presenca', 'Calendário': 'presenca' }[cfg('TelaInicial', '')] || 'inicio';

async function iniciar() {
  E.ocultar = !!ls.get('mdd_ocultar');
  aplicarTamanho();
  travaDisponivel().then(ok => { E.travaOk = ok; });
  // Link do QR code da planilha (Meu Dia → Conectar): #conectar=<ponte>&chave=<chave>
  const h = new URLSearchParams(location.hash.slice(1));
  if (!NO_GOOGLE && h.get('conectar') && h.get('chave')) {
    history.replaceState(null, '', location.pathname + location.search); // tira a chave da barra de endereço
    ls.set(MODO, 'planilha'); // o QR code da planilha escolhe o modo planilha
    const atual = ls.get(CONEXAO) || {};
    if (atual.url !== h.get('conectar') || atual.chave !== h.get('chave')) {
      if (!atual.chave || confirm('Conectar este aparelho à planilha do link? A conexão atual será trocada.')) {
        [CACHE, FILA].forEach(k => { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } });
        E.rascunhoConexao = { url: h.get('conectar'), chave: h.get('chave') };
        telaConectar(); return conectar();
      }
    }
  }
  if (modoFirebase()) {
    const temCache = ls.get(UID) && (ls.get(CACHE) || {}).codigos;
    if (!temCache) $('main').innerHTML = '<div class="carregando">Abrindo…</div>';
    try { await carregarFirebase(); await FB.pronto(); } catch (e) { if (!temCache) return telaEntrar(semRede(e) || !navigator.onLine ? 'Sem internet. Na primeira vez, o app precisa de conexão.' : 'Não deu para abrir: ' + e.message); }
    const u = FB && FB.usuario();
    if (!u && !(temCache && !FB)) return telaEntrar();
    if (u && ls.get(UID) !== u.uid) { [CACHE, FILA].forEach(k => { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } }); ls.set(UID, u.uid); }
  } else if (!NO_GOOGLE && !(ls.get(CONEXAO) || {}).chave) return telaConectar();
  if (ls.get(TRAVA)) { travar(); destravar(); }
  const hoje = hojeIso();
  E.mesPres = E.mesFin = E.mesDiario = hoje.slice(0, 7);
  E.semHab = inicioSemana(hoje);
  marcarFila();
  const cache = ls.get(CACHE);
  if (cache && cache.codigos) { // abre na hora com o que está no aparelho
    carregar(cache);
    E.tela = telaInicial();
    history.replaceState({ tela: E.tela }, '');
    render();
    abrirAtalho();
  }
  try {
    await enviarFila();
    if ((ls.get(FILA) || []).length) { if (!cache) throw new Error('sem internet'); return; } // ainda offline: fica com o cache
    const d = await chamar('getDados');
    ultimaSync = Date.now();
    const primeira = !cache || !cache.codigos;
    carregar(d);
    if (primeira) { E.tela = telaInicial(); history.replaceState({ tela: E.tela }, ''); }
    if (!$('veu').classList.contains('aberto')) render();
    if (primeira) abrirAtalho();
    salvarCache();
    verificarConquistas(!cfg('Conquistas', ''));
    prepararAutomatico().then(sincronizarFolgas).then(limparCobrindo);
    if (d.fixosLancados) toast(plural(d.fixosLancados, 'gasto fixo lançado', 'gastos fixos lançados') + ' neste mês ✓');
    if (modoFirebase()) aposCarregarFb(d);
    E.ponte = d.ponte || '';
    if (ponteVelha() && !E.avisouPonte) { E.avisouPonte = true; setTimeout(() => toast('A ponte da planilha está desatualizada.', false, { txt: 'Ver', fn: () => { irPara('ajustes'); setTimeout(() => $('aj-atualizar') && $('aj-atualizar').scrollIntoView({ block: 'center' }), 200); } }), 1500); }
    if (E.tela === 'ajustes' && !$('veu').classList.contains('aberto')) render();
  } catch (e) {
    if (e.codigo === 'login') return telaEntrar();
    if (e.codigo === 'chave' && !NO_GOOGLE) return telaConectar(e.message);
    if (!cache) $('main').innerHTML = `<div class="carregando">${semRede(e) ? 'Sem internet. Na primeira vez, o app precisa de conexão para trazer seus dados.' : 'Erro ao carregar: ' + esc(e.message)}</div>`;
    else if (semRede(e)) marcarFila(); else toast('Erro ao atualizar: ' + e.message, true);
  }
}
/** Atalhos do ícone (segure o ícone do app): ?abrir=gasto | presenca | diario */
function abrirAtalho() {
  const q = new URLSearchParams(location.search), a = q.get('abrir'), texto = [q.get('titulo'), q.get('texto'), q.get('link')].filter(Boolean).join('\n');
  if ((!a && !texto) || !E.codigos.length) return;
  history.replaceState({ tela: E.tela }, '', location.pathname);
  if (texto) { const o = lerComprovante(texto); return o.Valor ? abrirLanc(null, o) : (ACOES.rapidas(), $('rapidoTxt').value = texto.slice(0, 120)); }
  if (a === 'gasto') ACOES.rapidas();
  else if (a === 'presenca') abrirDia(hojeIso());
  else if (a === 'diario') abrirDiario(hojeIso());
}
history.replaceState({ tela: E.tela }, '');
iniciar();
if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.tipo === 'nova-versao') avisarVersaoNova(); });
}
function avisarVersaoNova() {
  if (document.querySelector('.versao')) return;
  const d = document.createElement('div');
  d.className = 'versao'; d.innerHTML = 'Nova versão do app disponível <button data-a="atualizarVersao">Atualizar</button>';
  document.body.appendChild(d);
}
</script>
