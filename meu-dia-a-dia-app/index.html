<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Dia a Dia</title>
<meta name="description" content="Presença, hábitos, finanças, estudos e vida, num app só.">
<meta name="theme-color" content="#f4f6fb" id="corTema">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-180.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f6fb; --card: #ffffff; --tx: #0f172a; --sub: #64748b; --line: #e8ecf3; --soft: #f1f5f9; --soft2: #f8fafc;
    --inp: #dbe1ea; --tab: #eaeef4; --acc: #0b4f6c; --acct: #0b4f6c; --acc2: #e0f2fe;
    --sh: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
    --g: #16a34a; --g2: #dcfce7; --b: #2563eb; --b2: #dbeafe; --o: #d97706; --o2: #fef3c7;
    --r: #dc2626; --r2: #fee2e2; --p: #7e22ce; --p2: #f3e8ff; --t: #0f766e; --t2: #ccfbf1; --rosa: #ec4899;
    --warnbg: #fff7e6; --warnbd: #fde3a7; --expbg: #fff1f1; --expbd: #fecaca;
    --grad1: #0b4f6c; --grad2: #1b86a8; --c1: #1f7ea6; --c2: #e8853a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b1220; --card: #131c2e; --tx: #e6ecf5; --sub: #8b9ab3; --line: #22304a; --soft: #1b263b; --soft2: #172238;
    --inp: #2c3b57; --tab: #1b263b; --acc: #1f7ea6; --acct: #7dd3fc; --acc2: rgba(56,189,248,.14);
    --sh: 0 0 0 1px #1d2a42;
    --g: #4ade80; --g2: rgba(34,197,94,.16); --b: #93c5fd; --b2: rgba(59,130,246,.18); --o: #fbbf24; --o2: rgba(245,158,11,.16);
    --r: #f87171; --r2: rgba(239,68,68,.16); --p: #d8b4fe; --p2: rgba(168,85,247,.18); --t: #5eead4; --t2: rgba(20,184,166,.16);
    --warnbg: rgba(245,158,11,.10); --warnbd: rgba(245,158,11,.35); --expbg: rgba(239,68,68,.10); --expbd: rgba(239,68,68,.35);
    --c1: #2f96c2; --c2: #c86f2e;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0b1220; --card: #131c2e; --tx: #e6ecf5; --sub: #8b9ab3; --line: #22304a; --soft: #1b263b; --soft2: #172238;
    --inp: #2c3b57; --tab: #1b263b; --acc: #1f7ea6; --acct: #7dd3fc; --acc2: rgba(56,189,248,.14);
    --sh: 0 0 0 1px #1d2a42;
    --g: #4ade80; --g2: rgba(34,197,94,.16); --b: #93c5fd; --b2: rgba(59,130,246,.18); --o: #fbbf24; --o2: rgba(245,158,11,.16);
    --r: #f87171; --r2: rgba(239,68,68,.16); --p: #d8b4fe; --p2: rgba(168,85,247,.18); --t: #5eead4; --t2: rgba(20,184,166,.16);
    --warnbg: rgba(245,158,11,.10); --warnbd: rgba(245,158,11,.35); --expbg: rgba(239,68,68,.10); --expbd: rgba(239,68,68,.35);
    --c1: #2f96c2; --c2: #c86f2e;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--tx); font: 14px/1.4 Inter, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior-y: none; padding-top: env(safe-area-inset-top); }
  button, .day, .row, .appi, .chip { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  [data-a] { cursor: pointer; }
  button:focus-visible, [data-a]:focus-visible { outline: 2px solid var(--acct); outline-offset: 2px; }

  .app { display: flex; min-height: 100vh; }
  .side { width: 236px; background: var(--card); border-right: 1px solid var(--line); padding: 22px 14px; display: none; flex-direction: column; gap: 2px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; margin: 0 6px 22px; }
  .logo i { width: 34px; height: 34px; border-radius: 10px; background: var(--acc); display: grid; place-items: center; color: #fff; font-style: normal; }
  .navi { padding: 9px 12px; border-radius: 10px; color: var(--sub); font-weight: 600; display: flex; gap: 10px; align-items: center; text-align: left; }
  .navi:hover { background: var(--soft); }
  .navi.on { background: var(--acc2); color: var(--acct); }
  .navsep { font-size: 11px; font-weight: 800; color: var(--sub); opacity: .7; letter-spacing: .6px; margin: 14px 12px 4px; }
  .main { flex: 1; padding: 16px 16px calc(110px + env(safe-area-inset-bottom)); max-width: 1240px; margin: 0 auto; width: 100%; min-width: 0; }

  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; }
  .hello { min-width: 0; }
  .hello small { color: var(--sub); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hello b { font-size: 21px; font-weight: 800; letter-spacing: -.3px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .btnp { background: var(--acc); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .btns { background: var(--card); color: var(--tx); border: 1px solid var(--inp); border-radius: 12px; padding: 9px 13px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .card { background: var(--card); border-radius: 18px; box-shadow: var(--sh); padding: 16px; min-width: 0; }
  .grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-content: start; }
  .mb { margin-bottom: 14px; }
  .sec { font-size: 12.5px; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sec .lk { color: var(--acct); text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 700; text-decoration: none; }
  .vazio { color: var(--sub); font-size: 13px; padding: 10px 0; text-align: center; }
  .nota { color: var(--sub); font-size: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpis.k2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { background: var(--card); border-radius: 16px; box-shadow: var(--sh); padding: 12px; min-width: 0; }
  .kpi .v { font-size: 19px; font-weight: 800; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11px; color: var(--sub); font-weight: 600; margin-top: 2px; }
  .kpi.wide { grid-column: span 3; display: flex; align-items: center; gap: 14px; }
  .kpi.wide .v { font-size: 26px; }
  .ring { width: 60px; height: 60px; flex: none; }

  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 2px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { color: var(--sub); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--soft); }
  .pill { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 20px; white-space: nowrap; }
  .pg { background: var(--g2); color: var(--g); } .pb { background: var(--b2); color: var(--b); } .po { background: var(--o2); color: var(--o); }
  .pr { background: var(--r2); color: var(--r); } .pp { background: var(--p2); color: var(--p); } .pt { background: var(--t2); color: var(--t); } .pn { background: var(--soft); color: var(--sub); }
  .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; border-radius: 8px; background: var(--acc); }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding: 2px 2px 6px; scrollbar-width: none; }
  .chip { padding: 7px 12px; border-radius: 20px; background: var(--card); box-shadow: var(--sh); font-weight: 700; font-size: 12.5px; color: var(--sub); white-space: nowrap; flex: none; }
  .chip.on { background: var(--acc); color: #fff; }
  .tabs { display: flex; background: var(--tab); border-radius: 12px; padding: 4px; gap: 2px; margin-bottom: 12px; }
  .tabs button { flex: 1; text-align: center; padding: 7px 0; border-radius: 9px; font-weight: 700; color: var(--sub); font-size: 12.5px; }
  .tabs button.on { background: var(--card); color: var(--tx); box-shadow: var(--sh); }
  .arrows { display: flex; gap: 6px; }
  .arrows button { width: 32px; height: 32px; border-radius: 10px; background: var(--acc2); color: var(--acct); font-weight: 800; font-size: 16px; }
  .quote { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: #fff; border-radius: 18px; padding: 16px; font-size: 13.5px; line-height: 1.5; }
  .quote b { display: block; font-size: 11px; letter-spacing: .8px; opacity: .75; margin-bottom: 6px; }
  .val { font-weight: 800; font-size: 13.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .neg { color: var(--r); } .pos { color: var(--g); }
  .lin { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; gap: 8px; }

  /* início */
  .hero { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: #fff; border-radius: 22px; padding: 18px; display: grid; gap: 14px; }
  .hero .l1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hero h3 { font-size: 13px; font-weight: 700; opacity: .8; letter-spacing: .4px; text-transform: uppercase; }
  .hero .st { font-size: 20px; font-weight: 800; margin-top: 4px; letter-spacing: -.3px; }
  .hero .st small { display: block; font-size: 12.5px; font-weight: 600; opacity: .85; margin-top: 2px; letter-spacing: 0; }
  .hero .mini { text-align: center; flex: none; }
  .hero .mini svg { width: 64px; height: 64px; }
  .hero .mini small { display: block; font-size: 11px; font-weight: 700; opacity: .85; }
  .atalhos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .atalhos button { background: rgba(255,255,255,.13); color: #fff; border-radius: 14px; padding: 10px 4px; font-weight: 700; font-size: 11.5px; display: grid; gap: 4px; justify-items: center; }
  .atalhos button span { font-size: 20px; }
  .agenda .dia { font-size: 11.5px; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 2px; }
  .agenda .dia:first-child { margin-top: 0; }
  .agenda .it { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; font-weight: 600; }
  .agenda .it span:first-child { width: 26px; text-align: center; font-size: 16px; }
  .agenda .it small { margin-left: auto; color: var(--sub); font-weight: 700; font-size: 12px; white-space: nowrap; }

  /* calendário de presença */
  .mhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .mhead b { font-size: 17px; font-weight: 800; }
  .wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .wk .h { font-size: 11px; color: var(--sub); text-align: center; font-weight: 700; }
  .day { aspect-ratio: 1 / 1.08; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; font-weight: 700; min-width: 0; }
  .day .n { font-size: 11px; opacity: .75; font-weight: 600; }
  .day .c { font-size: 11px; font-weight: 800; letter-spacing: -.2px; max-width: 100%; overflow: hidden; }
  .day.empty { background: transparent; cursor: default; }
  .day.blank { border: 1.5px dashed var(--line); color: var(--sub); }
  .day.fer { border-color: var(--p); }
  .day.today { outline: 2.5px solid var(--acct); outline-offset: 1.5px; }
  .day.cob::before { content: ''; position: absolute; inset: 3px; border: 2px solid var(--rosa); border-radius: 9px; }
  .day.obs::after { content: ''; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
  .navcal { display: flex; gap: 6px; align-items: center; }
  .hojeb { height: 32px; padding: 0 11px; border-radius: 10px; background: var(--acc2); color: var(--acct); font-weight: 800; font-size: 12.5px; }
  .day.pulse { animation: pulsar 1.2s ease-out 2; }
  @keyframes pulsar { 0% { box-shadow: 0 0 0 0 rgba(56,189,248,.7); } 100% { box-shadow: 0 0 0 14px rgba(56,189,248,0); } }
  .anots { margin-top: 18px; }
  .anot { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
  .anot:first-of-type { border-top: 0; }
  .anot .dnum { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; flex: none; font-variant-numeric: tabular-nums; }
  .anot .t { flex: 1; min-width: 0; }
  .anot .t b { display: block; font-size: 13.5px; font-weight: 600; }
  .anot .t small { color: var(--sub); font-size: 12px; }
  [id^="fin-"] { scroll-margin-top: 14px; }
  .chips.fixo { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -16px 12px; padding: 8px 16px; }
  .leg { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; font-size: 12px; color: var(--sub); font-weight: 600; }
  .leg span { display: flex; align-items: center; gap: 6px; }
  .leg i { width: 10px; height: 10px; border-radius: 3px; }
  .year { display: grid; grid-template-columns: 30px repeat(31, minmax(0, 1fr)); gap: 2px; }
  .year .ml { font-weight: 700; color: var(--sub); font-size: 10px; display: flex; align-items: center; }
  .year .yc { aspect-ratio: 1; border-radius: 3px; }
  .alert { border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--warnbg); border: 1px solid var(--warnbd); margin-bottom: 8px; }
  .alert.exp { background: var(--expbg); border-color: var(--expbd); }
  .alert .ic { background: #f59e0b; }
  .alert.exp .ic { background: #ef4444; }
  .alert b { display: block; font-size: 14px; }
  .alert small { color: var(--sub); font-size: 12px; }
  .alert .dias { margin-left: auto; text-align: center; font-weight: 800; font-size: 22px; color: var(--o); line-height: 1; }
  .alert.exp .dias { color: var(--r); }
  .alert .dias small { display: block; font-size: 10px; font-weight: 600; }

  /* hábitos */
  .hab { display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 27px); gap: 6px 4px; align-items: center; }
  .hab .h { font-size: 10.5px; font-weight: 800; color: var(--sub); text-align: center; line-height: 1.25; }
  .hab .h.hj { color: var(--acct); }
  .hab .n { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .hab .n span { overflow: hidden; text-overflow: ellipsis; }
  .hab .n small { color: var(--sub); font-weight: 600; font-size: 10.5px; margin-left: auto; padding-right: 2px; }
  .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-size: 12px; color: #fff; font-weight: 800; margin: auto; }
  .dot.y { background: #16a34a; }
  .dot.hj { box-shadow: inset 0 0 0 2px var(--acct); }
  .dot.y.hj { box-shadow: none; }
  .dot.fut { background: transparent; border: 1.5px dashed var(--line); cursor: default; }
  .todo { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
  .todo:first-child { border-top: 0; }
  .todo .tx { flex: 1; min-width: 0; }
  .cb { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--inp); flex: none; display: grid; place-items: center; font-size: 12px; color: #fff; }
  .cb.y { background: #16a34a; border-color: #16a34a; }
  .todo.done .tx { text-decoration: line-through; color: var(--sub); }
  .add { color: var(--acct); font-weight: 700; font-size: 13px; padding: 10px 0 2px; display: block; }

  /* financeiro */
  .saldo { background: linear-gradient(135deg, var(--grad1), var(--grad2)); color: #fff; border-radius: 20px; padding: 18px; }
  .saldo small { opacity: .8; font-size: 12px; font-weight: 600; }
  .saldo .v { font-size: 30px; font-weight: 800; letter-spacing: -.8px; margin: 2px 0 14px; font-variant-numeric: tabular-nums; }
  .saldo .io { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .saldo .io div { background: rgba(255,255,255,.12); border-radius: 12px; padding: 9px 10px; min-width: 0; }
  .saldo .io b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saldo .io span { font-size: 10.5px; opacity: .85; font-weight: 600; }
  .saldo .arrows button { background: rgba(255,255,255,.15); color: #fff; }
  .donut { display: flex; gap: 16px; align-items: center; }
  .donut .d { width: 118px; height: 118px; border-radius: 50%; flex: none; position: relative; }
  .donut .d::after { content: ''; position: absolute; inset: 22px; background: var(--card); border-radius: 50%; }
  .donut .d span { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; font-weight: 800; font-size: 13px; text-align: center; line-height: 1.1; }
  .donut .d span small { display: block; font-size: 10px; color: var(--sub); font-weight: 600; }
  .lg { flex: 1; display: grid; gap: 7px; min-width: 0; }
  .lg div { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
  .lg i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .lg b { margin-left: auto; }
  .meta-top { display: flex; gap: 14px; align-items: center; }
  .meta-top .ic { width: 52px; height: 52px; font-size: 26px; border-radius: 16px; }
  .meta-num { font-size: 22px; font-weight: 800; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
  .onde { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mov { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .mov:first-child { border-top: 0; }
  .mov .t { flex: 1; min-width: 0; }
  .mov .t b { display: block; font-size: 13px; }
  .mov .t small { color: var(--sub); font-size: 12px; }

  /* faculdade */
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .ev { position: relative; padding: 0 0 14px; }
  .ev::before { content: ''; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2.5px solid var(--inp); }
  .ev.now::before { border-color: var(--o); background: var(--o); }
  .ev.late::before { border-color: var(--r); background: var(--r); }
  .ev.next::before { border-color: var(--acct); }
  .ev.done::before { border-color: var(--g); background: var(--g); }
  .ev b { font-size: 13.5px; display: block; }
  .ev.done b { color: var(--sub); }
  .ev small { color: var(--sub); font-size: 12px; }
  .ev .pill { float: right; margin-left: 8px; }

  /* leitura */
  .book { display: flex; gap: 14px; }
  .cover { width: 84px; height: 122px; border-radius: 10px; flex: none; display: flex; align-items: flex-end; padding: 8px; color: #fff; font-weight: 800; font-size: 11px; line-height: 1.2; box-shadow: 0 6px 14px rgba(0,0,0,.18); overflow: hidden; word-break: break-word; background-size: cover; background-position: center; }
  .cover.img { padding: 0; }
  .shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .shelf .cover { width: 100%; height: auto; aspect-ratio: 2 / 3; max-width: 100%; }
  .shelf small { display: block; font-size: 11px; color: var(--sub); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sint { margin-top: 12px; background: var(--soft2); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; }
  .busca .row img { width: 40px; height: 58px; object-fit: cover; border-radius: 6px; flex: none; background: var(--soft); }

  /* farmácia */
  .med { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }

<script>
// =====================================================================
// Estado e utilitários
// =====================================================================
const E = {
  tela: 'inicio',
  t: {},               // tabelas genéricas (Habitos, Lancamentos, ...)
  codigos: [], porCodigo: {}, dias: {}, folgas: [],
  prazoFolga: 60, codigoDaFolga: {},

  fCursos: 'Todos', fLugares: 'Quero ir', fDesejos: 'Todos', fFarm: 'Todos',
  diaAberto: null, codigoSel: '', form: null, auto: null,
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const iso = (a, m, d) => `${a}-${pad(m)}-${pad(d)}`;
const hojeIso = () => { const h = new Date(); return iso(h.getFullYear(), h.getMonth() + 1, h.getDate()); };
const paraDate = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d || 1); };
const deDate = d => iso(d.getFullYear(), d.getMonth() + 1, d.getDate());
const somaDias = (s, n) => { const d = paraDate(s); d.setDate(d.getDate() + n); return deDate(d); };
const difDias = (a, b) => Math.round((paraDate(b) - paraDate(a)) / 86400000);
const somaMes = (ym, n) => { const d = paraDate(ym + '-01'); d.setMonth(d.getMonth() + n); return deDate(d).slice(0, 7); };
const diasNoMes = (a, m) => new Date(a, m, 0).getDate();
const fmt = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '—';
const fmtCurto = s => s ? fmt(s).slice(0, 5) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const brl = v => 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brlCurto = v => 'R$ ' + Math.round(Number(v) || 0).toLocaleString('pt-BR');
const num = v => Number(v) || 0;
const uid = () => Math.random().toString(16).slice(2, 10);
const T = n => E.t[n] || (E.t[n] = []);
const cfg = (k, padrao) => { const c = T('Config').find(x => x.Chave === k); return c && c.Valor !== '' ? c.Valor : padrao; };
const liga = k => !/^(não|nao|false|0|off)$/i.test(String(cfg(k, 'sim')).trim());
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const nomeMes = ym => { const [a, m] = ym.split('-').map(Number); return MESES[m - 1][0].toUpperCase() + MESES[m - 1].slice(1) + ' ' + a; };
const maiuscula = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);
const emDias = n => n === 0 ? 'Hoje' : n === 1 ? 'Amanhã' : n < 0 ? plural(-n, 'dia atrás', 'dias atrás') : plural(n, 'dia', 'dias');
function fraseDoDia() {
  const minhas = String(cfg('MinhasFrases', '')).split('\n').concat(cfg('Frase', '')).map(f => String(f).trim()).filter(Boolean);
  if (cfg('FraseModo', 'Automática') === 'Fixa' && cfg('Frase', '')) return cfg('Frase');
  const todas = (E.frases || []).concat(minhas);
  if (!todas.length) return 'Toque para escrever sua frase.';
  const h = hojeIso();
  return todas[Math.floor(Date.UTC(+h.slice(0, 4), +h.slice(5, 7) - 1, +h.slice(8)) / 864e5) % todas.length];

const escuro = () => { const t = cfg('Tema', 'Automático'); return t === 'Escuro' || (t !== 'Claro' && matchMedia('(prefers-color-scheme: dark)').matches); };

const CORES_APP = {
  'Azul petróleo': { acc: '#0b4f6c', accE: '#1f7ea6', g1: '#0b4f6c', g2: '#1b86a8', tint: '#e0f2fe', txt: '#0b4f6c', tintE: 'rgba(56,189,248,.14)', txtE: '#7dd3fc' },
  'Verde': { acc: '#15803d', accE: '#16a34a', g1: '#14532d', g2: '#22a35a', tint: '#dcfce7', txt: '#166534', tintE: 'rgba(34,197,94,.16)', txtE: '#86efac' },
  'Roxo': { acc: '#6d28d9', accE: '#7c3aed', g1: '#4c1d95', g2: '#8b5cf6', tint: '#ede9fe', txt: '#5b21b6', tintE: 'rgba(139,92,246,.18)', txtE: '#c4b5fd' },
  'Laranja': { acc: '#c2410c', accE: '#ea580c', g1: '#9a3412', g2: '#f97316', tint: '#ffedd5', txt: '#9a3412', tintE: 'rgba(249,115,22,.16)', txtE: '#fdba74' },

  'Grafite': { acc: '#334155', accE: '#475569', g1: '#1e293b', g2: '#475569', tint: '#e2e8f0', txt: '#1e293b', tintE: 'rgba(148,163,184,.16)', txtE: '#cbd5e1' },
};
function aplicarCor() {

const NO_GOOGLE = typeof google !== 'undefined' && google.script && google.script.run;
const CONEXAO = 'mdd_conexao';
function chamar(fn, ...args) {
  if (NO_GOOGLE) return new Promise((ok, falha) => google.script.run.withSuccessHandler(ok).withFailureHandler(falha)[fn](...args));
  const c = ls.get(CONEXAO);
  if (!c) return Promise.reject(Object.assign(new Error('Este aparelho ainda não está conectado à planilha.'), { codigo: 'chave' }));
  return chamarPonte(c, fn, args);
}
/** POST simples (text/plain, sem pré-checagem de CORS) para o /exec do Apps Script. */
async function chamarPonte(c, fn, args) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 40000);
  let r;
  try {
    r = await fetch(c.url, { method: 'POST', body: JSON.stringify({ chave: c.chave, fn, args }), signal: ctl.signal, redirect: 'follow' });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'tempo esgotado' : 'network: sem conexão');
  } finally { clearTimeout(t); }
  if (!r.ok) throw new Error('network: http ' + r.status);
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('A ponte não respondeu como esperado. Confira o endereço (deve terminar em /exec) e se a implantação está como “Qualquer pessoa”.'); }
  if (j.ok) return j.r;
  throw Object.assign(new Error(j.erro || 'Erro na planilha'), { codigo: j.codigo });
}

function toast(msg, erro) {
  if (!msg) return;
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (erro ? ' erro' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.className = 'toast', erro ? 5000 : 1800);
}

const CHAVE = { Config: 'Chave', Orcamentos: 'Categoria', Diario: 'Data' };

// ---------- Aparelho: cache para abrir rápido e fila para quando a internet cair ----------
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem armazenamento: segue sem cache */ } },
};
const FILA = 'mdd_fila', CACHE = 'mdd_cache';
const semRede = e => !navigator.onLine || /network|connection|http 0|failed to fetch|timeout|tempo esgotado/i.test(String((e && e.message) || e));

/** Grava no servidor; sem internet, guarda na fila do aparelho e envia depois. */
async function gravar(fn, ...args) {
  try {
    const r = await chamar(fn, ...args);
    enviarFila();
    return r;
  } catch (e) {
    if (!semRede(e)) throw e;
    const fila = ls.get(FILA) || [];
    fila.push({ fn, args });
    ls.set(FILA, fila);
    marcarFila();
    salvarCache(true); // a tela já mostra a mudança: guarda agora, caso o app seja fechado em seguida
    return { __offline: true };
  }
}
let enviandoFila = false;
async function enviarFila() {
  const fila = ls.get(FILA) || [];
  if (enviandoFila || !fila.length) return marcarFila();
  enviandoFila = true;
  try {
    let enviados = 0;
    while (fila.length) {
      try {
        await chamar(fila[0].fn, ...fila[0].args);
      } catch (e) {
        if (semRede(e) || e.codigo === 'chave') throw e; // sem conexão (ou desconectado): tenta de novo depois
        toast('Uma alteração feita sem internet não pôde ser salva: ' + e.message, true); // erro dela: não trava as outras
      }
      fila.shift();
      ls.set(FILA, fila);
      enviados++;
    }
    if (enviados) toast('Alterações enviadas ✓');
  } catch (e) { /* ainda sem conexão: tenta de novo depois */ } finally { enviandoFila = false; marcarFila(); }
}
function marcarFila() {
  const n = (ls.get(FILA) || []).length;
  document.body.classList.toggle('offline', n > 0);
  $('selo').textContent = n ? `Sem internet · ${plural(n, 'alteração guardada', 'alterações guardadas')} para enviar` : '';
}

  });
}
function salvarCache(agora) {

}

async function salvarItem(tab, obj, msg = 'Salvo ✓') {

async function salvarLista(tab, objs, msg = 'Salvo ✓') {
  const k = CHAVE[tab] || 'ID';
  const lista = T(tab);
  const antes = [];
  objs.forEach(o => {
    if (!o[k]) o[k] = uid();
    const i = lista.findIndex(x => x[k] === o[k]);
    antes.push(i >= 0 ? lista[i] : null);
    if (i >= 0) lista[i] = o; else lista.push(o);
  });
  render();
  try {
    const r = await gravar('salvarVarios', tab, objs);
    toast(avisoOffline(r) ? 'Sem internet: guardado no aparelho ⏳' : msg);
    salvarCache();
    verificarConquistas();
  } catch (e) {
    objs.forEach((o, n) => { const j = lista.indexOf(o); if (antes[n]) lista[j] = antes[n]; else lista.splice(j, 1); });
    render();
    toast('Erro ao salvar: ' + e.message, true);
  }
}

}

function corCodigo(code) {
  const P = escuro() ? PAL_ESCURO : PAL_CLARO;
  const c = E.porCodigo[code];
  if (!c) return P.Outro;
  if (code === 'FERI') return P.FERI;

// Feriados nacionais (com Páscoa calculada) + extras definidos em Ajustes ("dd/mm Nome", um por linha)
function pascoa(a) {
  const f = Math.floor, G = a % 19, C = f(a / 100), H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30;
  const I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11)), J = (a + f(a / 4) + I + 2 - C + f(C / 4)) % 7;
  const L = I - J, m = 3 + f((L + 40) / 44), d = L + 28 - 31 * f(m / 4);
  return iso(a, m, d);
}
const cacheFeriados = {};
function feriados(a) {
  const chave = a + '|' + cfg('FeriadosExtras', '');
  if (cacheFeriados[chave]) return cacheFeriados[chave];
  const p = pascoa(a);
  const f = {
    [iso(a, 1, 1)]: 'Confraternização Universal', [somaDias(p, -2)]: 'Paixão de Cristo', [iso(a, 4, 21)]: 'Tiradentes',
    [iso(a, 5, 1)]: 'Dia do Trabalho', [somaDias(p, 60)]: 'Corpus Christi', [iso(a, 9, 7)]: 'Independência do Brasil',
    [iso(a, 10, 12)]: 'Nossa Senhora Aparecida', [iso(a, 11, 2)]: 'Finados', [iso(a, 11, 15)]: 'Proclamação da República',
    [iso(a, 11, 20)]: 'Consciência Negra', [iso(a, 12, 25)]: 'Natal',
  };
  String(cfg('FeriadosExtras', '')).split(/\n|;/).forEach(l => {
    const m = l.trim().match(/^(\d{1,2})\/(\d{1,2})\s+(.+)$/);
    if (m) f[iso(a, +m[2], +m[1])] = m[3].trim();
  });
  return cacheFeriados[chave] = f;
}
const feriadoDe = k => feriados(+k.slice(0, 4))[k];

function resumoMes(ym) {

  for (let d = 1; d <= n; d++) {

function diasParaPreparar(ym, o) {
  const [a, m] = ym.split('-').map(Number);
  const lista = [];
  for (let d = 1; d <= diasNoMes(a, m); d++) {
    const k = iso(a, m, d);
    if (E.dias[k]) continue;
    const sem = paraDate(k).getDay(), fer = feriadoDe(k);
    if (o.fer && fer) lista.push({ data: k, codigo: 'FERI', obs: fer });
    else if (o.dom && sem === 0) lista.push({ data: k, codigo: 'DOM' });
    else if (o.sab && sem === 6) lista.push({ data: k, codigo: 'SÁB' });
  }
  return lista;
}

async function prepararAutomatico() {
  if (!liga('PrepararAuto') || !E.codigos.some(c => c.codigo === 'DOM')) return;
  const feitos = String(cfg('MesesPreparados', '')).split(',').filter(Boolean);
  const atual = hojeIso().slice(0, 7), meses = [atual, somaMes(atual, 1)].filter(m => !feitos.includes(m));
  if (!meses.length) return;
  const lista = meses.flatMap(m => diasParaPreparar(m, opcoesPreparar()));
  lista.forEach(aplicarDia);
  salvarConfig({ MesesPreparados: feitos.concat(meses).slice(-24).join(',') }, '');

  } catch (e) {
    lista.forEach(d => delete E.dias[d.data]);
    toast('Não deu para preparar o mês: ' + e.message, true);
  }
}

const inicioSemana = s => { const d = paraDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return deDate(d); };
const habitosAtivos = () => T('Habitos').filter(h => h.Ativo !== false).sort((a, b) => num(a.Ordem) - num(b.Ordem));
const metaSemana = h => { const m = num(h.MetaSemana); return m > 0 && m < 7 ? m : 0; };
const feito = (data, hid) => T('HabitosLog').some(l => l.ID === data + '_' + hid);
const feitosNaSemana = (ini, hid) => [...Array(7)].filter((_, i) => feito(somaDias(ini, i), hid)).length;
function sequencia(h) {
  const meta = metaSemana(h);
  if (meta) { // semanas seguidas cumprindo a meta
    let ini = inicioSemana(hojeIso()), n = 0;
    if (feitosNaSemana(ini, h.ID) < meta) ini = somaDias(ini, -7); else n = 1, ini = somaDias(ini, -7);
    while (feitosNaSemana(ini, h.ID) >= meta) { n++; ini = somaDias(ini, -7); }
    return n + ' sem';
  }
  const datas = new Set(T('HabitosLog').filter(l => l.HabitoID === h.ID).map(l => l.Data));
  let d = hojeIso(), n = 0;
  if (!datas.has(d)) d = somaDias(d, -1);
  while (datas.has(d)) { n++; d = somaDias(d, -1); }
  return String(n);
}
function pctSemana(ini) {
  const hab = habitosAtivos(), hoje = hojeIso();
  const decorridos = Math.max(0, Math.min(7, difDias(ini, hoje) + 1));
  if (!hab.length || !decorridos) return null;
  let alvo = 0, ok = 0;
  hab.forEach(h => {
    const meta = metaSemana(h), feitos = feitosNaSemana(ini, h.ID);
    const a = meta || decorridos;
    alvo += a; ok += Math.min(feitos, a);
  });
  return alvo ? ok / alvo : null;
}
const periodo = escopo => escopo === 'semana' ? E.semHab : escopo === 'mes' ? E.semHab.slice(0, 7) : E.semHab.slice(0, 4);

function listaTarefas(escopo, titulo, topo = '') {
  const per = periodo(escopo);
  const itens = T('Tarefas').filter(t => t.Escopo === escopo && String(t.Periodo) === per);
  return `<div class="card"><div class="sec">${titulo}</div>${topo}
    ${itens.map(t => `<div class="todo ${t.Feito ? 'done' : ''}"><div class="cb ${t.Feito ? 'y' : ''}" data-a="tarefa" data-id="${esc(t.ID)}">${t.Feito ? '✓' : ''}</div><span class="tx" data-a="editarTarefa" data-id="${esc(t.ID)}">${esc(t.Titulo)}</span></div>`).join('') || '<div class="vazio">Nada por aqui ainda.</div>'}
    <button class="add" data-a="novaTarefa" data-escopo="${escopo}">+ Adicionar</button></div>`;
}

      ${hab.length ? `<div class="hab"><div></div>${dias.map(d => `<div class="h ${d === hoje ? 'hj' : ''}">${'DSTQQSS'[paraDate(d).getDay()]}<br>${+d.slice(8)}</div>`).join('')}
      ${hab.map(h => { const meta = metaSemana(h);
        return `<div class="n" data-a="editarHabito" data-id="${esc(h.ID)}">${esc(h.Icone || '')}<span>${esc(h.Nome)}</span><small>${meta ? feitosNaSemana(ini, h.ID) + '/' + meta : '🔥' + sequencia(h)}</small></div>` +

        const alvo = metaSemana(h) ? Math.round(metaSemana(h) * ate / 7) : ate;
        return `<div style="margin-bottom:12px"><div class="lin"><span>${esc(h.Icone || '')} ${esc(h.Nome)}</span><span>${n}/${alvo} ${metaSemana(h) ? '(meta ' + metaSemana(h) + 'x/sem)' : 'dias'}</span></div>${bar(alvo ? n / alvo * 100 : 0, '#16a34a')}</div>`; }).join('') || '<div class="vazio">Nenhum hábito.</div>'}`;
  }
  const esc_ = E.abaTodo || 'semana', titulos = { semana: 'Da semana', mes: 'Do mês', ano: 'Metas do ano' };
  return `<div class="secao" id="cal-habitos" style="scroll-margin-top:60px">✅ Hábitos e to-dos</div>

  </div>`;
}

const CATEGORIAS = ['Alimentação', 'Moradia', 'Transporte', 'Pessoal', 'Estudos', 'Saúde', 'Lazer', 'Assinaturas', 'Presentes', 'Viagens', 'Salário', 'Outros'];
const CORES_CAT = { 'Alimentação': '#f97316', 'Moradia': '#2563eb', 'Transporte': '#0891b2', 'Pessoal': '#a855f7', 'Estudos': '#0d9488', 'Saúde': '#ef4444', 'Lazer': '#84cc16', 'Assinaturas': '#6366f1', 'Presentes': '#ec4899', 'Viagens': '#eab308', 'Salário': '#16a34a', 'Outros': '#94a3b8' };
const ICONE_CAT = { 'Alimentação': '🛒', 'Moradia': '🏠', 'Transporte': '🚌', 'Pessoal': '🧍', 'Estudos': '🎓', 'Saúde': '🩺', 'Lazer': '🎬', 'Assinaturas': '📺', 'Presentes': '🎁', 'Viagens': '✈️', 'Salário': '💼', 'Outros': '📦' };
const PAGAMENTOS = ['Crédito', 'Débito', 'Pix', 'Dinheiro', 'Boleto', 'Voucher'];
const lancMes = ym => T('Lancamentos').filter(l => String(l.Data).slice(0, 7) === ym);
const saidasMes = ym => lancMes(ym).filter(l => l.Tipo !== 'Entrada');
const gastoCategoria = (ym, c) => saidasMes(ym).filter(l => l.Categoria === c).reduce((a, l) => a + num(l.Valor), 0);
const sinal = m => m.Tipo === 'Retirada' ? -1 : 1;
const movsDe = onde => T('Movimentos').filter(m => (m.Onde || '') === onde);
const saldoReserva = r => num(r.Valor) + movsDe(r.Nome).reduce((a, m) => a + sinal(m) * num(m.Valor), 0);
function locaisGuardado() {
  // Reservas cadastradas + lugares citados só nos movimentos das metas (ex.: "Caixinha Nubank")
  const nomes = new Set(T('Reservas').map(r => r.Nome));
  const extras = {};
  T('Movimentos').forEach(m => { const o = m.Onde || 'Sem local'; if (!nomes.has(o)) extras[o] = (extras[o] || 0) + sinal(m) * num(m.Valor); });
  return T('Reservas').map(r => ({ r, nome: r.Nome, icone: r.Icone || '🐷', valor: saldoReserva(r), metas: saldoReserva(r) - num(r.Valor) }))
    .concat(Object.entries(extras).map(([nome, valor]) => ({ nome, icone: '📍', valor, metas: valor })));
}
const totalGuardado = () => locaisGuardado().reduce((a, l) => a + l.valor, 0);
const guardadoDesejo = d => num(d.Guardado) + T('Movimentos').filter(m => m.DesejoID === d.ID).reduce((a, m) => a + sinal(m) * num(m.Valor), 0);

const SECOES_FIN = [['fin-resumo', 'Resumo'], ['fin-metas', 'Metas'], ['fin-lanc', 'Lançamentos'], ['fin-fixos', 'Fixos'], ['fin-orc', 'Orçamento'], ['fin-cat', 'Categorias'], ['fin-guardado', 'Guardado'], ['fin-cartoes', 'Cartões']];
const ALIAS_FIN = { mes: 'fin-resumo', metas: 'fin-metas', plano: 'fin-fixos' };

function telaFinanceiro() {
  const ym = E.mesFin, ls = lancMes(ym);
  const ent = ls.filter(l => l.Tipo === 'Entrada').reduce((a, l) => a + num(l.Valor), 0);
  const sai = ls.filter(l => l.Tipo !== 'Entrada');
  const totSai = sai.reduce((a, l) => a + num(l.Valor), 0);
  const guardMes = T('Movimentos').filter(m => String(m.Data).slice(0, 7) === ym).reduce((a, m) => a + sinal(m) * num(m.Valor), 0);
  return `${cab(nomeMes(ym), 'Financeiro', botao('+ Lançar', 'novoLanc'))}
  <div class="chips fixo">${SECOES_FIN.map(([id, l]) => `<button class="chip" data-a="irSecao" data-v="${id}">${l}</button>`).join('')}</div>
  <div class="grid g2">
    <div class="grid">
      <div class="saldo" id="fin-resumo"><div class="linha1"><small>Saldo de ${MESES[+ym.slice(5) - 1]}</small><div class="arrows"><button data-a="mesFin" data-n="-1" aria-label="Mês anterior">‹</button><button data-a="mesFin" data-n="1" aria-label="Próximo mês">›</button></div></div>
        <div class="v">${brl(ent - totSai)}</div>
        <div class="io"><div><b>${brl(ent)}</b><span>↑ Entradas</span></div><div><b>${brl(totSai)}</b><span>↓ Saídas</span></div><div><b>${brl(guardMes)}</b><span>🐷 Guardado no mês</span></div></div>
        ${(() => { const ant = saidasMes(somaMes(ym, -1)).reduce((a, l) => a + num(l.Valor), 0); if (!ant || !totSai) return ''; const p = Math.round((totSai - ant) / ant * 100);
          return `<div style="margin-top:12px;font-size:12.5px;font-weight:600;opacity:.92">${p === 0 ? 'Você gastou o mesmo que' : `Você gastou ${Math.abs(p)}% ${p > 0 ? 'a mais' : 'a menos'} que`} em ${MESES[+somaMes(ym, -1).slice(5) - 1]} (${brlCurto(ant)}).</div>`; })()}</div>
      ${secMetas()}
      ${secLancamentos(ls)}
      ${secFixos()}
    </div>
    <div class="grid">
      ${secOrcamento(ym)}
      ${secCategorias(sai, totSai)}
      ${secGuardado()}
      ${secCartoes(sai)}
    </div>
  </div>`;
}

function secMetas() {
  const ds = T('Desejos'), f = E.fDesejos;
  const pend = ds.filter(d => d.Status !== 'Comprado');
  const lista = ds.filter(d => f === 'Todos' ? d.Status !== 'Comprado' : f === 'Comprados' ? d.Status === 'Comprado' : d.Tipo === f && d.Status !== 'Comprado');
  const prio = { 'Alta': 0, 'Média': 1, 'Baixa': 2 };
  lista.sort((a, b) => (prio[a.Prioridade] ?? 1) - (prio[b.Prioridade] ?? 1));
  const total = pend.reduce((a, d) => a + num(d.Preco), 0), guard = pend.reduce((a, d) => a + Math.max(0, guardadoDesejo(d)), 0);
  return `<div class="card" id="fin-metas"><div class="sec">Metas e desejos <button class="lk" data-a="novoDesejo">+ Meta</button></div>
    ${pend.length ? `<div class="lin" style="margin-bottom:6px"><span>${brl(guard)} guardados</span><span class="nota" style="font-weight:700">de ${brl(total)} · falta ${brlCurto(Math.max(0, total - guard))}</span></div>${bar(total ? guard / total * 100 : 0, '#16a34a')}` : ''}
    <div class="chips" style="margin:12px 0 4px">${['Todos', 'Necessidade', 'Desejo', 'Comprados'].map(x => `<button class="chip ${f === x ? 'on' : ''}" data-a="fDesejos" data-v="${x}">${x}</button>`).join('')}</div>
    ${lista.map(d => { const g = guardadoDesejo(d), p = num(d.Preco) ? Math.min(100, Math.round(g / num(d.Preco) * 100)) : 0;
      return `<div class="row" data-a="verDesejo" data-id="${esc(d.ID)}"><div class="ic">${esc(d.Icone || '🎁')}</div>
        <div class="t"><b>${esc(d.Nome)}</b><small>${esc(d.Tipo || 'Desejo')} · ${brl(g)} de ${brl(d.Preco)}</small>${d.Status === 'Comprado' ? '' : bar(p, p >= 100 ? '#16a34a' : '')}</div>
        <div style="text-align:right"><div class="val">${d.Status === 'Comprado' ? '✓' : p + '%'}</div><small class="nota" style="font-weight:700">${d.Status === 'Comprado' ? 'comprado' : p >= 100 ? 'dá p/ comprar' : 'falta ' + brlCurto(num(d.Preco) - g)}</small></div></div>`; }).join('') || '<div class="vazio">Nenhuma meta aqui. Toque em “+ Meta”.</div>'}
    <p class="nota" style="margin-top:6px">Toque numa meta para guardar ou retirar dinheiro e ver o histórico.</p></div>`;
}

function secLancamentos(ls) {
  const ord = ls.slice().sort((a, b) => String(b.Data).localeCompare(String(a.Data)));
  const mostrar = E.verTodosLanc ? ord : ord.slice(0, 8);
  return `<div class="card" id="fin-lanc"><div class="sec">Lançamentos do mês <button class="lk" data-a="novoLanc">+ Lançar</button></div>
    <div class="rapido" style="margin:0 0 10px"><input id="rapidoFin" placeholder="Digite: mercado 52,30 pix" autocomplete="off" enterkeyhint="go"><button class="btns" data-a="rapidoLanc" data-campo="rapidoFin">Lançar</button></div>
    ${mostrar.map(l => `<div class="row" data-a="editarLanc" data-id="${esc(l.ID)}"><div class="ic">${l.Tipo === 'Entrada' ? '💰' : ICONE_CAT[l.Categoria] || '📦'}</div>
      <div class="t"><b>${esc(l.Descricao || l.Categoria)}</b><small>${String(l.Origem).startsWith('fixo:') ? '🔁 Fixo · ' : String(l.Origem).startsWith('parc:') ? '💳 Parcela · ' : ''}${esc(l.Tipo === 'Entrada' ? 'Entrada' : l.Categoria)}${l.Pagamento ? ' · ' + esc(l.Pagamento) : ''}${l.Cartao ? ' ' + esc(l.Cartao) : ''} · ${fmtCurto(l.Data)}</small></div>
      <span class="val ${l.Tipo === 'Entrada' ? 'pos' : 'neg'}">${l.Tipo === 'Entrada' ? '+' : '−'} ${brl(l.Valor)}</span></div>`).join('') || '<div class="vazio">Nenhum lançamento neste mês.</div>'}
    ${ord.length > 8 ? `<button class="add" data-a="todosLanc">${E.verTodosLanc ? 'Mostrar menos' : `Ver todos (${ord.length})`}</button>` : ''}</div>`;
}

// Dia em que o fixo cai no mês: dia do mês, Nº dia útil, ou dia do mês recuando para o útil anterior
const REGRAS_FIXO = ['Dia do mês', 'Dia útil', 'Dia do mês ou útil anterior'];
const diaUtil = (k, sab) => { const w = paraDate(k).getDay(); return w !== 0 && (sab || w !== 6) && !feriadoDe(k); };
function dataDoFixo(r, ym) {
  const [a, m] = ym.split('-').map(Number), n = diasNoMes(a, m), d = Math.min(num(r.Dia) || 1, n), sab = r.SabadoUtil === true;
  if (r.Regra === REGRAS_FIXO[1]) {
    let c = 0, k = iso(a, m, n);
    for (let i = 1; i <= n; i++) if (diaUtil(iso(a, m, i), sab) && ++c === d) { k = iso(a, m, i); break; }
    return k;
  }
  let k = iso(a, m, d);
  if (r.Regra === REGRAS_FIXO[2]) while (!diaUtil(k, sab) && +k.slice(8) > 1) k = somaDias(k, -1);
  return k;
}
const textoDiaFixo = r => r.Regra === REGRAS_FIXO[1] ? `${num(r.Dia) || 1}º dia útil` : r.Regra === REGRAS_FIXO[2] ? `Dia ${num(r.Dia) || 1} (ou útil anterior)` : `Todo dia ${num(r.Dia) || 1}`;
const fimFixo = r => /^\d{4}-\d{2}/.test(String(r.Ate || '')) ? String(r.Ate).slice(0, 7) : '';
const fixoValeEm = (r, ym) => r.Ativo !== false && (!fimFixo(r) || ym <= fimFixo(r));
function duracaoFixo(r, ym) {
  const fim = fimFixo(r);
  if (!fim) return '🔁 Fixo';
  const n = (+fim.slice(0, 4) - +ym.slice(0, 4)) * 12 + (+fim.slice(5) - +ym.slice(5)) + 1;
  return n <= 0 ? `⏳ Prazo encerrado em ${fmtValidade(fim)}` : `⏳ Prazo até ${fmtValidade(fim)} · ${n === 1 ? 'último mês' : 'faltam ' + n + ' meses'}`;
}
function secFixos() {
  const ym = hojeIso().slice(0, 7);
  const feitos = new Set(T('Lancamentos').map(l => String(l.Origem)));
  const fixos = T('Recorrentes').slice().sort((a, b) => fixoValeEm(b, ym) - fixoValeEm(a, ym) || (b.Tipo === 'Entrada') - (a.Tipo === 'Entrada') || dataDoFixo(a, ym).localeCompare(dataDoFixo(b, ym)));
  const totFixos = fixos.filter(r => fixoValeEm(r, ym) && r.Tipo !== 'Entrada').reduce((a, r) => a + num(r.Valor), 0);
  const totEnt = fixos.filter(r => fixoValeEm(r, ym) && r.Tipo === 'Entrada').reduce((a, r) => a + num(r.Valor), 0);
  return `<div class="card" id="fin-fixos"><div class="sec">Fixos do mês <button class="lk" data-a="novoFixo">+ Fixo</button></div>
    ${fixos.map(r => { const ok = feitos.has('fixo:' + r.ID + ':' + ym);
      return `<div class="row" data-a="editarFixo" data-id="${esc(r.ID)}"><div class="ic">${r.Tipo === 'Entrada' ? '💰' : ICONE_CAT[r.Categoria] || '🔁'}</div>
      <div class="t"><b>${esc(r.Descricao)}</b><small>${textoDiaFixo(r)} · ${esc(r.Categoria || '')}${r.Pagamento ? ' · ' + esc(r.Pagamento) : ''}</small><div class="fixo-dur">${duracaoFixo(r, ym)}</div></div>
      <div style="text-align:right"><div class="val">${brl(r.Valor)}</div>${r.Ativo === false ? '<span class="pill pn">Pausado</span>' : !fixoValeEm(r, ym) ? '<span class="pill pn">Encerrado</span>' : ok ? '<span class="pill pg">' + (r.Tipo === 'Entrada' ? 'Recebido' : 'Lançado') + '</span>' : '<span class="pill pb">' + fmtCurto(dataDoFixo(r, ym)) + '</span>'}</div></div>`; }).join('') || '<div class="vazio">Cadastre aluguel, assinaturas, mensalidade… Eles entram sozinhos todo mês, no dia certo.</div>'}
    ${fixos.length ? `<div class="lin" style="margin-top:8px;padding-top:10px;border-top:1px solid var(--line)"><span>Gastos fixos por mês</span><span>${brl(totFixos)}</span></div>${totEnt ? `<div class="lin" style="margin-top:6px"><span>Entradas fixas por mês</span><span class="pos">${brl(totEnt)}</span></div>` : ''}` : ''}</div>`;
}

function secOrcamento(ym) {
  const orc = T('Orcamentos');
  return `<div class="card" id="fin-orc"><div class="sec">Orçamento de ${MESES[+ym.slice(5) - 1]} <button class="lk" data-a="novoOrcamento">+ Limite</button></div>
    ${orc.map(o => { const g = gastoCategoria(ym, o.Categoria), p = num(o.Limite) ? g / num(o.Limite) * 100 : 0;
      return `<div class="row" data-a="editarOrcamento" data-id="${esc(o.Categoria)}"><div class="ic">${ICONE_CAT[o.Categoria] || '📦'}</div><div class="t"><b>${esc(o.Categoria)}</b><small>${brl(g)} de ${brl(o.Limite)}</small>${bar(p, corLimite(p))}</div><span class="pill ${p >= 100 ? 'pr' : p >= 80 ? 'po' : 'pg'}">${Math.round(p)}%</span></div>`; }).join('') || '<div class="vazio">Defina um limite por mês (ex.: Alimentação R$ 800). A barra fica laranja perto do limite e vermelha quando passa.</div>'}</div>`;
}

function secCategorias(sai, totSai) {
  const porCat = {}, antes = {};
  sai.forEach(l => porCat[l.Categoria || 'Outros'] = (porCat[l.Categoria || 'Outros'] || 0) + num(l.Valor));
  const ymAnt = somaMes(E.mesFin, -1), nomeAnt = MESES[+ymAnt.slice(5) - 1].slice(0, 3);
  saidasMes(ymAnt).forEach(l => antes[l.Categoria || 'Outros'] = (antes[l.Categoria || 'Outros'] || 0) + num(l.Valor));
  const delta = c => { if (!antes[c]) return ''; const p = Math.round((porCat[c] - antes[c]) / antes[c] * 100); return p === 0 ? '<span class="delta">= ' + nomeAnt + '</span>' : `<span class="delta ${p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}% vs ${nomeAnt}</span>`; };
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  let acc = 0;
  const conic = cats.map(([c, v]) => { const a = acc / totSai * 360; acc += v; return `${CORES_CAT[c] || '#94a3b8'} ${a}deg ${acc / totSai * 360}deg`; }).join(',');
  const porPag = PAGAMENTOS.map(p => [p, sai.filter(l => l.Pagamento === p).reduce((a, l) => a + num(l.Valor), 0)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const maxPag = porPag.length ? porPag[0][1] : 1;
  return `<div class="card" id="fin-cat"><div class="sec">Gastos por categoria</div>
    ${cats.length ? `<div class="donut"><div class="d" style="background:conic-gradient(${conic})"><span><div>${brlCurto(totSai)}<small>no mês</small></div></span></div>
    <div class="lg">${cats.map(([c, v]) => `<div><i style="background:${CORES_CAT[c] || '#94a3b8'}"></i>${esc(c)}<b>${Math.round(v / totSai * 100)}%</b></div>`).join('')}</div></div>
    <div class="sec" style="margin-top:16px">Comparado a ${MESES[+ymAnt.slice(5) - 1]}</div>
    ${cats.map(([c, v]) => `<div class="lin" style="padding:5px 0"><span>${ICONE_CAT[c] || '📦'} ${esc(c)}</span><span>${brl(v)} ${delta(c) || '<span class="delta">novo</span>'}</span></div>`).join('')}` : '<div class="vazio">Sem gastos neste mês.</div>'}
    ${porPag.length ? `<div class="sec" style="margin-top:16px">Por forma de pagamento</div>${porPag.map(([p, v]) => `<div style="margin-bottom:10px"><div class="lin"><span>${p}</span><span>${brl(v)}</span></div>${bar(v / maxPag * 100)}</div>`).join('')}` : ''}</div>`;
}

function secGuardado() {
  const locais = locaisGuardado();

  const n = difDias(hojeIso(), a.Data);

  if (n <= 7) return { c: 'next', p: 'pb', t: emDias(n), n };
  return { c: '', p: 'pn', t: emDias(n), n };
}

function estadoRemedio(r) {
  const v = String(r.Validade || '').slice(0, 7);
  if (!/^\d{4}-\d{2}$/.test(v)) return { t: 'Sem validade', p: 'pn', ord: 2, ic: 'var(--soft)' };
  const fimMes = iso(+v.slice(0, 4), +v.slice(5), diasNoMes(+v.slice(0, 4), +v.slice(5)));
  const n = difDias(hojeIso(), fimMes);
  if (n < 0) return { t: 'Vencido', p: 'pr', ord: 0, ic: 'var(--r2)', alerta: 1 };
  if (v === hojeIso().slice(0, 7)) return { t: 'Vence este mês', p: 'po', ord: 1, ic: 'var(--o2)', alerta: 1 };
  if (n <= 45) return { t: 'Vence em breve', p: 'po', ord: 1, ic: 'var(--o2)', alerta: 1 };
  return { t: 'OK', p: 'pg', ord: 3, ic: 'var(--soft)' };
}

function alertas() {
  const hoje = hojeIso(), ym = hoje.slice(0, 7), out = [];
  if (!E.dias[hoje]) out.push({ ic: '📅', bg: 'var(--b2)', t: 'Lançar presença de hoje', s: 'Toque para marcar o dia', p: 'pb', pt: 'Hoje', a: 'abrirDia', d: hoje, ord: 0.5 });
  E.folgas.forEach(f => {
    const s = statusFolga(f);
    if (s.alerta) out.push({ ic: '🏖️', bg: s.alerta === 'exp' ? 'var(--r2)' : 'var(--o2)', t: s.alerta === 'exp' ? 'Prazo da folga expirou' : 'Folga compensatória pendente', s: `Trabalhado ${fmtCurto(f.trabalhada)} · prazo ${fmtCurto(s.prazo)}`, p: s.alerta === 'exp' ? 'pr' : 'po', pt: s.alerta === 'exp' ? 'Expirada' : plural(s.n, 'dia', 'dias'), a: 'editarFolga', id: f.id, ord: s.n });
  });
  T('Atividades').forEach(a => {
    const s = estadoAtividade(a);
    if (a.Status !== 'Entregue' && a.Data && s.n <= 7) out.push({ ic: '🎓', bg: s.n < 0 ? 'var(--r2)' : s.n === 0 ? 'var(--o2)' : 'var(--b2)', t: a.Titulo, s: `${a.Disciplina} · ${fmt(a.Data)}`, p: s.p, pt: s.t, a: 'editarAtividade', id: a.ID, ord: s.n });
  });
  T('Orcamentos').forEach(o => {
    const g = gastoCategoria(ym, o.Categoria), lim = num(o.Limite);
    if (lim && g >= lim * 0.9) out.push({ ic: '💸', bg: g >= lim ? 'var(--r2)' : 'var(--o2)', t: (g >= lim ? 'Orçamento estourado: ' : 'Quase no limite: ') + o.Categoria, s: `${brl(g)} de ${brl(lim)}`, p: g >= lim ? 'pr' : 'po', pt: Math.round(g / lim * 100) + '%', a: 'irFin', v: 'fin-orc', ord: 20 });
  });
  const rem = T('Remedios').map(r => ({ r, s: estadoRemedio(r) }));
  const venc = rem.filter(x => x.s.ord === 0), breve = rem.filter(x => x.s.ord === 1);
  if (venc.length) out.push({ ic: '💊', bg: 'var(--r2)', t: plural(venc.length, 'remédio vencido', 'remédios vencidos'), s: venc.map(x => x.r.Nome).join(', '), p: 'pr', pt: 'Descartar', a: 'ir', v: 'farmacia', ord: 50 });
  if (breve.length) out.push({ ic: '💊', bg: 'var(--o2)', t: plural(breve.length, 'remédio vencendo', 'remédios vencendo'), s: breve.map(x => x.r.Nome).join(', '), p: 'po', pt: 'Ver', a: 'ir', v: 'farmacia', ord: 60 });
  T('Datas').forEach(x => {
    const prox = proximaOcorrencia(x.Data), n = prox ? difDias(hoje, prox) : 999, avisar = x.Avisar === '' || x.Avisar == null ? 7 : num(x.Avisar);
    if (n <= avisar) out.push({ ic: x.Tipo === 'Aniversário' ? '🎂' : '📌', bg: 'var(--p2)', t: x.Nome, s: fmt(prox) + (idadeEm(x, prox) ? ' · faz ' + idadeEm(x, prox) + ' anos' : ''), p: 'pp', pt: emDias(n), a: 'editarData', id: x.ID, ord: n + 0.1 });
  });
  return out.sort((a, b) => a.ord - b.ord);
}

function proximosDias(n = 7) {
  const hoje = hojeIso(), fim = somaDias(hoje, n), itens = [];
  const dentro = d => d && d > hoje && d <= fim;
  for (let i = 1; i <= n; i++) { const k = somaDias(hoje, i), f = feriadoDe(k); if (f) itens.push({ d: k, ic: '🎉', t: f }); }
  T('Atividades').forEach(a => { if (a.Status !== 'Entregue' && dentro(a.Data)) itens.push({ d: a.Data, ic: '🎓', t: a.Titulo, s: a.Disciplina }); });
  E.folgas.forEach(f => { if (dentro(f.folga)) itens.push({ d: f.folga, ic: '🏖️', t: 'Folga', s: maiuscula(f.tipo.toLowerCase()) }); });
  T('Lugares').forEach(l => { if (l.Status === 'Planejado' && dentro(l.Data)) itens.push({ d: l.Data, ic: '📍', t: l.Nome }); });
  for (let i = 1; i <= n; i++) {
    const k = somaDias(hoje, i), dia = +k.slice(8);
    T('Cartoes').forEach(c => { if (num(c.Vencimento) === dia) itens.push({ d: k, ic: '💳', t: 'Vence a fatura ' + c.Nome }); });
  }
  T('Recorrentes').forEach(r => [hoje.slice(0, 7), fim.slice(0, 7)].filter((m, i, a) => a.indexOf(m) === i).forEach(m => {
    const d = dataDoFixo(r, m);
    if (fixoValeEm(r, m) && dentro(d)) itens.push({ d, ic: r.Tipo === 'Entrada' ? '💰' : '🔁', t: r.Descricao, s: (r.Tipo === 'Entrada' ? '+ ' : '') + brlCurto(r.Valor) });
  }));
  T('Datas').forEach(x => { const p = proximaOcorrencia(x.Data); if (dentro(p)) itens.push({ d: p, ic: x.Tipo === 'Aniversário' ? '🎂' : '📌', t: x.Nome, s: idadeEm(x, p) ? idadeEm(x, p) + ' anos' : '' }); });
  return itens.sort((a, b) => a.d.localeCompare(b.d));
}

function sugestaoHoje(k) {
  const sem = paraDate(k).getDay(), fer = feriadoDe(k);
  if (fer) return ['FERI', 'FERI+'];
  if (sem === 0) return ['DOM', 'DOM+'];
  if (sem === 6) return ['SÁB', 'P'];
  return ['P', 'PH'];
}

function proximaOcorrencia(data) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(data))) return '';
  const hoje = hojeIso(), md = data.slice(5), a = +hoje.slice(0, 4);
  const em = ano => md === '02-29' && diasNoMes(ano, 2) < 29 ? ano + '-02-28' : ano + '-' + md;

/** Horas de um texto como "08:00, 20:00", "8h e 20h" ou "de 8 em 8h" (mesma regra do e-mail). */
function horasDe(texto) {
  const t = String(texto || '').toLowerCase();
  const intervalo = t.match(/(\d{1,2})\s*em\s*(\d{1,2})\s*h/);
  if (intervalo) {
    const passo = +intervalo[2], ini = +intervalo[1] % 24, horas = [];
    if (passo > 0) for (let h = ini, i = 0; i < 24 / passo; i++, h = (h + passo) % 24) horas.push(h);
    return horas;
  }
  return (t.replace(/:\d{2}/g, 'h').match(/\d{1,2}/g) || []).map(Number).filter(h => h < 24);
}
function dosesDeHoje() {
  const out = [];
  T('Remedios').filter(r => r.EmUso === true || r.EmUso === 'true').forEach(r => horasDe(r.Horarios).forEach(h => out.push({ h, r })));

}

function interpretarLancamento(texto) {
  let t = ' ' + String(texto || '').trim() + ' ';
  const o = { Tipo: 'Saída', Data: hojeIso() };
  const tira = re => { const m = t.match(re); if (m) t = t.replace(m[0], ' '); return m; };
  const low = () => t.toLowerCase();
  const entrada = tira(/\s(recebi|ganhei|entrada|reembolso)\s/i);
  if (entrada || /^\s*\+/.test(t) || /sal[aá]rio|holerite/i.test(t)) { o.Tipo = 'Entrada'; t = t.replace(/^\s*\+/, ' '); }
  const parc = tira(/\s(\d{1,2})\s*x\s/i); if (parc) o.Parcelas = +parc[1];
  if (tira(/\santeontem\s/i)) o.Data = somaDias(hojeIso(), -2);
  else if (tira(/\sontem\s/i)) o.Data = somaDias(hojeIso(), -1);
  else tira(/\shoje\s/i);
  const dm = tira(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/);
  if (dm) { const a = dm[3] ? (dm[3].length === 2 ? 2000 + +dm[3] : +dm[3]) : +hojeIso().slice(0, 4); o.Data = iso(a, +dm[2], +dm[1]); }
  const pagamentos = [['Pix', /\s(pix)\s/i], ['Débito', /\s(d[eé]bito)\s/i], ['Crédito', /\s(cr[eé]dito|cart[aã]o)\s/i], ['Dinheiro', /\s(dinheiro|esp[eé]cie)\s/i], ['Boleto', /\s(boleto)\s/i], ['Voucher', /\s(voucher|vale|\bvr\b|\bva\b)\s/i]];
  for (const [p, re] of pagamentos) if (tira(re)) { o.Pagamento = p; break; }
  const cartao = T('Cartoes').find(c => c.Nome && low().includes(' ' + c.Nome.toLowerCase() + ' '));
  if (cartao) { o.Pagamento = 'Crédito'; o.Cartao = cartao.Nome; t = t.replace(new RegExp('\\s' + cartao.Nome + '\\s', 'i'), ' '); }
  const valor = tira(/\s(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s/i);
  if (valor) o.Valor = Number(valor[1].includes(',') ? valor[1].replace(/\./g, '').replace(',', '.') : valor[1]);
  const desc = t.replace(/\s+/g, ' ').trim();
  o.Descricao = desc ? desc[0].toUpperCase() + desc.slice(1) : entrada && /reembolso/i.test(entrada[1]) ? 'Reembolso' : '';
  // Categoria: primeiro pelo que você já lançou com esse nome, depois por palavras conhecidas
  const anterior = T('Lancamentos').filter(l => o.Descricao && String(l.Descricao).toLowerCase().split(' (')[0] === o.Descricao.toLowerCase()).slice(-1)[0];
  if (anterior) { o.Categoria = anterior.Categoria; if (!o.Pagamento) { o.Pagamento = anterior.Pagamento; if (anterior.Pagamento === 'Crédito') o.Cartao = anterior.Cartao; } }
  if (!o.Categoria) o.Categoria = (Object.entries(PALAVRAS_CAT).find(([, re]) => re.test(o.Descricao.toLowerCase())) || [o.Tipo === 'Entrada' ? 'Salário' : 'Outros'])[0];
  if (!o.Pagamento) o.Pagamento = 'Pix';
  return o;
}

/** Barras por mês. series: [{nome, cor, valores (null = sem dado)}]. Um eixo só; hover mostra o valor. */
function graficoBarras(rotulos, series, { fmt = v => v, max } = {}) {
  const W = 340, H = 150, R = 6, T0 = 14, B = 18, n = rotulos.length, ns = series.length;
  const todos = series.flatMap(s => s.valores.filter(v => v != null));
  const topo = max || Math.max(1, ...todos) * 1.1;
  const L = Math.max(30, 8 + 5.6 * Math.max(...[0, 0.5, 1].map(f => String(fmt(Math.round(topo * f))).length))); // margem cabe o maior rótulo
  const y = v => T0 + (H - T0 - B) * (1 - v / topo);
  const gw = (W - L - R) / n, gap = ns > 1 ? 2 : 0, bw = Math.max(3, Math.min(18, (gw - 6 - gap * (ns - 1)) / ns));
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.nome).join(' e '))} por mês">`;
  [0, 0.5, 1].forEach(f => { const v = topo * f, yy = y(v); svg += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 4}" y="${yy + 3}" text-anchor="end">${esc(fmt(Math.round(v)))}</text>`; });
  rotulos.forEach((r, i) => {
    const x0 = L + gw * i + (gw - (bw * ns + gap * (ns - 1))) / 2;
    series.forEach((s, j) => {
      const v = s.valores[i];
      if (v == null) return;
      const x = x0 + j * (bw + gap), yy = y(Math.max(0, v)), base = y(0), h = Math.max(0, base - yy), rr = Math.min(4, bw / 2, h);
      const d = h < 0.5 ? '' : `M${x},${base} V${yy + rr} Q${x},${yy} ${x + rr},${yy} H${x + bw - rr} Q${x + bw},${yy} ${x + bw},${yy + rr} V${base} Z`;
      svg += `<g><title>${esc(r)} · ${esc(s.nome)}: ${esc(fmt(v))}</title><rect x="${x - 2}" y="${T0}" width="${bw + 4}" height="${H - T0 - B}" fill="transparent"/>${d ? `<path d="${d}" style="fill:${s.cor}"/>` : ''}</g>`;
    });
    svg += `<text x="${L + gw * i + gw / 2}" y="${H - 5}" text-anchor="middle">${esc(r)}</text>`;
  });
  if (ns === 1) { // rótulo só no último mês com dado
    const k = series[0].valores.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if (k != null && k >= 0) svg += `<text class="vl" x="${L + gw * k + gw / 2}" y="${y(series[0].valores[k]) - 4}" text-anchor="middle">${esc(fmt(series[0].valores[k]))}</text>`;
  }
  return svg + '</svg>' + (ns > 1 ? `<div class="legenda">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>` : '');
}

/** Cruza o humor com hábitos e treinos: "nos dias com X, seu humor foi melhor". */
function insightsDiario() {
  const dias = T('Diario').filter(d => num(d.Humor));
  if (dias.length < 6) return `<div class="card"><div class="sec">Descobertas</div><div class="vazio">Com pelo menos 6 dias de humor registrados, aparece aqui o que mais combina com seus dias bons.</div></div>`;
  const media = xs => xs.reduce((s, d) => s + num(d.Humor), 0) / xs.length;
  const fatores = habitosAtivos().map(h => ({ nome: `${h.Icone || ''} ${h.Nome}`, teve: d => feito(d.Data, h.ID) }));
  fatores.push({ nome: '🏋️ Treino', teve: d => T('Treinos').some(t => t.Data === d.Data) });
  fatores.push({ nome: '🏖️ Folga ou fim de semana', teve: d => ['Folga', 'Não trabalha', 'Férias'].includes((E.porCodigo[(E.dias[d.Data] || {}).codigo] || {}).categoria) });
  const res = fatores.map(f => { const com = dias.filter(f.teve), sem = dias.filter(d => !f.teve(d));
    return com.length >= 3 && sem.length >= 3 ? { nome: f.nome, com: media(com), sem: media(sem), dif: media(com) - media(sem) } : null; })
    .filter(Boolean).sort((a, b) => Math.abs(b.dif) - Math.abs(a.dif)).slice(0, 4);
  const v = x => x.toFixed(1).replace('.', ',');
  return `<div class="card"><div class="sec">Descobertas</div>${res.map(r => `<div class="row"><div class="ic">${r.dif >= 0 ? '📈' : '📉'}</div><div class="t"><b>${esc(r.nome)}</b><small>Humor ${v(r.com)} nos dias com · ${v(r.sem)} nos dias sem</small></div><span class="pill ${r.dif >= 0 ? 'pg' : 'pr'}">${r.dif >= 0 ? '+' : ''}${v(r.dif)}</span></div>`).join('') || '<div class="vazio">Ainda sem diferenças claras.</div>'}</div>`;
}

const EXERCICIOS = ['Flexão', 'Barra fixa', 'Agachamento', 'Abdominal', 'Prancha (segundos)', 'Paralelas', 'Afundo', 'Polichinelo', 'Burpee'];
const habitoTreino = () => habitosAtivos().find(h => /calist|treino|academia|muscula|exerc/i.test(h.Nome));
function telaTreinos() {
  const ts = T('Treinos'), hoje = hojeIso(), ym = hoje.slice(0, 7);
  const dias = [...new Set(ts.map(t => t.Data))].sort().reverse();
  const doMes = new Set(ts.filter(t => String(t.Data).startsWith(ym)).map(t => t.Data)).size;
  let semanas = 0, ini = inicioSemana(hoje);
  if (!ts.some(t => t.Data >= ini)) ini = somaDias(ini, -7);
  while (ts.some(t => t.Data >= ini && t.Data <= somaDias(ini, 6))) { semanas++; ini = somaDias(ini, -7); }
  const exs = [...new Set(ts.map(t => t.Exercicio))];
  const porEx = exs.map(e => {
    const xs = ts.filter(t => t.Exercicio === e), sessoes = [...new Set(xs.map(t => t.Data))].sort();
    const vol = d => xs.filter(t => t.Data === d).reduce((s, t) => s + num(t.Series || 1) * num(t.Reps), 0);
    const ult = sessoes[sessoes.length - 1], recorde = Math.max(...xs.map(t => num(t.Reps)));
    return { e, ult, vol, sessoes: sessoes.slice(-8), recorde, ultimo: xs.filter(t => t.Data === ult) };
  }).sort((a, b) => String(b.ult).localeCompare(String(a.ult)));
  return `${cab('Calistenia e exercícios', 'Treinos', botao('+ Registrar', 'novoTreino'))}

        <small>Último: ${x.ultimo.map(t => `${num(t.Series) || 1}×${num(t.Reps)}${num(t.Carga) ? ' ' + String(t.Carga).replace('.', ',') + 'kg' : ''}`).join(', ')} · ${fmtCurto(x.ult)} · recorde ${x.recorde}</small>
        ${x.sessoes.length > 1 ? graficoMini(x.sessoes.map(x.vol)) : ''}</div></div>`).join('') || '<div class="vazio">Registre seu primeiro treino. Dica: toque num exercício para repetir.</div>'}</div>

/** Barrinhas pequenas (volume por sessão). */
function graficoMini(vals) {
  const max = Math.max(1, ...vals), w = 8, gap = 3;
  return `<svg width="${vals.length * (w + gap)}" height="22" style="margin-top:6px;display:block" aria-hidden="true">${vals.map((v, i) => { const h = Math.max(2, v / max * 20); return `<rect x="${i * (w + gap)}" y="${22 - h}" width="${w}" height="${h}" rx="2" style="fill:var(--c1)"/>`; }).join('')}</svg>`;
}
function abrirTreino(id, ex) {

    },
    excluir: t && (() => { fecharVeu(); excluirItem('Treinos', t.ID); }),
  });
}

/** Compara com as já vistas (guardadas em Ajustes) e comemora as novas. Na primeira vez, só registra. */
function verificarConquistas(silencioso) {
  if (!E.codigos.length) return;
  const salvo = String(cfg('Conquistas', ''));
  const vistas = salvo.split(',').filter(Boolean);
  const agora = conquistas().filter(c => c.atual >= c.alvo).map(c => c.id);
  const novas = agora.filter(id => !vistas.includes(id));
  if (!novas.length && salvo) return;
  salvarConfig({ Conquistas: ['ok'].concat(vistas.filter(v => v !== 'ok'), novas).join(',') }, '');
  if (!silencioso && salvo && novas.length) {
    const c = conquistas().find(x => x.id === novas[0]);
    celebrar();
    setTimeout(() => toast(`🏆 Nova conquista: ${c.ic} ${c.nome}!`), 300);
  }
}
function celebrar() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cores = ['#f59e0b', '#22c55e', '#3b82f6', '#ec4899', '#a855f7', '#ef4444'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confete';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cores[i % cores.length];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = 1.4 + Math.random() * 1.2 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}
function telaConquistas() {
  const cs = conquistas(), feitas = cs.filter(c => c.atual >= c.alvo);
  const ord = cs.slice().sort((a, b) => (b.atual >= b.alvo) - (a.atual >= a.alvo) || b.atual / b.alvo - a.atual / a.alvo);
  return `${cab(`${feitas.length} de ${cs.length} desbloqueadas`, 'Conquistas')}
  <div class="card mb">${bar(feitas.length / cs.length * 100, '#f59e0b')}</div>
  <div class="badges">${ord.map(c => { const ok = c.atual >= c.alvo;
    return `<div class="badge ${ok ? '' : 'off'}"><div class="ic">${c.ic}</div><div style="flex:1;min-width:0"><b>${esc(c.nome)}</b><small>${esc(c.desc)}</small>
      ${ok ? '<small style="color:var(--g);font-weight:800">✓ Desbloqueada</small>' : `${bar(c.atual / c.alvo * 100, '#f59e0b')}<small>${Math.min(c.atual, c.alvo).toLocaleString('pt-BR')} / ${c.alvo.toLocaleString('pt-BR')}</small>`}</div></div>`; }).join('')}</div>`;
}

const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function abrirBusca() {
  abrirVeu(`<h2>Buscar</h2><input class="busca-in" id="busca" placeholder="Anotações, gastos, livros, folgas…" autocomplete="off" style="margin-top:10px">
    <div id="resBusca"><p class="nota" style="margin-top:12px">Procura em tudo: anotações do calendário, diário, gastos, metas, folgas, faculdade, cursos, livros, lugares, remédios, datas e treinos.</p></div>
    <div class="acoes"><button class="btn sec2" data-a="fechar">Fechar</button></div>`);
  setTimeout(() => $('busca').focus(), 50);
}
function buscar(q) {
  const t = semAcento(q).trim();
  if (t.length < 2) return '';
  const tem = (...xs) => xs.some(x => semAcento(x).includes(t));
  const grupos = [];
  const g = (nome, itens) => { if (itens.length) grupos.push(`<div class="grupo-res">${nome} · ${itens.length}</div>` + itens.slice(0, 8).join('')); };
  const item = (ic, tit, sub, attrs) => `<div class="row" ${attrs}><div class="ic">${ic}</div><div class="t"><b>${esc(tit)}</b><small>${esc(sub)}</small></div></div>`;
  g('Calendário', Object.keys(E.dias).filter(k => tem(E.dias[k].obs, E.dias[k].codigo === q.toUpperCase() ? q : '')).sort().reverse().map(k => item('📅', E.dias[k].obs || E.dias[k].codigo, fmt(k) + ' · ' + E.dias[k].codigo, `data-a="abrirDia" data-d="${k}"`)));
  g('Diário', T('Diario').filter(d => tem(d.Texto)).sort((a, b) => String(b.Data).localeCompare(String(a.Data))).map(d => item(num(d.Humor) ? HUMOR[num(d.Humor)].e : '📝', d.Texto, fmt(d.Data), `data-a="escreverDiario" data-d="${d.Data}"`)));
  g('Lançamentos', T('Lancamentos').filter(l => tem(l.Descricao, l.Categoria)).sort((a, b) => String(b.Data).localeCompare(String(a.Data))).map(l => item(ICONE_CAT[l.Categoria] || '💸', l.Descricao || l.Categoria, `${fmt(l.Data)} · ${brl(l.Valor)}`, `data-a="editarLanc" data-id="${esc(l.ID)}"`)));
  g('Metas', T('Desejos').filter(d => tem(d.Nome)).map(d => item(d.Icone || '🎯', d.Nome, brl(d.Preco), `data-a="verDesejo" data-id="${esc(d.ID)}"`)));
  g('Folgas', E.folgas.filter(f => tem(f.anotacoes, f.chamado, f.tipo)).map(f => item('🏖️', f.anotacoes || f.tipo, `${f.folga ? fmt(f.folga) : 'sem data'} · ${f.chamado || f.tipo}`, `data-a="editarFolga" data-id="${esc(f.id)}"`)));
  g('Faculdade', T('Atividades').filter(a => tem(a.Titulo, a.Disciplina)).map(a => item('🎓', a.Titulo, `${a.Disciplina} · ${fmt(a.Data)}`, `data-a="editarAtividade" data-id="${esc(a.ID)}"`)));
  g('Cursos', T('Cursos').filter(c => tem(c.Nome, c.Plataforma)).map(c => item('💻', c.Nome, `${c.Plataforma} · ${c.Status}`, `data-a="editarCurso" data-id="${esc(c.ID)}"`)));
  g('Livros', T('Livros').filter(l => tem(l.Titulo, l.Autor, l.Sintese)).map(l => item('📚', l.Titulo, `${l.Autor || ''} · ${l.Status}`, `data-a="editarLivro" data-id="${esc(l.ID)}"`)));
  g('Lugares', T('Lugares').filter(l => tem(l.Nome, l.Obs, l.Categoria)).map(l => item(l.Icone || '📍', l.Nome, `${l.Categoria} · ${l.Status}`, `data-a="editarLugar" data-id="${esc(l.ID)}"`)));
  g('Remédios', T('Remedios').filter(r => tem(r.Nome, r.Indicacao, r.Obs)).map(r => item('💊', r.Nome, r.Indicacao, `data-a="editarRemedio" data-id="${esc(r.ID)}"`)));
  g('Datas', T('Datas').filter(x => tem(x.Nome, x.Obs)).map(x => item('🎂', x.Nome, fmt(proximaOcorrencia(x.Data)), `data-a="editarData" data-id="${esc(x.ID)}"`)));
  g('Treinos', [...new Set(T('Treinos').filter(x => tem(x.Exercicio, x.Obs)).map(x => x.Exercicio))].map(e => item('🏋️', e, 'Repetir este exercício', `data-a="novoTreino" data-ex="${esc(e)}"`)));
  g('Tarefas', T('Tarefas').filter(x => tem(x.Titulo)).map(x => item(x.Feito ? '✅' : '⬜', x.Titulo, x.Escopo === 'semana' ? 'Semana' : x.Escopo === 'mes' ? 'Mês' : 'Ano', `data-a="editarTarefa" data-id="${esc(x.ID)}"`)));
  return grupos.join('') || '<div class="vazio" style="margin-top:12px">Nada encontrado.</div>';
}

/** Markdown simples do manual: parágrafos, **negrito**, *itálico*, `código`, listas e tabelas. */
function mdManual(texto, termo) {
  const inline = t => {
    let h = esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
    if (termo) h = h.replace(new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi'), '<mark>$1</mark>');
    return h;
  };
  return texto.split(/\n{2,}/).map(bloco => {
    const ls = bloco.split('\n');
    if (ls[0].startsWith('|')) {
      const cel = l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      return `<div class="tab"><table><tr>${cel(ls[0]).map(c => `<th>${inline(c)}</th>`).join('')}</tr>${ls.slice(2).map(l => `<tr>${cel(l).map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    }
    if (/^- /.test(ls[0])) return `<ul>${ls.map(l => `<li>${inline(l.replace(/^- /, ''))}</li>`).join('')}</ul>`;
    if (/^\d+\. /.test(ls[0])) return `<ol>${ls.map(l => `<li>${inline(l.replace(/^\d+\. /, ''))}</li>`).join('')}</ol>`;
    return `<p>${inline(ls.join(' '))}</p>`;
  }).join('');
}
function telaManual() {
  const termo = (E.buscaManual || '').trim(), t = semAcento(termo);
  const secoes = MANUAL.map(([titulo, texto], i) => ({ titulo, texto, i })).filter(x => t.length < 2 || semAcento(x.titulo + ' ' + x.texto).includes(t));
  return `${cab('Como usar cada parte do app', 'Manual')}
  <div class="manual">
    <div class="rapido"><input id="manualBusca" placeholder="Procurar no manual (ex.: folga, salário, remédio)" value="${esc(termo)}" autocomplete="off"></div>
    ${secoes.map((x, n) => `<details id="man-${x.i}" ${t.length >= 2 || (n === 0 && E.manualAberto == null) || E.manualAberto === x.i ? 'open' : ''}><summary>${esc(x.titulo)}</summary><div class="corpo">${mdManual(x.texto, t.length >= 2 ? termo : '')}</div></details>`).join('')
      || '<div class="vazio">Nada encontrado no manual.</div>'}
  </div>`;
}
