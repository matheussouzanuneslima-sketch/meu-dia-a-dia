const MANUAL = [["Como o app se organiza","No celular, a barra de baixo leva às 3 telas mais usadas e ao botão **+**. No computador, tudo fica no menu da lateral.\n\n| Onde | O que faz |\n| --- | --- |\n| **Início** | Resumo do dia: presença, atenções, humor, hábitos, metas e gráficos |\n| **Calendário** | Presença, folgas, hábitos e to-dos, numa página só |\n| **+** (botão do meio) | Adicionar qualquer coisa rápido |\n| **Finanças** | Tudo do dinheiro, numa página só com seções |\n| **Mais** | Todas as outras áreas, cada uma com um resumo embaixo do nome |\n\n**O botão +** abre uma caixa para escrever um gasto do seu jeito (veja Financeiro) e atalhos para: presença de hoje, gasto ou entrada, guardar numa meta, folga, atividade da faculdade, tarefa da semana, diário de hoje, treino, data importante, remédio, livro, lugar e nova meta.\n\n**Regras que valem em todo o app**\n\n- Tudo que aparece numa lista é tocável: abre o formulário para editar ou excluir.\n- Valores em dinheiro aceitam vírgula: `186,40` ou `1.234,56`.\n- As telas compridas (Calendário e Financeiro) têm uma fileira de botões no topo que pula direto para cada seção.\n- A **engrenagem** no topo de uma tela abre os ajustes daquela tela (Calendário, Faculdade, Leitura).\n- A **lupa** no topo do Início abre a busca geral. No computador, a tecla `/` faz o mesmo.\n- Ao salvar, o app mostra a mudança na hora e grava na planilha em seguida. Se der erro, ele desfaz e avisa."],["Início","O Início junta, em cartões, o que importa hoje. Você escolhe quais cartões aparecem e em que ordem em **Ajustes → Aparência → Cartões do Início**.\n\n| Cartão | O que mostra e o que dá para fazer |\n| --- | --- |\n| **Hoje** | Código do dia e quantos hábitos você fez. Se o dia ainda está vazio, mostra botões para lançar com 1 toque (P ou PH em dia de semana, SÁB, DOM, FERI) e \"Outro…\". Atalhos para presença, gasto, treino e guardar dinheiro |\n| **Números do mês** | Presença do mês, saldo, total guardado e dias até as férias. Cada número leva à tela dele |\n| **Atenção hoje** | Lista automática do que pede ação (detalhes abaixo) |\n| **Como foi seu dia?** | 5 carinhas de humor: um toque grava o humor de hoje no Diário. \"Escrever sobre o dia\" abre o texto |\n| **Próximos 7 dias** | Feriados, entregas, folgas agendadas, passeios, fixos (gastos e entradas como o salário), faturas e aniversários |\n| **Hábitos de hoje** | Marque cada hábito com um toque |\n| **Remédios de hoje** | Doses do dia dos remédios em uso, com a próxima destacada. Só aparece se houver |\n| **Metas** | As 3 metas mais perto de completar |\n| **Orçamento** | As 3 categorias mais perto do limite. Só aparece se houver limite |\n| **Lendo agora** | O livro atual e a página. Só aparece se houver |\n| **Últimos 12 meses** | Um gráfico por vez: Presença, Dinheiro, Hábitos, Treinos ou Humor. Cada barra é um mês; toque nos botões para trocar |\n| **Conquistas** | A próxima conquista e quanto falta |\n| **Frase do dia** | Muda sozinha todo dia. Toque para trocar o modo ou escrever as suas |\n\n**O que entra em \"Atenção hoje\"**\n\n- Presença de hoje ainda não lançada.\n- Folga compensatória perto do prazo (15 dias ou menos) ou com prazo vencido.\n- Entregas da faculdade atrasadas, de hoje ou dos próximos 7 dias.\n- Categoria do orçamento com 90% do limite ou mais.\n- Remédios vencidos ou vencendo.\n- Aniversários e datas importantes dentro do aviso que você escolheu (7 dias, se não escolher).\n\nToque num item para ir direto a ele."],["Calendário","O Calendário é o seu quadro de presença: um código por dia, com folgas, hábitos e to-dos na mesma página. Os botões do topo pulam para Mês, Resumo, Folgas, Hábitos, To-dos e Ano.\n\n**Lançar um dia**\n\n1. Toque no dia.\n2. Escolha o código (ou \"Sem código\" para limpar).\n3. Se quiser, marque **Cobrindo férias** e escreva uma observação.\n4. **Salvar**, ou **Salvar e próximo** para ir lançando a semana em sequência.\n\nAs setas no topo do painel trocam de dia sem fechar. O dia de hoje também pode ser lançado com 1 toque no cartão Hoje do Início.\n\n**Os códigos** (a cor do dia vem do código; a lista fica na aba Calendário da planilha)\n\n| Grupo | Códigos |\n| --- | --- |\n| Presença | P Presente · PA Parcialmente ausente · PP Parcialmente presente · SNG Sinergia Centauro |\n| Presença com extra | PH · HE · SÁB+ · DOM+ · FERI+ |\n| Folga | FC Compensatória · FBH Banco de horas · DAYOFF Aniversário · TRF Troca de folga |\n| Não trabalha | SÁB · DOM · SEG · FERI Feriado |\n| Outros | F Falta · AT Atestado · AF Afastado · S Suspenso · FE Férias |\n\n**Navegar**\n\n- Setas: mês anterior e próximo.\n- **Ano:** a caixinha ao lado do nome do mês troca o ano e mantém o mês.\n- **Hoje:** volta para o dia de hoje e faz ele piscar.\n- **Lupa:** vai para qualquer data e já abre o dia.\n- Feriados ainda não lançados aparecem com um confete no dia.\n\n**Anotações do mês:** embaixo do calendário, uma lista com cada dia que tem observação ou feriado, por exemplo \"12 – Nossa Senhora Aparecida / Dia das crianças\". Toque para abrir o dia.\n\n**Resumo:** presença do mês (dias presentes de dias previstos; fim de semana, folga e férias não contam como previstos), folgas, dias com extra, faltas e dias até as próximas férias. Embaixo, o mesmo para o ano escolhido. Meses sem nada lançado ficam fora da conta do ano.\n\n**Preparar os meses sozinho:** ao abrir o app, o mês atual e o próximo são preenchidos uma vez, só nos dias vazios: domingos como DOM, feriados como FERI (com o nome na observação) e, se você ligar, sábados como SÁB. O que você já lançou nunca muda, e um dia que você apagar depois não volta. Tudo isso se ajusta na engrenagem do Calendário, que também tem o botão \"Preencher este mês agora\".\n\n**Folgas**\n\n- **+ Nova** cadastra a folga: tipo (Folga compensatória, Banco de horas ou Day off), data trabalhada, data da folga, nº do chamado e anotações.\n- Com a data da folga preenchida, dá para marcar o dia no calendário na mesma hora.\n- **Folga compensatória tem prazo:** 60 dias a partir do dia trabalhado (mude na engrenagem). Faltando 15 dias ou menos, ela aparece em destaque e no Início.\n- **E-mail para o RH:** dentro da folga, monta o texto pronto para copiar. O modelo se edita na engrenagem, com `{folga}`, `{trabalhada}` e `{tipoDia}`.\n\n**Ano de relance:** no fim da página, o ano inteiro em quadradinhos coloridos, um por dia.\n\n**Feriados:** os nacionais já vêm calculados, inclusive Páscoa e Corpus Christi. Os da sua cidade entram na engrenagem, um por linha, como `22/05 Santa Rita`."],["Hábitos e to-dos","Os hábitos ficam no fim do Calendário, na seção \"Hábitos e to-dos\", mais discretos. Para marcar só o de hoje, o jeito mais rápido é o cartão Hábitos de hoje no Início.\n\n**Hábitos**\n\n- **Semana:** uma grade com cada hábito × os 7 dias. Toque na bolinha para marcar ou desmarcar. As setas trocam de semana; dias futuros ficam bloqueados.\n- **Mês:** uma barra por hábito, com quantos dias você fez no mês.\n- **Sequência:** ao lado do nome aparece a sequência de dias seguidos.\n- **+ Hábito** (ou toque no nome de um hábito): nome, ícone, meta por semana, ordem e ativo.\n- **Meta por semana:** para hábitos que não são diários (ex.: academia 3x). Aí a sequência conta semanas seguidas cumprindo a meta, e a grade mostra \"2/3\".\n- **Ativo desmarcado** esconde o hábito sem apagar o histórico.\n\nEmbaixo da grade, a porcentagem da semana cumprida e a da semana anterior.\n\n**To-dos**\n\nUm cartão com 3 listas: **Da semana**, **Do mês** e **Metas do ano**. Toque no quadradinho para marcar como feito; toque no texto para editar ou excluir. Cada lista é do período atual: na semana que vem, a lista da semana começa vazia."],["Financeiro","O Financeiro é uma página só, com seções: Resumo, Metas, Lançamentos, Fixos, Orçamento, Categorias, Guardado e Cartões. As setas do cartão de saldo trocam o mês.\n\n**Resumo do mês:** saldo (entradas menos saídas), total de entradas, de saídas e quanto você guardou no mês. Embaixo, quanto você gastou a mais ou a menos que no mês anterior.\n\n**Lançar um gasto ou entrada**\n\n- **+ Lançar:** tipo (Saída ou Entrada), descrição, valor, data, categoria, forma de pagamento, cartão (se crédito) e parcelas.\n- **Parcelas:** numa compra parcelada, o app cria uma parcela por mês, cada uma no mês certo.\n- **Do seu jeito, por texto:** no + ou na seção Lançamentos, escreva e aperte Lançar. O app preenche o formulário e você só confere.\n\n| Você escreve | O app entende |\n| --- | --- |\n| `mercado 52,30 pix` | Saída de R$ 52,30, Alimentação, Pix, hoje |\n| `uber 18 ontem` | Saída de R$ 18, Transporte, data de ontem |\n| `fone 300 3x crédito` | R$ 300 no crédito em 3 parcelas |\n| `farmácia 25,90 12/10` | Saída de R$ 25,90, Saúde, em 12/10 |\n| `recebi salário 3.500,00` | Entrada de R$ 3.500, Salário |\n| `+ 100 reembolso` | Entrada de R$ 100, \"Reembolso\" |\n\nA categoria vem primeiro do que você já lançou com o mesmo nome; se for a primeira vez, de palavras conhecidas (mercado, uber, netflix, farmácia…). Formas de pagamento reconhecidas: pix, débito, crédito ou cartão, dinheiro, boleto e vale/VR/VA. O nome de um cartão seu também funciona.\n\n**Metas e desejos**\n\n- **+ Meta:** o que é, ícone, tipo (Desejo ou Necessidade), preço, prioridade, link da loja e quanto já tinha guardado antes do app.\n- Toque numa meta para **+ Guardar** ou **− Retirar**, com data, valor e onde o dinheiro está guardado. O histórico fica dentro da meta.\n- A meta mostra a previsão de quando você chega lá, pelo ritmo dos últimos 3 meses.\n- Filtros: Todos, Necessidade, Desejo e Comprados. Marque Status \"Comprado\" quando comprar.\n\n**Fixos do mês** (gastos e entradas que se repetem)\n\n- Entram sozinhos nos lançamentos, no dia certo, quando você abre o app ou às 7h (se os e-mails automáticos estiverem ligados).\n- **Quando cai:** *Dia do mês* (ex.: aluguel dia 5); *Dia útil* (o número vira o Nº dia útil: 5 = 5º dia útil, como o salário); *Dia do mês ou útil anterior* (ex.: adiantamento dia 20; em fim de semana ou feriado, vale o dia útil antes).\n- **Sábado conta como dia útil:** marque se a sua empresa conta o sábado (a CLT conta; muitas empresas não).\n- **Status:** *Fixo* entra todo mês, sem data para acabar; *Prazo* para no último mês escolhido (ex.: curso até 06/2027) e mostra quantos meses faltam. Depois disso aparece como Encerrado.\n- **Modelos prontos** no fim do formulário novo: Salário (5º dia útil), Adiantamento (dia 20) e Vale refeição (dia 1). Você só preenche o valor.\n- Cada fixo mostra a data deste mês e se já foi Lançado (ou Recebido). No rodapé: total de gastos fixos e de entradas fixas por mês.\n- Desmarcar **Ativo** pausa o fixo. Excluir um fixo não apaga os lançamentos antigos.\n\n**Orçamento:** um limite por mês para cada categoria. A barra fica laranja perto do limite e vermelha quando estoura; a partir de 90% o aviso vai para o Início.\n\n**Categorias:** gráfico de rosca dos gastos do mês, a comparação de cada categoria com o mês anterior (▲ subiu, ▼ caiu, \"novo\" se não existia) e o total por forma de pagamento.\n\n**Onde está guardado:** os seus locais (ex.: Cofre, Caixinha, Tesouro), com o valor que já havia e uma meta opcional. O que você guarda nas metas usando o mesmo nome de local soma aqui.\n\n**Cartões:** nome e dia do vencimento. Mostra as compras do mês em cada cartão, e o vencimento aparece nos Próximos 7 dias do Início."],["Estudos","Três telas, no menu Mais (ou na lateral): Faculdade, Cursos e Leitura.\n\n**Faculdade**\n\n- No topo: entregas concluídas, quanto falta para a próxima, média das notas e número de disciplinas.\n- **+ Atividade:** nome, disciplina, data de entrega, status (Pendente ou Entregue) e nota.\n- Cada atividade mostra o estado: Atrasada, Hoje, \"em X dias\" ou Entregue. As atrasadas e as dos próximos 7 dias vão para o Início e para o e-mail da manhã.\n- Com o Google Agenda ligado, as entregas viram eventos na sua agenda.\n- A engrenagem muda o nome do curso que aparece no topo.\n\n**Cursos**\n\n- Agrupados por plataforma (ex.: Hashtag, ADA), com o botão \"Abrir portal\" quando o curso tem link.\n- Filtros: Todos, Cursando, A fazer e Concluído.\n- **+ Curso:** nome, plataforma, carga horária, status (A fazer, Cursando, Pausado, Concluído), progresso em % e link do portal.\n\n**Leitura**\n\n- No topo: a meta de livros do ano e quantos você já leu. A meta se muda na engrenagem.\n- **Lendo agora:** página atual, barra de progresso e quantos dias faltam para terminar no seu ritmo. Toque para atualizar a página.\n- Estantes: Quero ler, Lendo e Lido.\n- **+ Livro:** nome, autor, ano, gênero, páginas, status, página atual, início, fim, avaliação (1 a 5) e síntese.\n- **Buscar dados pelo nome:** dentro do livro, preenche autor, páginas, sinopse e capa pelo Google Livros."],["Vida","Cinco telas no menu Mais: Diário, Treinos, Lugares, Farmácia e Datas.\n\n**Diário**\n\n- Um registro por dia: humor de 1 a 5 (😞 a 😄) e um texto, se quiser.\n- O jeito mais rápido é tocar numa carinha no cartão \"Como foi seu dia?\" do Início.\n- A tela mostra o mês como um calendário colorido pelo humor; toque num dia para ler ou escrever.\n- Números do mês: humor médio, dias escritos e dias bons.\n- **Descobertas:** com 6 dias ou mais de humor, o app compara os dias com e sem cada hábito, treino e folga, e mostra o que mais combina com seus dias bons (ex.: \"Humor 4,2 nos dias com Caminhar · 3,1 nos dias sem\").\n\n**Treinos**\n\n- **Registrar:** exercício, séries, repetições (ou segundos, na prancha), carga extra, data e observação.\n- Ao repetir um exercício, o formulário já vem com as séries e repetições da última vez.\n- **Marcar o hábito junto:** se você tem um hábito como Calistenia, o formulário oferece marcá-lo como feito no mesmo toque.\n- A tela mostra dias de treino no mês, semanas seguidas treinando, a evolução de cada exercício (último treino, recorde e um mini gráfico) e o histórico.\n\n**Lugares**\n\n- Lista de lugares para conhecer: nome, ícone, categoria, status (Quero ir, Planejado, Visitado), data, avaliação e observações.\n- O próximo passeio planejado aparece em destaque, e os planejados vão para os Próximos 7 dias e para a agenda.\n\n**Farmácia**\n\n- Inventário dos remédios de casa: nome, para que serve, quantidade, validade (mês/ano) e observações.\n- Estados: Vencido, Vence este mês, Vence em breve (45 dias), OK. Vencidos e vencendo vão para o Início.\n- **Em uso agora:** marque \"Estou tomando agora\" e preencha a dose e os horários, como `08:00, 20:00`, `8h e 20h` ou `de 8 em 8h`. As doses aparecem no Início e, com o e-mail \"Hora do remédio\" ligado, chega um aviso na hora (pode atrasar até 1 hora).\n\n**Datas importantes**\n\n- **+ Data:** nome, tipo (Aniversário, Comemorativa, Outro), data, quantos dias antes avisar e observação.\n- A tela lista as próximas por mês, com o dia da semana. Em aniversário com o ano de nascimento, mostra a idade (\"faz 56 anos\").\n- O aviso aparece no Início e no e-mail da manhã, a partir do número de dias que você escolheu (7, se ficar vazio)."],["Conquistas e busca","**Conquistas:** 20 medalhas que se desbloqueiam sozinhas conforme você usa o app. Quando uma desbloqueia, cai confete e aparece um aviso. A tela Conquistas mostra todas, com a barra do quanto falta.\n\n| Área | Conquistas |\n| --- | --- |\n| Presença | Mês perfeito (100% num mês) · Calendário em dia (30 dias seguidos lançados) |\n| Hábitos | Pegando o ritmo (7 dias seguidos) · Hábito de ferro (30) · Imparável (100) · Semana perfeita (todos os hábitos numa semana) |\n| Dinheiro | Primeiros mil (R$ 1.000 guardados) · Reserva de respeito (R$ 5.000) · Objetivo alcançado (completar uma meta) · Dentro do orçamento (um mês sem estourar limite) |\n| Diário | Querido diário (7 dias) · Escritor (30 dias) |\n| Treinos | Em forma (10 dias) · Atleta (50 dias) |\n| Estudos | Primeiro livro · Meta de leitura (a meta do ano) · Aluno exemplar (5 entregas, nenhuma atrasada) · Certificado (concluir um curso) |\n| Vida | Explorador (visitar 5 lugares) · Farmácia em ordem (5 ou mais remédios, nenhum vencido) |\n\n**Busca geral:** a lupa no topo do Início (ou Buscar no menu). Digite 2 letras ou mais: procura sem ligar para acentos em observações do calendário, diário, lançamentos, metas, folgas, faculdade, cursos, livros, lugares, remédios, datas, treinos e tarefas. Toque num resultado para abrir; num treino, ele já abre para repetir o exercício."],["Ajustes e e-mails automáticos","Ajustes fica no menu Mais (ou tocando na sua inicial no topo do Início) e tem 4 blocos. As opções de cada tela ficam na engrenagem dela, e Ajustes também lista esses atalhos.\n\n| Bloco | O que dá para mudar |\n| --- | --- |\n| **Você** | Nome (aparece no \"Olá\") e e-mail para os avisos (vazio = o da sua conta Google) |\n| **Aparência** | Tema (Automático segue o celular, Claro ou Escuro), cor do app (Azul petróleo, Verde, Roxo, Laranja, Rosa, Grafite), tela em que o app abre, cartões do Início e frase do dia |\n| **E-mails automáticos** | Ligar ou desligar cada e-mail, mandar um teste |\n| **Dados** | Atualizar a agenda agora e fazer uma cópia de segurança agora |\n| **Este aparelho** | Sincronizar agora e desconectar o aparelho da planilha |\n\n**Cartões do Início:** marque os que quer ver e use as setas para mudar a ordem. \"Voltar ao padrão\" desfaz tudo.\n\n**Frase do dia:** no modo Automático, muda todo dia (60 frases do app + as suas). No modo Fixa, mostra sempre a sua frase favorita.\n\n**Os e-mails automáticos**\n\n| E-mail | Quando chega |\n| --- | --- |\n| Resumo da manhã | 7h, só quando há algo: entrega, folga, fatura, orçamento, remédio, aniversário |\n| Lembrete da presença | 18h, se o dia de hoje ainda estiver vazio |\n| Hora do remédio | Na hora de cada dose dos remédios em uso (até 1 hora de atraso) |\n| Resumo do mês | Dia 1, com presença, gastos, hábitos e leituras do mês anterior |\n| Copiar para o Google Agenda | Todo dia: entregas, folgas agendadas e passeios viram eventos (sem duplicar) |\n| Cópia de segurança | Domingo: uma cópia da planilha na pasta \"Meu Dia a Dia - Backups\" do Drive, guardando as 8 últimas |\n\nPara funcionar, os e-mails precisam estar **ligados** (botão \"Ligar e-mails automáticos\"). Se aparecer \"Sem permissão\", rode a função **autorizar** no editor do Apps Script. Depois de uma atualização que traz um e-mail novo, pause e ligue de novo para ele começar a valer."],["A planilha por dentro","Tudo fica em 6 abas, uma por área. O app cria e organiza as abas sozinho; o ideal é mexer pelo app, não direto na planilha.\n\n| Aba | Tipos de linha que ela guarda |\n| --- | --- |\n| **Calendário** | Dia, Folga, Código |\n| **Hábitos** | Hábito, Feitos no dia, Tarefa, Treino |\n| **Financeiro** | Lançamento, Gasto fixo, Limite do mês, Onde guardo, Cartão, Meta, Meta: movimento |\n| **Estudos** | Faculdade, Curso, Livro |\n| **Vida** | Lugar, Remédio, Diário, Data importante |\n| **Ajustes** | Ajuste, Evento na agenda |\n\n**As 7 colunas, iguais em todas as abas:** Tipo · ID · Data · Título · Valor · Status · Detalhes. A coluna Detalhes guarda o resto em formato técnico (JSON) e não deve ser editada à mão.\n\n- As linhas ficam em ordem de tipo e data.\n- Cada aba cresce sozinha quando precisa e guarda só as 7 colunas, para a planilha não pesar.\n- Os códigos de presença (nome, cor e se conta como extra) ficam nas linhas \"Código\" da aba Calendário.\n- Na primeira vez, o app converteu a planilha antiga (uma aba por assunto) e salvou uma cópia completa em \"Meu Dia a Dia - Backups\" no Drive antes de mexer.\n- **Localidade e fuso:** em Arquivo → Configurações, deixe Brasil e (GMT-03:00) São Paulo, para as datas não andarem um dia."],["Sem internet e problemas comuns","**Sem internet:** o app fica guardado no aparelho e abre normalmente, até no modo avião, com os dados da última sincronização. O que você salvar sem conexão aparece na hora e fica guardado; uma faixa laranja no topo mostra quantas alterações esperam a internet. Quando a conexão volta, o app envia tudo sozinho e traz o que mudou em outro aparelho. Ao voltar para o app depois de um tempo, ele também sincroniza; para forçar, use **Ajustes → Este aparelho → Sincronizar agora**.\n\nNa primeira vez em cada aparelho é preciso internet, para conectar e baixar os dados. Se o mesmo item for mudado no celular sem internet e no computador ao mesmo tempo, vale a última alteração enviada.\n\n| Problema | O que fazer |\n| --- | --- |\n| Pede para conectar de novo | A chave mudou (ou o app foi desconectado). Rode **configurarApp** no Apps Script e cole a chave |\n| \"Sem resposta da ponte\" ao conectar | Confira a internet e se a implantação está com acesso **Qualquer pessoa**. O endereço precisa terminar em /exec |\n| Atualizei o código e nada mudou | No Apps Script, faltou a Nova versão. No app, feche e abra de novo: a versão nova das telas entra na abertura seguinte |\n| Datas um dia antes ou depois | Arquivo → Configurações da planilha: Brasil e (GMT-03:00) São Paulo |\n| E-mails não chegam | Ajustes → E-mails automáticos: veja se estão \"Ligados\" e use \"Mandar um teste\". Se diz \"Sem permissão\", rode autorizar |\n| Lembrete do remédio não chega | O remédio precisa estar \"Em uso\", com horário, e o e-mail \"Hora do remédio\" ligado |\n| Gasto fixo não entrou | Ele entra no dia calculado (veja a data na etiqueta). Confira se está Ativo e, se for Prazo, se o último mês já passou |\n| Salário caiu num dia diferente do holerite | Teste a opção \"Sábado conta como dia útil\" no fixo e cadastre os feriados da sua cidade na engrenagem do Calendário |\n| Um domingo apagado não voltou | É de propósito: cada mês é preparado uma vez só. Use \"Preencher este mês agora\" na engrenagem do Calendário |\n| Apaguei algo sem querer | Abra a cópia de segurança mais recente na pasta \"Meu Dia a Dia - Backups\" do Drive e copie a linha de volta para a aba certa |\n| Perdi o celular | Rode **trocarChaveDoApp** no Apps Script: o celular antigo perde o acesso. Conecte os outros aparelhos com a chave nova |"],["Instalar e atualizar","O Meu Dia a Dia tem duas partes:\n\n- **O app:** as telas, num site seu e gratuito no GitHub Pages. No S25 ele é instalado como app; no computador, você abre o mesmo endereço no navegador.\n- **A ponte:** o arquivo **Codigo.gs** no Apps Script da planilha. É ele que lê e grava os dados, manda os e-mails e faz o backup.\n\n**Instalar no S25**\n\n1. Abra o endereço do app no **Chrome**.\n2. Toque em **⋮ → Instalar app** (ou no aviso \"Instalar\" que aparece embaixo).\n3. O ícone vai para a tela inicial. Abra por ele: o app ocupa a tela toda, sem barra do navegador.\n4. Na primeira abertura, cole o endereço da ponte e a chave.\n\nSegure o ícone do app para ver os atalhos: Lançar gasto, Presença de hoje e Diário de hoje. O botão voltar do celular fecha o painel aberto ou volta para a tela anterior.\n\n**No computador:** abra o mesmo endereço no navegador, conecte uma vez com o endereço da ponte e a chave, e salve nos favoritos.\n\n**A chave:** funciona como uma senha. Quem tiver o endereço da ponte e a chave consegue ler e mudar seus dados, então não mande para ninguém. Se vazar, rode **trocarChaveDoApp** no Apps Script e conecte de novo os seus aparelhos.\n\n**Atualizar**\n\n- **As telas:** suba os arquivos novos no repositório do GitHub (Add file → Upload files). O app pega a versão nova sozinho: ela aparece na abertura seguinte.\n- **A ponte:** cole o Codigo.gs novo no Apps Script e vá em **Implantar → Gerenciar implantações → ✏️ → Nova versão → Implantar**. O endereço não muda."]];

// =====================================================================
// Navegação e ações
// =====================================================================
const TELAS = {
  inicio: telaInicio, presenca: telaPresenca, financeiro: telaFinanceiro, faculdade: telaFaculdade,
  cursos: telaCursos, leitura: telaLeitura, diario: telaDiario, treinos: telaTreinos, lugares: telaLugares, farmacia: telaFarmacia, datas: telaDatas,
  conquistas: telaConquistas, mais: telaMais, ajustes: telaAjustes, manual: telaManual,
};
const NAV = [['inicio', '🏠', 'Início'], ['presenca', '📅', 'Calendário'], ['financeiro', '💰', 'Financeiro'],
  ['sep', '', 'ESTUDOS'], ['faculdade', '🎓', 'Faculdade'], ['cursos', '💻', 'Cursos'], ['leitura', '📚', 'Leitura'],
  ['sep', '', 'VIDA'], ['diario', '📝', 'Diário'], ['treinos', '🏋️', 'Treinos'], ['lugares', '📍', 'Lugares'], ['farmacia', '💊', 'Farmácia'], ['datas', '🎂', 'Datas'],
  ['sep', '', ''], ['conquistas', '🏆', 'Conquistas'], ['busca', '🔎', 'Buscar'], ['manual', '📖', 'Manual'], ['ajustes', '⚙️', 'Ajustes']];

function render() {
  $('main').innerHTML = TELAS[E.tela]();
  $('side').innerHTML = `<div class="logo"><i>✓</i>Meu Dia a Dia</div>` +
    NAV.map(([k, i, l]) => k === 'sep' ? `<div class="navsep">${l}</div>` : `<button class="navi ${k === E.tela ? 'on' : ''}" data-a="${k === 'busca' ? 'busca' : 'ir'}" data-v="${k}">${i} ${l}</button>`).join('');
  const sel = ['inicio', 'presenca', 'financeiro'].includes(E.tela) ? E.tela : 'mais';
  const item = ([k, i, l]) => `<button class="${sel === k ? 'on' : ''}" data-a="ir" data-v="${k}"><span class="ico">${i}</span>${l}</button>`;
  $('bnav').innerHTML = [['inicio', '🏠', 'Início'], ['presenca', '📅', 'Calendário']].map(item).join('') +
    `<button data-a="rapidas" aria-label="Adicionar"><span class="plus">+</span></button>` +
    [['financeiro', '💰', 'Finanças'], ['mais', '☰', 'Mais']].map(item).join('');
}

const ACOES = {
  ir: ({ v }) => {
    if (v === 'desejos') return ACOES.irFin({ v: 'metas' });
    if (v === 'habitos' || v === 'evolucao') { // telas antigas: hábitos agora é seção do Calendário; evolução é cartão do Início
      irPara(v === 'habitos' ? 'presenca' : 'inicio'); render();
      return requestAnimationFrame(() => { const el = v === 'habitos' && $('cal-habitos'); if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0); });
    }
    irPara(v); render(); window.scrollTo(0, 0);
  },
  irFin: ({ v }) => {
    irPara('financeiro'); render();
    const alvo = ALIAS_FIN[v] || v;
    if (!v || alvo === 'fin-resumo') window.scrollTo(0, 0);
    else requestAnimationFrame(() => { const el = $(alvo); if (el) el.scrollIntoView({ block: 'start' }); });
  },
  irSecao: ({ v }) => { const el = $(v); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  todosLanc: () => { E.verTodosLanc = !E.verTodosLanc; render(); },
  rapidas: abrirRapidas,
  fechar: fecharVeu,
  formSalvar: () => { const o = lerForm(); if (o) E.form.salvar(o); },
  formExcluir: () => E.form.excluir(),
  formExtra: ({ i }) => E.form.extras[+i].fn(),
  // presença
  abrirDia: ({ d }) => abrirDia(d),
  diaNav: ({ n }) => abrirDia(somaDias(E.diaAberto, +n)),
  codigo: ({ c }) => { E.codigoSel = c; $('diaCodigos').innerHTML = codigosPainel(); },
  salvarDia: ({ prox }) => salvarDiaAtual(!!prox),
  mesPres: ({ n }) => { E.mesPres = somaMes(E.mesPres, +n); render(); },
  prepararMes: abrirPrepararMes,
  hojePres: () => {
    const h = hojeIso();
    E.mesPres = h.slice(0, 7); E.pulsar = h; render();
    const el = document.querySelector('.day.today');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => { E.pulsar = null; }, 2500);
  },
  buscarDia: () => abrirForm({
    titulo: 'Ir para uma data', campos: [{ k: 'data', l: 'Data', t: 'date', obr: 1 }], valores: { data: hojeIso() },
    salvar: o => { E.mesPres = o.data.slice(0, 7); E.pulsar = o.data; render(); setTimeout(() => { E.pulsar = null; }, 2500); abrirDia(o.data); },
  }),
  novaFolga: () => abrirFolga(null),
  editarFolga: ({ id }) => abrirFolga(id),
  todasFolgas: () => { E.verTodasFolgas = !E.verTodasFolgas; render(); },
  copiarEmail: () => copiarTexto($('emTexto').value, 'emTexto'),
  copiarAssunto: () => copiarTexto($('emAssunto').value, 'emAssunto'),
  voltarEmail: () => E.emailFolga.voltar(),
  // hábitos
  hab: ({ d, h }) => {
    const id = d + '_' + h;
    if (T('HabitosLog').some(l => l.ID === id)) excluirItem('HabitosLog', id, '');
    else salvarItem('HabitosLog', { ID: id, Data: d, HabitoID: h }, '');
  },
  semHab: ({ n }) => { E.semHab = inicioSemana(somaDias(E.semHab, +n)); render(); },
  mesHab: ({ n }) => { E.semHab = inicioSemana(somaMes(E.semHab.slice(0, 7), +n) + '-15'); render(); },
  abaHab: ({ v }) => { E.abaHab = v; render(); },
  abaTodo: ({ v }) => { E.abaTodo = v; render(); },
  evo: ({ v }) => { E.evoSel = v; render(); },
  novoHabito: () => abrirHabito(null),
  editarHabito: ({ id }) => abrirHabito(id),
  tarefa: ({ id }) => { const t = T('Tarefas').find(x => x.ID === id); salvarItem('Tarefas', Object.assign({}, t, { Feito: !t.Feito }), ''); },
  novaTarefa: ({ escopo }) => abrirTarefa(null, escopo || 'semana'),
  editarTarefa: ({ id }) => abrirTarefa(id),
  editarFrase: () => abrirForm({
    titulo: 'Frase do dia', sub: 'No modo automático, a frase muda todo dia (também aparece no e-mail das 7h).',
    campos: [{ k: 'FraseModo', l: 'Modo', t: 'sel', op: ['Automática', 'Fixa'] },
      { k: 'Frase', l: 'Sua frase favorita', t: 'area', ajuda: 'No modo “Fixa”, aparece todo dia. No automático, entra no rodízio.' },
      { k: 'MinhasFrases', l: 'Outras frases suas (uma por linha)', t: 'area', ajuda: 'Entram no rodízio junto com as ' + (E.frases || []).length + ' frases do app.' }],
    valores: { FraseModo: cfg('FraseModo', 'Automática'), Frase: cfg('Frase', ''), MinhasFrases: cfg('MinhasFrases', '') },
    salvar: o => { fecharVeu(); salvarConfig(o, 'Frases salvas ✓'); },
  }),
  // financeiro
  mesFin: ({ n }) => { E.mesFin = somaMes(E.mesFin, +n); render(); },
  novoLanc: () => abrirLanc(null), editarLanc: ({ id }) => abrirLanc(id),
  novaReserva: () => abrirReserva(null), editarReserva: ({ id }) => abrirReserva(id),
  novoCartao: () => abrirCartao(null), editarCartao: ({ id }) => abrirCartao(id),
  novoFixo: () => abrirFixo(null), editarFixo: ({ id }) => abrirFixo(id),
  novoOrcamento: () => abrirOrcamento(null), editarOrcamento: ({ id }) => abrirOrcamento(id),
  fDesejos: ({ v }) => { E.fDesejos = v; render(); },
  novoDesejo: () => abrirDesejo(null), editarDesejo: ({ id }) => abrirDesejo(id), verDesejo: ({ id }) => abrirDesejoDetalhe(id),
  novoMov: ({ id, tipo }) => abrirMov(null, id, tipo), editarMov: ({ id }) => abrirMov(id),
  comprado: ({ id }) => { const d = T('Desejos').find(x => x.ID === id); salvarItem('Desejos', Object.assign({}, d, { Status: 'Comprado' }), 'Parabéns pela compra! 🎉'); abrirDesejoDetalhe(id); },
  // estudos
  novaAtividade: () => abrirAtividade(null), editarAtividade: ({ id }) => abrirAtividade(id),
  fCursos: ({ v }) => { E.fCursos = v; render(); }, novoCurso: () => abrirCurso(null), editarCurso: ({ id }) => abrirCurso(id),
  abaLeitura: ({ v }) => { E.abaLeitura = v; render(); }, novoLivro: () => abrirLivro(null), editarLivro: ({ id }) => abrirLivro(id), paginaLivro: ({ id }) => abrirPagina(id),
  escolherLivro: ({ i }) => { const b = E.buscaLivro, r = b.res[+i]; abrirLivro(b.id, Object.assign({}, b.atual, r, { Ano: r.Ano ? Number(r.Ano) : '', Sintese: r.Sintese || b.atual.Sintese })); },
  voltarLivro: () => abrirLivro(E.buscaLivro.id, E.buscaLivro.atual),
  // vida
  fLugares: ({ v }) => { E.fLugares = v; render(); }, novoLugar: () => abrirLugar(null), editarLugar: ({ id }) => abrirLugar(id),
  fFarm: ({ v }) => { E.fFarm = v; render(); }, novoRemedio: () => abrirRemedio(null), editarRemedio: ({ id }) => abrirRemedio(id),
  // novidades
  lancarHoje: ({ c }) => {
    const hoje = hojeIso(), fer = feriadoDe(hoje);
    E.diaAberto = hoje; E.codigoSel = c;
    abrirVeu(`<input type="checkbox" id="diaCob"><textarea id="diaObs">${esc(fer && /^FERI/.test(c) ? fer : '')}</textarea>`); // painel invisível: reaproveita o salvamento do dia
    fecharVeuSilencioso(); salvarDiaAtual(false);
  },
  rapidoLanc: ({ campo }) => {
    const el = $(campo || 'rapidoTxt');
    if (!el || !el.value.trim()) return toast('Escreva o gasto, por exemplo “mercado 52,30 pix”.', true);
    const o = interpretarLancamento(el.value);
    if (!o.Valor) return toast('Não achei o valor. Ex.: “mercado 52,30 pix”.', true);
    abrirLanc(null, o);
  },
  humor: ({ v }) => {
    const hoje = hojeIso(), d = T('Diario').find(x => x.Data === hoje);
    salvarItem('Diario', Object.assign({ Data: hoje, Texto: '' }, d, { Humor: +v }), HUMOR[+v].e + ' Anotado!');
  },
  humorForm: ({ v }) => { E.humorSel = E.humorSel === +v ? 0 : +v; document.querySelectorAll('#humSel button').forEach(b => b.classList.toggle('sel', +b.dataset.v === E.humorSel)); },
  escreverDiario: ({ d }) => abrirDiario(d || hojeIso()),
  mesDiario: ({ n }) => { E.mesDiario = somaMes(E.mesDiario, +n); render(); },
  novoTreino: ({ ex }) => abrirTreino(null, ex), editarTreino: ({ id }) => abrirTreino(id),
  novaData: () => abrirData(null), editarData: ({ id }) => abrirData(id),
  busca: abrirBusca,
  personalizar: () => { E.pers = null; abrirPersonalizar(); },
  persVer: ({ k }) => { const o = E.pers.ocultos; const i = o.indexOf(k); if (i >= 0) o.splice(i, 1); else o.push(k); },
  persMover: ({ i, n }) => { const a = E.pers.ordem, j = +i + +n; [a[+i], a[j]] = [a[j], a[+i]]; abrirPersonalizar(); },
  persPadrao: () => { E.pers = { ordem: CARTOES_INICIO.map(c => c[0]), ocultos: [] }; abrirPersonalizar(); },
  persSalvar: () => { const p = E.pers; fecharVeu(); E.pers = null; salvarConfig({ InicioCartoes: p.ordem.join(','), InicioOcultos: p.ocultos.join(',') }, 'Início personalizado ✓'); },
  conectar: () => conectar(), desconectar: () => desconectar(), sincronizarAgora: () => { ultimaSync = 0; toast('Sincronizando…'); sincronizar().then(() => toast(ultimaSync ? 'Tudo em dia ✓' : 'Sem conexão agora', !ultimaSync)); },
  // ajustes
  toggleCfg: ({ k }) => salvarConfig({ [k]: liga(k) ? 'não' : 'sim' }, ''),
  editarCfg: ({ g }) => abrirConfig(g),
  auto: ({ v }) => acaoAutomacao(v),
};

document.addEventListener('click', e => {
  if (e.target.id === 'veu') return fecharVeu();
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = ACOES[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el.dataset); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'cxUrl' || e.target.id === 'cxChave')) { e.preventDefault(); conectar(); }
  if (e.key === 'Escape') fecharVeu();
  if (e.key === 'Enter' && (e.target.id === 'rapidoTxt' || e.target.id === 'rapidoFin')) { e.preventDefault(); ACOES.rapidoLanc({ campo: e.target.id }); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && E.codigos.length) { e.preventDefault(); abrirBusca(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'anoPres') { E.mesPres = e.target.value + E.mesPres.slice(4); render(); }
});
document.addEventListener('toggle', e => { if (e.target.closest && e.target.closest('.manual') && e.target.open) E.manualAberto = +e.target.id.slice(4); }, true);
document.addEventListener('input', e => {
  if (e.target.id === 'manualBusca') {
    E.buscaManual = e.target.value; const pos = e.target.selectionStart; render();
    const el = $('manualBusca'); el.focus(); el.setSelectionRange(pos, pos);
  }
});
document.addEventListener('input', e => { if (e.target.id === 'busca') $('resBusca').innerHTML = buscar(e.target.value) || ''; });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { aplicarCor(); if (E.codigos.length) render(); });

// =====================================================================
// Início
// =====================================================================
function carregar(d) {
  E.codigos = d.codigos.slice().sort((a, b) => a.ordem - b.ordem);
  E.porCodigo = {};
  E.codigos.forEach(c => E.porCodigo[c.codigo] = c);
  E.dias = {};
  d.registros.forEach(r => E.dias[r.data] = { codigo: r.codigo, cobrindo: r.cobrindo, obs: r.obs });
  E.folgas = d.folgas;
  E.prazoFolga = d.prazoFolga;
  E.codigoDaFolga = d.codigoDaFolga;
  E.t = d.tabelas || {};
  E.frases = d.frases || [];
  aplicarTema(cfg('Tema', 'Automático'));
}
function telaConectar(erro) {
  document.body.classList.add('sem-nav');
  const c = ls.get(CONEXAO) || {};
  $('main').innerHTML = `<div class="conectar">
    <img class="logo-app" src="icone-192.png" alt="">
    <h1>Conectar à sua planilha</h1>
    <p class="nota">Uma vez por aparelho (celular e computador). Depois disso o app abre direto, até sem internet.</p>
    <ol><li>No editor do Apps Script, rode a função <b>configurarApp</b> e copie a chave que aparece no registro.</li>
      <li>Em <b>Implantar → Gerenciar implantações</b>, copie o endereço do App da Web (termina em <b>/exec</b>).</li></ol>
    <div class="card" style="margin-top:14px">
      <label class="campo">Endereço da ponte (termina em /exec)<input id="cxUrl" value="${esc(c.url || '')}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" inputmode="url"></label>
      <label class="campo">Chave do app<input id="cxChave" value="${esc(c.chave || '')}" placeholder="Cole a chave do configurarApp" autocomplete="off"></label>
      ${erro ? `<p class="nota" style="color:var(--r);font-weight:700;margin-bottom:8px">${esc(erro)}</p>` : ''}
      <button class="btnp" data-a="conectar">Conectar</button>
    </div></div>`;
}
async function conectar() {
  const url = $('cxUrl').value.trim(), chave = $('cxChave').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) return telaConectar('O endereço precisa ser o do App da Web, terminando em /exec.');
  if (chave.length < 20) return telaConectar('Cole a chave inteira que o configurarApp mostrou.');
  const b = document.querySelector('[data-a="conectar"]');
  b.disabled = true; b.textContent = 'Conectando…';
  try {
    await chamarPonte({ url, chave }, 'ping', [location.origin + location.pathname]);
  } catch (e) {
    ls.set(CONEXAO, { url, chave: '' });
    return telaConectar(e.codigo === 'chave' ? 'A chave não confere. Copie de novo do configurarApp.' : /network|tempo/.test(e.message) ? 'Sem resposta da ponte. Confira a internet e se a implantação está como “Qualquer pessoa”.' : e.message);
  }
  ls.set(CONEXAO, { url, chave });
  document.body.classList.remove('sem-nav');
  $('main').innerHTML = '<div class="carregando">Carregando sua planilha…</div>';
  iniciar();
}
function desconectar() {
  const n = (ls.get(FILA) || []).length;
  if (n && !confirm(`Há ${plural(n, 'alteração', 'alterações')} ainda não enviadas. Desconectar mesmo assim? Elas serão perdidas.`)) return;
  if (!n && !confirm('Desconectar este aparelho da planilha? Os dados continuam na planilha.')) return;
  [CONEXAO, CACHE, FILA].forEach(k => { try { localStorage.removeItem(k); } catch (e) { /* sem armazenamento */ } });
  location.reload();
}

/** Ao voltar para o app ou quando a internet volta: envia o que ficou guardado e traz o que mudou (ex.: no computador). */
let ultimaSync = 0, sincronizando = false;
async function sincronizar() {
  if (sincronizando || !E.codigos.length || !navigator.onLine) return;
  sincronizando = true;
  try {
    await enviarFila();
    if ((ls.get(FILA) || []).length) return;
    const d = await chamar('getDados');
    ultimaSync = Date.now();
    carregar(d);
    if (!$('veu').classList.contains('aberto') && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
    salvarCache();
  } catch (e) { /* sem conexão: tenta na próxima */ } finally { sincronizando = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - ultimaSync > 60000) sincronizar(); });

const TELA_INICIAL = { 'Início': 'inicio', 'Calendário': 'presenca', 'Financeiro': 'financeiro', 'Diário': 'diario', 'Treinos': 'treinos' };
const telaInicial = () => TELA_INICIAL[cfg('TelaInicial', 'Início')] || { 'Presença': 'presenca', 'Hábitos': 'presenca' }[cfg('TelaInicial', '')] || 'inicio';

async function iniciar() {
  if (!NO_GOOGLE && !(ls.get(CONEXAO) || {}).chave) return telaConectar();
  const hoje = hojeIso();
  E.mesPres = E.mesFin = E.mesDiario = hoje.slice(0, 7);
  E.semHab = inicioSemana(hoje);
  marcarFila();
  const cache = ls.get(CACHE);
  if (cache && cache.codigos) { // abre na hora com o que está no aparelho
    carregar(cache);
    E.tela = telaInicial();
    history.replaceState({ tela: E.tela }, '');
    render();
    abrirAtalho();
  }
  try {
    await enviarFila();
    if ((ls.get(FILA) || []).length) { if (!cache) throw new Error('sem internet'); return; } // ainda offline: fica com o cache
    const d = await chamar('getDados');
    ultimaSync = Date.now();
    const primeira = !cache || !cache.codigos;
    carregar(d);
    if (primeira) { E.tela = telaInicial(); history.replaceState({ tela: E.tela }, ''); }
    if (!$('veu').classList.contains('aberto')) render();
    if (primeira) abrirAtalho();
    salvarCache();
    verificarConquistas(!cfg('Conquistas', ''));
    prepararAutomatico();
    if (d.fixosLancados) toast(plural(d.fixosLancados, 'gasto fixo lançado', 'gastos fixos lançados') + ' neste mês ✓');
  } catch (e) {
    if (e.codigo === 'chave' && !NO_GOOGLE) return telaConectar(e.message);
    if (!cache) $('main').innerHTML = `<div class="carregando">${semRede(e) ? 'Sem internet. Na primeira vez, o app precisa de conexão para trazer seus dados.' : 'Erro ao carregar: ' + esc(e.message)}</div>`;
    else if (semRede(e)) marcarFila(); else toast('Erro ao atualizar: ' + e.message, true);
  }
}
/** Atalhos do ícone (segure o ícone do app): ?abrir=gasto | presenca | diario */
function abrirAtalho() {
  const a = new URLSearchParams(location.search).get('abrir');
  if (!a || !E.codigos.length) return;
  history.replaceState({ tela: E.tela }, '', location.pathname);
  if (a === 'gasto') ACOES.rapidas();
  else if (a === 'presenca') abrirDia(hojeIso());
  else if (a === 'diario') abrirDiario(hojeIso());
}
history.replaceState({ tela: E.tela }, '');
iniciar();
if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
